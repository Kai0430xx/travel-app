<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🧳 放風之旅</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="放風 ✈">
<meta name="theme-color" content="#FFFCF6">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3E3A39;
  --paper:#FFFCF6;
  --co:#F2A497;
  --ye:#F6D27A;
  --aq:#A8D3E6;
  --gr:#B9DAA5;
  --soft-line:#d9cdbd;
  --muted:#82776b
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0 auto;
  max-width:560px;
  min-height:100vh;
  background:var(--paper);
  color:var(--ink);
  font:15px/1.6 "Huninn","Noto Sans TC",system-ui,sans-serif;
  padding:0 14px calc(85px + env(safe-area-inset-bottom));
  touch-action:manipulation
}
h2,h3,h4,p{overflow-wrap:anywhere}
h2,h3{margin:0}
small{opacity:.75}
button,input,textarea,select{font:inherit}
button{color:inherit}
button,a,input,textarea,select{touch-action:manipulation}
button:disabled{opacity:.55;cursor:wait}
button:focus-visible,a:focus-visible,input:focus-visible,
textarea:focus-visible,select:focus-visible{
  outline:3px solid #297c92;
  outline-offset:3px
}
.box{
  border:3px solid var(--ink);
  border-radius:24px;
  background:var(--paper);
  box-shadow:3px 3px 0 var(--ink);
  padding:14px;
  margin:12px 0
}
.btn{
  font:inherit;
  font-size:13px;
  color:var(--ink);
  background:var(--ye);
  border:3px solid var(--ink);
  border-radius:999px;
  padding:6px 14px;
  cursor:pointer;
  box-shadow:2px 2px 0 var(--ink);
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  min-height:44px
}
.btn:active{
  transform:translate(2px,2px);
  box-shadow:none
}
.co{background:var(--co)}
.aq{background:var(--aq)}
.gr{background:var(--gr)}
.wide{width:100%}
header{
  position:sticky;
  top:0;
  z-index:50;
  background:var(--paper);
  border-bottom:3px solid var(--ink);
  margin:0 -14px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex;
  align-items:center;
  gap:8px;
  justify-content:space-between;
  flex-wrap:wrap
}
header>div{flex:1;min-width:150px}
header b,header small{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}
header>span{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:flex-end
}
header .btn{font-size:12px;padding:4px 9px}
.icon-button{
  width:40px;
  min-height:40px;
  padding:8px!important;
  background:var(--paper);
  border-width:2px
}
.icon-button svg{width:20px;height:20px;display:block}
.icon-button:hover svg{transform:rotate(25deg)}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin:12px 0;
  flex-wrap:wrap
}
.row>span{display:flex;flex-wrap:wrap;gap:8px}
.gap{justify-content:flex-end}
.hint{font-size:13px;opacity:.75;line-height:1.8}
.mute{text-align:center;opacity:.65;padding:18px 0}
.error{color:#a02b36;white-space:pre-line}
.notice{
  margin-top:12px;
  padding:10px 14px;
  border:2px dashed var(--ink);
  border-radius:16px;
  background:var(--ye);
  font-size:13px
}
.art{
  border:3px solid var(--ink);
  border-radius:24px;
  overflow:hidden;
  margin:12px 0;
  box-shadow:3px 3px 0 var(--ink);
  line-height:0
}
.art svg{width:100%;height:auto}
.auth-card{margin-top:22px}
.auth-card h2{text-align:center}
.auth-card .art{margin-top:0}
.text-button{
  display:block;
  margin:12px auto;
  background:none;
  border:0;
  font:inherit;
  color:var(--ink);
  text-decoration:underline;
  min-height:44px;
  cursor:pointer
}
label{display:block;font-size:13px}
input,textarea,select{
  font:inherit;
  font-size:16px!important;
  width:100%;
  border:3px solid var(--ink);
  border-radius:16px;
  background:#fff;
  padding:8px 12px;
  margin:4px 0 8px;
  color:var(--ink)
}
::placeholder{color:#b0a8a0;opacity:1}
.tag{
  display:inline-block;
  background:var(--ye);
  border:2px solid var(--ink);
  border-radius:999px;
  padding:0 10px;
  font-size:12px;
  margin-bottom:4px
}
.trip-card{
  display:grid;
  grid-template-columns:minmax(0,1fr) 94px;
  gap:16px;
  align-items:center;
  padding:18px
}
.trip-copy{min-width:0}
.trip-copy h3{
  font-size:17px;
  line-height:1.65;
  margin:8px 0 12px
}
.trip-role{font-size:11px;color:var(--muted)}
.countdown-ticket{
  align-self:stretch;
  border-left:2px dashed var(--soft-line);
  padding-left:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative
}
.countdown-ticket:before,.countdown-ticket:after{
  content:"";
  position:absolute;
  width:10px;
  height:10px;
  background:var(--paper);
  border:2px solid var(--soft-line);
  border-radius:50%;
  left:-6px
}
.countdown-ticket:before{top:-4px}
.countdown-ticket:after{bottom:-4px}
.countdown-ticket strong{
  font-size:38px;
  line-height:1.15;
  font-weight:normal;
  transform:rotate(-4deg)
}
.countdown-label{
  font:10px system-ui,sans-serif;
  letter-spacing:2px
}
.countdown-ticket small{font-size:12px}
.countdown-ticket.departure{
  background:var(--ye);
  border-radius:12px;
  border-left:0;
  padding:10px
}
.countdown-ticket.departure strong{font-size:24px}
.empty{text-align:center}
.pills{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:4px 2px 12px
}
.pill{
  font:inherit;
  flex:none;
  border:3px solid var(--ink);
  border-radius:999px;
  background:var(--paper);
  padding:4px 14px;
  cursor:pointer;
  color:var(--ink);
  min-height:44px
}
.pill.on{background:var(--aq)}
.schedule-list{
  display:flex;
  flex-direction:column;
  gap:10px
}
.schedule-link{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:19px 17px;
  background:var(--paper);
  border:2px solid var(--ink);
  border-radius:19px;
  box-shadow:2px 3px 0 var(--ink);
  font:inherit;
  text-align:left;
  cursor:pointer;
  line-height:1.6;
  min-height:68px
}
.schedule-link>b{font-weight:normal;overflow-wrap:anywhere}
.schedule-link>span{font-size:23px;opacity:.4;flex-shrink:0}
.schedule-link:hover{background:#fff6e6}
.schedule-link:active{
  transform:translate(1px,2px);
  box-shadow:1px 1px 0 var(--ink)
}
.eyebrow{
  font:10px system-ui,sans-serif;
  letter-spacing:2px
}
.detail-heading h2{font-size:21px;margin:8px 0}
.detail-note{border-top:1px dashed var(--soft-line);padding:12px 0}
.detail-note small{color:var(--muted)}
.detail-note p{margin:5px 0;overflow-wrap:anywhere}
.map-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  width:100%;
  max-width:560px;
  margin:0 auto;
  background:var(--paper);
  border-top:3px solid var(--ink);
  display:flex;
  justify-content:center;
  padding:6px 4px calc(4px + env(safe-area-inset-bottom));
  z-index:9999
}
nav button{
  flex:1;
  min-width:0;
  font:inherit;
  font-size:12px;
  border:3px solid transparent;
  border-radius:20px;
  background:none;
  padding:6px 2px;
  cursor:pointer;
  min-height:54px
}
nav button span{display:block;font-size:18px}
nav button.on{background:var(--ye);border-color:var(--ink)}
.mask{
  position:fixed;
  inset:0;
  background:rgba(62,58,57,.45);
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px
}
.sheet{
  width:100%;
  max-width:460px;
  max-height:88vh;
  overflow:auto;
  margin:0;
  overscroll-behavior:contain
}
.member-option{
  display:flex;
  gap:12px;
  align-items:center;
  border-bottom:2px dashed var(--soft-line);
  padding:12px 0
}
.member-option input{width:22px;height:22px;margin:0;flex:none}
.member-option small{display:block}
.account-people{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.person-chip{
  display:flex;
  align-items:center;
  gap:8px;
  background:#fff;
  border:2px solid var(--ink);
  border-radius:40px;
  padding:6px 12px 6px 6px
}
.person-chip small{
  font-size:10px;
  background:var(--ye);
  padding:0 5px;
  border-radius:8px
}
.person-avatar{
  background:var(--aq);
  width:30px;
  height:30px;
  border:1px solid var(--ink);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center
}
.chk{display:inline-flex;gap:4px;align-items:center;margin:0 10px 6px 0}
.chk input{width:auto;margin:0}
.passport-cover{
  margin:16px 0 24px;
  padding:22px 20px;
  background:#dce5d4;
  border:2px solid var(--ink);
  border-radius:12px 26px 26px 12px;
  box-shadow:5px 5px 0 #c2cbb9,7px 7px 0 var(--ink);
  position:relative;
  overflow:hidden
}
.passport-cover:before{
  content:"";
  position:absolute;
  left:7px;
  top:10px;
  bottom:10px;
  border-left:1px dashed #9da895
}
.passport-top{display:flex;justify-content:space-between;align-items:center}
.passport-seal{
  display:flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  border:2px double #829276;
  border-radius:50%;
  color:#52644b;
  transform:rotate(15deg)
}
.passport-owner{font-size:12px;margin:16px 0 5px;color:#58634f}
.passport-cover h2{font-size:21px;line-height:1.6}
.passport-metrics{display:flex;gap:40px;margin:22px 0}
.passport-metrics>div{display:flex;flex-direction:column}
.passport-metrics strong{
  font:36px/1.15 system-ui,sans-serif;
  letter-spacing:-1px
}
.passport-metrics strong small{font-size:15px;letter-spacing:0}
.passport-metrics>div>span{font-size:11px;margin-top:5px;color:#58634f}
.passport-progress{
  height:5px;
  background:#bdcbb2;
  border-radius:5px;
  overflow:hidden
}
.passport-progress i{height:100%;display:block;background:#52644b}
.passport-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
  font-size:11px;
  gap:8px
}
.album-link{
  background:none;
  border:0;
  padding:8px 0;
  font:inherit;
  text-decoration:underline;
  cursor:pointer;
  min-height:44px
}
.collection-heading{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:8px;
  margin:24px 0 12px
}
.collection-heading h3{font-size:16px}
.collection-heading small{font-size:10px;color:var(--muted)}
.stamp-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px
}
.travel-stamp{
  aspect-ratio:1/1.15;
  padding:10px 4px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:2px dashed #cfc5b6;
  border-radius:18px;
  color:#aa9f90;
  background:#f8f3e9
}
.stamp-symbol{
  font-size:25px;
  margin-bottom:6px;
  filter:grayscale(1);
  opacity:.4
}
.travel-stamp b{font-size:12px;font-weight:normal}
.travel-stamp small{font-size:9px;margin-top:3px;line-height:1.6}
.travel-stamp.on{
  border:2px solid #a8746e;
  background:#f7e6dd;
  color:#8d4f47;
  transform:rotate(-3deg);
  box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px #c79a90
}
.travel-stamp.on:nth-child(even){
  transform:rotate(3deg);
  background:#e4edf0;
  color:#496773;
  border-color:#7897a1;
  box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px #9fb4bc
}
.travel-stamp.on .stamp-symbol{filter:none;opacity:1}
.memory-strip{display:flex;gap:12px;overflow:auto;padding:6px 3px 12px}
.memory-print{
  flex:0 0 115px;
  background:#fff;
  border:1px solid #cbbfae;
  padding:7px 7px 12px;
  box-shadow:2px 3px 0 #e5dacc;
  font:inherit;
  cursor:pointer;
  transform:rotate(-2deg)
}
.memory-print:nth-child(even){transform:rotate(2deg)}
.memory-print img{width:99px;height:95px;object-fit:cover}
.memory-print small{
  font-size:10px;
  display:block;
  white-space:nowrap;
  text-overflow:ellipsis;
  overflow:hidden;
  margin-top:6px
}
.collection-tabs{
  display:flex;
  gap:16px;
  border-bottom:1px solid var(--soft-line);
  margin-bottom:18px
}
.collection-tabs button{
  font:inherit;
  font-size:12px;
  display:flex;
  gap:5px;
  border:0;
  border-bottom:2px solid transparent;
  background:none;
  padding:10px 0;
  color:var(--muted);
  min-height:44px;
  cursor:pointer
}
.collection-tabs button.active{color:var(--ink);border-color:var(--ink)}
.collection-tabs button span{
  font-size:10px;
  background:#eee4d3;
  min-width:18px;
  border-radius:8px
}
.collection-day h4{
  font-size:11px;
  letter-spacing:1px;
  margin:18px 0 8px;
  color:var(--muted)
}
.collection-stop{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  background:none;
  border:0;
  text-align:left;
  font:inherit;
  padding:16px 0;
  cursor:pointer;
  border-bottom:1px dashed var(--soft-line)
}
.stop-marker{
  width:36px;
  height:36px;
  border:1px dashed #b7a994;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f4ebdc;
  flex:none;
  color:#8c7d68
}
.collected .stop-marker{
  background:#dbe8d1;
  color:#52644b;
  border:1px solid #8b9a7e
}
.stop-caption{flex:1;min-width:0;display:flex;flex-direction:column}
.stop-caption small{font-size:10px;color:var(--muted)}
.stop-caption b{
  font-size:14px;
  font-weight:normal;
  line-height:1.6;
  overflow-wrap:anywhere;
  margin:3px 0
}
.stop-caption>span{font-size:10px;color:#a18c73}
.collected .stop-caption>span{color:#65795b}
.stop-arrow{font-size:20px;color:#aa9f90}
.stop-photo{
  width:48px;
  height:48px;
  object-fit:cover;
  border:3px solid #fff;
  box-shadow:1px 1px 3px #d0c4b3;
  transform:rotate(5deg);
  flex:none
}
.collection-empty{text-align:center;padding:30px 15px;color:var(--muted)}
.collection-empty>span{font-size:40px;display:block}
.collection-empty>b{display:block;font-size:14px}
.collection-empty p{font-size:12px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.album-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo-card{
  background:#fff;
  border:2px solid var(--ink);
  border-radius:16px;
  padding:6px;
  font:inherit;
  text-align:left;
  cursor:pointer;
  min-width:0;
  box-shadow:2px 2px 0 var(--ink)
}
.photo-card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.photo-card b,.photo-card small{
  display:block;
  font-size:12px;
  overflow-wrap:anywhere
}
.photo-zoom{width:100%;max-height:65vh;object-fit:contain;border-radius:16px}
.uid{overflow-wrap:anywhere;font-size:12px}
.lang{display:grid;grid-template-columns:104px 1fr;gap:10px}
.lang .btn{
  display:block;
  width:100%;
  text-align:left;
  margin-bottom:8px;
  font-size:12px
}
.lang .btn.on{background:var(--co)}
.reminder-label{font-size:11px;color:var(--muted);margin:20px 0 8px}
.reminder-section{
  padding:18px;
  border:2px solid var(--ink);
  border-radius:20px;
  background:#fffaf2;
  margin:12px 0;
  box-shadow:2px 3px 0 var(--ink)
}
.reminder-section h3{font-size:17px}
.source-line{
  font-size:10px;
  color:var(--muted);
  line-height:1.8;
  margin:12px 0 0
}
.source-line a,.reference-links a{color:inherit;text-underline-offset:3px}
.reference-links{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:12px}
.weather-strip{display:flex;overflow:auto;gap:8px;padding:8px 0}
.weather-day{
  flex:0 0 80px;
  text-align:center;
  background:#f3ebdd;
  border-radius:14px;
  padding:10px 4px;
  font-size:11px
}
.weather-day>b{display:block;font-size:20px;padding:5px 0}
.weather-day strong{font-size:12px}
.weather-day small{display:block;font-size:10px;margin-top:5px}
.weather-advice{font-size:12px;line-height:1.9;padding-left:18px}
.guide-excerpt{border-top:1px dashed var(--soft-line);padding:12px 0}
.guide-excerpt h4{margin:0;font-size:13px}
.guide-excerpt p{font-size:12px;white-space:pre-line;line-height:1.9;margin:6px 0}
.reminder-state{font-size:12px;color:var(--muted);line-height:1.9}
.reminder-refresh{
  font-size:11px;
  background:none;
  border:0;
  text-decoration:underline;
  cursor:pointer;
  min-height:44px
}
@keyframes fl{50%{transform:translateY(-5px)}}
@keyframes dr{from{transform:translateX(-9px)}to{transform:translateX(9px)}}
.fl{animation:fl 3s ease-in-out infinite}
.dr{animation:dr 6s ease-in-out infinite alternate}
@media(max-width:350px){
  .trip-card{grid-template-columns:minmax(0,1fr) 76px;gap:10px}
  .countdown-ticket strong{font-size:30px}
  .passport-cover{padding:18px 16px}
  .stamp-grid{gap:6px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
#status {
  display: none !important;
}
/* 新增按鈕與下方分類拉開距離 */
#packing-body #packing-add {
  margin-bottom: 26px;
}

#packing-body #packing-add > button {
  margin-top: 12px !important;
}

/* 隱藏每件物品下方的來源小字 */
#packing-body [data-pack-check] + span > small {
  display: none;
}

/* 刪除按鈕改成小巧的 ×，移除大圓框 */
#packing-body button[data-pack-delete] {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  width: 26px;
  height: 26px;
  min-width: 26px;
  min-height: 26px;
  flex-shrink: 0;

  margin: 0;
  padding: 0;
  border: none;
  border-radius: 6px;
  background: transparent;
  box-shadow: none;

  color: var(--ink);
  font-size: 18px;
  line-height: 1;
  opacity: 0.55;
}

#packing-body button[data-pack-delete]:hover {
  background: #f8e4df;
  opacity: 1;
}

#packing-body button[data-pack-delete]:active {
  transform: none;
  box-shadow: none;
}
</style>
</head>

<body>
<header>
  <button id="back" class="btn aq" hidden>← 旅程</button>
  <div>
    <b id="header-title">🧳 放風之旅</b>
    <small id="header-subtitle">登入，開始下一段冒險 ✨</small>
  </div>
  <span>
    <button id="refresh" class="btn icon-button"
      aria-label="重新整理" title="重新整理">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round"

/* ---------- 共用視窗 ---------- */
function modal(title, body, onSave = null) {
  const mask = document.createElement("div");
  mask.className = "mask";

  mask.innerHTML = `
    <div class="box sheet" role="dialog"
      aria-modal="true" tabindex="-1">
      <div class="row" style="margin-top:0">
        <h3>${title}</h3>
        <button class="btn close" aria-label="關閉">✕</button>
      </div>
      ${body}
      <p class="error modal-error" role="alert"></p>
      <div class="row gap">
        <button class="btn save">
          ${onSave ? "儲存" : "完成"}
        </button>
      </div>
    </div>
  `;

  const previousFocus = document.activeElement;
  let saving = false;

  function close() {
    if (saving) return;
    mask.remove();
    previousFocus?.focus();
  }

  q(mask, ".close").onclick = close;

  q(mask, ".save").onclick = async () => {
    if (saving) return;

    const button = q(mask, ".save");
    const original = button.textContent;

    saving = true;
    button.disabled = true;
    q(mask, ".close").disabled = true;
    q(mask, ".modal-error").textContent = "";
    button.textContent = onSave ? "儲存中…" : "完成";

    try {
      if (onSave && await onSave(mask) === false) return;

      mask.remove();

      if (onSave) notify("已儲存 ✨");

      previousFocus?.focus();
    } catch (error) {
      q(mask, ".modal-error").textContent = errorMessage(error);
    } finally {
      saving = false;
      button.disabled = false;
      button.textContent = original;
      q(mask, ".close").disabled = false;
    }
  };

  mask.onclick = event => {
    if (event.target === mask) close();
  };

  mask.onkeydown = event => {
    if (event.key === "Escape") {
      event.stopPropagation();
      close();
    }

    if (event.key === "Tab") {
      const controls = [
        ...mask.querySelectorAll(
          "button,input,select,textarea,a[href]"
        )
      ].filter(element =>
        !element.disabled && element.getClientRects().length
      );

      const first = controls[0];
      const last = controls.at(-1);

      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last?.focus();
      } else if (
        !event.shiftKey &&
        document.activeElement === last
      ) {
        event.preventDefault();
        first?.focus();
      }
    }
  };

  document.body.appendChild(mask);
  q(mask, ".sheet").focus();

  return mask;
}

function countdown(dateText = "") {
  const match = dateText.match(
    /(\d{4})[年/.-]?\s*(\d{1,2})[月/.-]\s*(\d{1,2})/
  );

  if (!match) {
    return {
      text:"日期待定",
      order:999999,
      days:null
    };
  }

  const start = new Date(
    Number(match[1]),
    Number(match[2]) - 1,
    Number(match[3])
  );

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const days = Math.ceil((start - today) / 86400000);

  return {
    text:
      days > 0 ? `倒數 ${days} 天` :
      days === 0 ? "今天出發" : "已出發",
    days,
    order:days >= 0 ? days : 888888 + Math.abs(days)
  };
}

$("auth-form").onsubmit = async event => {
  event.preventDefault();

  const username =
    $("auth-username").value.trim().toLowerCase();

  const password = $("auth-password").value;
  const nickname = $("auth-nickname").value.trim();

  $("auth-error").textContent = "";

  if (!/^[a-z][a-z0-9_]{2,23}$/.test(username)) {
    $("auth-error").textContent =
      "帳號限 3–24 個英文字母、數字或底線，並以英文字母開頭。";
    return;
  }

  if (authMode === "register") {
    if (!nickname || nickname.length > 30) {
      $("auth-error").textContent = "請輸入 1–30 字的暱稱。";
      return;
    }

    if (!/^\d{6,128}$/.test(password)) {
      $("auth-error").textContent = "密碼請使用至少 6 位數字。";
      return;
    }

    if (password !== $("auth-confirm").value) {
      $("auth-error").textContent = "兩次輸入的密碼不同。";
      return;
    }
  }

  $("auth-submit").disabled = true;

  try {
    if (authMode === "register") {
      sessionStorage.setItem("travel.pendingNickname", nickname);

      await createUserWithEmailAndPassword(
        auth,
        accountEmail(username),
        password
      );
    } else {
      sessionStorage.removeItem("travel.pendingNickname");

      await signInWithEmailAndPassword(
        auth,
        accountEmail(username),
        password
      );
    }

    $("auth-password").value = "";
    $("auth-confirm").value = "";
  } catch (error) {
    sessionStorage.removeItem("travel.pendingNickname");
    $("auth-error").textContent = errorMessage(error);
  } finally {
    $("auth-submit").disabled = false;
  }

async function ensureProfile(user) {
  const reference = doc(db, "users", user.uid);
  let snapshot = await getDoc(reference);

  if (!snapshot.exists()) {
    const username = user.email.split("@")[0];

    await setDoc(reference, {
      username,
      displayName:
        sessionStorage.getItem("travel.pendingNickname") || username,
      createdAt:Date.now()
    });

    snapshot = await getDoc(reference);
  }

  sessionStorage.removeItem("travel.pendingNickname");

  return snapshot.data();
}

  const revision = ++authRevision;

  stopProject();

  state.user = user;
  state.profile = null;

  $("projects").replaceChildren();
  $("home-view").hidden = true;
  $("auth-view").hidden = true;

    return;

  $("header-subtitle").textContent = "讀取帳號中…";

  try {
    const profile = await ensureProfile(user);

    if (revision !== authRevision) return;

    state.profile = profile;

    $("account").hidden = false;
    $("home-view").hidden = false;
    $("header-subtitle").textContent =
      `你好，${profile.displayName} ✨`;

    await renderProjects();

    if (pendingProject && revision === authRevision) {
      const target = pendingProject;
      pendingProject = null;

      history.replaceState({}, "", location.pathname);

      await openProject(target);
    }
  } catch (error) {
    if (revision !== authRevision) return;

    notify(
      errorMessage(error) +
      " 可登出後重新登入重試。"
    );
  }
}

/* ---------- 首頁 ---------- */
function projectCard(project, currentUid) {
  const info = countdown(project.dates);
  const upcoming = info.days !== null && info.days > 0;
  const today = info.days === 0;

  return `
    <article class="box trip-card">
      <div class="trip-copy">
        <span class="tag">${esc(project.dates || "日期待定")}</span>
        <div class="trip-role">
          ${project.ownerUid === currentUid
            ? "我的旅程 · 負責人"
            : "一起出發 · 旅程成員"}
        </div>
        <h3>${flag(project.name)} ${esc(project.name)}</h3>
        <button class="btn aq"
          data-project="${esc(project.id)}">
          打開旅程 →
        </button>
      </div>

      <aside class="countdown-ticket ${today ? "departure" : ""}">
        <span class="countdown-label">
          ${upcoming ? "COUNTDOWN" : today ? "LET’S GO" : "TRAVEL"}
        </span>
        <strong>
          ${
            upcoming ? info.days :
            today ? "今天" :
            info.days === null ? "待定" : "已出發"
          }
        </strong>
        <small>
          ${upcoming ? "天後出發" : today ? "出發日" : "下一段回憶"}
        </small>
      </aside>
    </article>
  `;
}

async function renderProjects() {
  if (!state.user || !state.profile) return;

  const revision = authRevision;
  const currentUid = uid();

  $("projects").innerHTML =
    '<p class="mute">正在整理你的旅程…☁️</p>';

  try {
    const [owned, joined] = await Promise.all([
      getDocs(query(
        collection(db, "projects"),
        where("ownerUid", "==", currentUid)
      )),
      getDocs(query(
        collection(db, "projects"),
        where("memberUids", "array-contains", currentUid)
      ))
    ]);

    if (revision !== authRevision) return;

    const projects = [
      ...new Map(
        [...owned.docs, ...joined.docs].map(snapshot => [
          snapshot.id,
          {...snapshot.data(), id:snapshot.id}
        ])
      ).values()
    ];

    projects.sort((a, b) =>
      countdown(a.dates).order - countdown(b.dates).order
    );

    $("projects").innerHTML = projects.length
      ? projects.map(project =>
          projectCard(project, currentUid)
        ).join("")
      : `
        <div class="box empty">
          <h3>下一段旅程，從這裡開始 🌱</h3>
          <p>建立旅程，或請負責人將你的帳號加入成員。</p>
        </div>
      `;

    $("projects").querySelectorAll("[data-project]")
      .forEach(button => {
        button.onclick = () => runButton(
          button,
          () => openProject(button.dataset.project)
        );
      });
  } catch (error) {
    if (revision !== authRevision) return;

    $("projects").innerHTML = `
      <div class="box">
        <p>旅程載入失敗，請確認網路與權限設定。</p>
        <button id="retry-projects" class="btn">重新載入</button>
      </div>
    `;

    $("retry-projects").onclick = renderProjects;
    notify(errorMessage(error));
  }
}

async function openProject(projectId) {
  if (!state.user || !state.profile) return;

  const revision = authRevision;
  const snapshot = await getDoc(
    doc(db, "projects", projectId)
  );

  if (revision !== authRevision) return;

  if (!snapshot.exists()) {
    notify("找不到旅程。");
    return;
  }

  const project = snapshot.data();

  if (
    project.ownerUid !== uid() &&
    !project.memberUids?.includes(uid())
  ) {
    notify("你尚未獲准加入這趟旅程。");
    return;
  }

  stopProject();

  state.project = {...project, id:projectId};

  startProject();
}

function goHome() {
  stopProject();

  $("home-view").hidden = !state.user;

  $("header-subtitle").textContent = state.profile
    ? `你好，${state.profile.displayName} ✨`
    : "請登入";

  if (state.user) renderProjects();
}

$("back").onclick = goHome;

function startProject() {
  const projectId = state.project.id;
  const revision = projectRevision;

  $("home-view").hidden = true;
  $("project-view").hidden = false;
  $("navigation").hidden = false;
  $("back").hidden = false;
  $("share").hidden = false;
  $("manage").hidden = !isOwner();

  $("header-title").textContent =
    flag(state.project.name) + " " + state.project.name;

  $("header-subtitle").textContent =
    "旅伴：" + myName();

  renderSchedules();
  renderCollection();
  renderExpenses();
  renderReminders();
  renderLanguage();

  function failed(error) {
    if (revision !== projectRevision) return;

    goHome();

    notify(
      "連線或權限已變更，請重新開啟旅程。" +
      errorMessage(error)
    );
  }

  state.unsubscribers.push(onSnapshot(
    doc(db, "projects", projectId),
    snapshot => {
      if (revision !== projectRevision) return;

      const project = snapshot.data();

      if (
        !project ||
        (
          project.ownerUid !== uid() &&
          !project.memberUids?.includes(uid())
        )
      ) {
        goHome();
        notify("你已不在這趟旅程的成員名單中。");
        return;
      }

      const destinationChanged =
        state.project.name !== project.name ||
        state.project.dates !== project.dates;

      state.project = {...project, id:projectId};

      $("manage").hidden = !isOwner();

      renderExpenses();

      if (destinationChanged) {
        $("header-title").textContent =
          flag(project.name) + " " + project.name;

        renderReminders();
        renderLanguage();
      }
    },
    failed
  ));

  function subscribe(name, callback) {
    state.unsubscribers.push(onSnapshot(
      collection(db, "projects", projectId, name),
      snapshot => {
        if (revision !== projectRevision) return;

        callback(snapshot.docs.map(item => ({
          ...item.data(),
          id:item.id
        })));
      },
      failed
    ));
  }

  subscribe("schedules", items => {
    state.schedules = items;
    renderSchedules();
    renderCollection();
  });

  subscribe("members", items => {
    state.members = items;
    renderExpenses();
  });

  subscribe("expenses", items => {
    state.expenses = items.sort((a, b) =>
      (a.createdAt || 0) - (b.createdAt || 0)
    );

    renderExpenses();
  });

  subscribe("checkins", items => {
    state.checkins = items;
    state.personalCheckins = {};

    items.filter(item => item.uploaderUid === uid())
      .forEach(item => {
        state.personalCheckins[item.scheduleId] = item;
      });

    renderCollection();
  });

  setDoc(
    doc(db, "projects", projectId, "members", uid()),
    {name:myName(), userUid:uid()},
    {merge:true}
  ).catch(failed);

  selectTab("schedule");
}

/* ---------- 行程排序 ---------- */
function timeOrder(time) {
  const match =
    String(time || "").match(/(\d{1,2})[:：](\d{2})/);

  return match
    ? Number(match[1]) * 60 + Number(match[2])
    : 1440;
}

function dayOrder(day) {
  if (/^\d{4}-\d{2}-\d{2}$/.test(day || "")) {
    return Date.parse(day) / 86400000;
  }

  return Number(
    String(day || "").replace(/\D/g, "")
  ) || 1;
}

function scheduleOrder(a, b) {
  return dayOrder(a.day) - dayOrder(b.day) ||
    timeOrder(a.time) - timeOrder(b.time) ||
    (a.createdAt || 0) - (b.createdAt || 0);
}

function validDay(day) {
  if (/^Day\s*[1-9]\d*$/i.test(day)) return true;

  if (
    !/^\d{4}-\d{2}-\d{2}$/.test(day) ||
    !Number.isFinite(Date.parse(day))
  ) return false;

  return new Date(day).toISOString().slice(0, 10) === day;
}

/* ---------- 地圖 ---------- */
function mapQuery(schedule) {
  const projectName = state.project?.name || "";

  const region = (
    projectName.match(
      /濟州島?|首爾|釜山|仁川|大邱|江陵|慶州|全州|束草|水原|東京|大阪|京都|沖繩|北海道|曼谷|清邁|新加坡|吉隆坡|香港|澳門|Jeju|Seoul|Busan/i
    ) || []
  )[0] || projectName;

  const place =
    schedule.place ||
    schedule.mapKeyword ||
    cleanTitle(schedule.title).replace(/^\[.*?\]\s*/, "");

  return [region, place].filter(Boolean).join(" ");
}

function safeMapUrl(raw, type) {
  try {
    const url = new URL(raw);

    const hosts = type === "google"
      ? [
          "google.com",
          "maps.google.com",
          "maps.app.goo.gl",
          "goo.gl"
        ]
      : [
          "map.naver.com",
          "naver.me",
          "m.map.naver.com"
        ];

    const validHost = hosts.some(host =>
      url.hostname === host ||
      url.hostname.endsWith("." + host)
    );

    return url.protocol === "https:" && validHost
      ? url
      : null;
  } catch {
    return null;
  }
}

function googleDestination(url) {
  const parameter =
    url.searchParams.get("destination") ||
    url.searchParams.get("query") ||
    url.searchParams.get("q");

  if (parameter) return parameter;

  const coordinates =
    url.href.match(/!3d(-?[\d.]+)!4d(-?[\d.]+)/);

  if (coordinates) {
    return coordinates[1] + "," + coordinates[2];
  }

  const place = url.pathname.match(/\/place\/([^/]+)/);

  if (place) {
    try {
      return decodeURIComponent(
        place[1].replace(/\+/g, " ")
      );
    } catch {
      return "";
    }
  }

  return "";
}

function mapUrl(schedule, type) {
  const custom = safeMapUrl(
    type === "naver"
      ? schedule.customNaverUrl
      : schedule.customGoogleUrl,
    type
  );

  const queryText = mapQuery(schedule);

  if (type === "naver") {
    return custom?.href ||
      "https://map.naver.com/p/search/" +
      encodeURIComponent(queryText);
  }

  const destination =
    (custom && googleDestination(custom)) || queryText;

  const placeId = custom && (
    custom.searchParams.get("destination_place_id") ||
    custom.searchParams.get("query_place_id")
  );

  const korea =
    destinationType(state.project?.name) === "korea";

  if (korea) {
    if (
      custom &&
      !custom.pathname.includes("/dir/")
    ) return custom.href;

    return "https://www.google.com/maps/search/?" +
      new URLSearchParams({
        api:"1",
        query:destination,
        ...(placeId ? {query_place_id:placeId} : {})
      });
  }

  return "https://www.google.com/maps/dir/?" +
    new URLSearchParams({
      api:"1",
      destination,
      dir_action:"navigate",
      travelmode:"driving",
      ...(placeId ? {destination_place_id:placeId} : {})
    });
}

/* ---------- 行程列表 ---------- */
function renderSchedules() {
  const days = [
    ...new Set(
      state.schedules.map(schedule =>
        schedule.day || "Day 1"
      )
    )
  ].sort((a, b) => dayOrder(a) - dayOrder(b));

  if (
    state.day !== "all" &&
    !days.includes(state.day)
  ) {
    state.day = "all";
  }

  $("days").innerHTML = ["all", ...days].map(day => `
    <button
      class="pill ${day === state.day ? "on" : ""}"
      data-day="${esc(day)}"
    >
      ${day === "all" ? "全部" : esc(day)}
    </button>
  `).join("");

  $("days").querySelectorAll("button")
    .forEach(button => {
      button.onclick = () => {
        state.day = button.dataset.day;
        renderSchedules();
      };
    });

  const list = state.schedules.filter(schedule =>
    state.day === "all" ||
    (schedule.day || "Day 1") === state.day
  ).sort(scheduleOrder);

  $("schedules").innerHTML = list.length
    ? list.map(schedule => {
        const time = String(schedule.time || "").trim();
        const day = schedule.day || "Day 1";
        const timeLabel = time || "時間待安排";
        const label = state.day === "all"
          ? `${day} · ${timeLabel}`
          : timeLabel;
        const title = cleanTitle(schedule.title);

        return `
          <button
            class="schedule-link"
            data-detail="${esc(schedule.id)}"
            aria-label="${esc(
              `${day}，${timeLabel}，${title}，查看行程詳情`
            )}"
          >
            <b style="
              display:flex;
              flex-direction:column;
              align-items:flex-start;
              gap:8px;
              min-width:0;
              font-weight:normal;
            ">
              <small style="
                display:inline-block;
                padding:2px 10px;
                border:1px solid var(--ink, #403c39);
                border-radius:999px;
                background:var(--yellow, #f4d681);
                color:var(--ink, #403c39);
                font-size:12px;
                line-height:1.5;
                font-weight:normal;
              ">
                ${esc(label)}
              </small>

              <span style="
                font-size:14px;
                line-height:1.6;
                overflow-wrap:anywhere;
              ">
                ${esc(title)}
              </span>
            </b>

            <span aria-hidden="true">›</span>
          </button>
        `;
      }).join("")
    : `
      <p class="mute">
        還沒有行程，新增或貼上文字導入吧 ✨
      </p>
    `;

  $("schedules").querySelectorAll("[data-detail]")
    .forEach(button => {
      button.onclick = () =>
        showSchedule(button.dataset.detail);
    });
}

function showSchedule(scheduleId) {
  const schedule = state.schedules.find(item =>
    item.id === scheduleId
  );

  if (!schedule) return;

  const notes = schedule.notes ?? schedule.location ?? "";
  const korea =
    destinationType(state.project.name) === "korea";

  const mask = modal("行程小卡", `
    <div class="detail-heading">
      <span class="eyebrow">TRAVEL NOTES</span>
      <h2>${esc(cleanTitle(schedule.title))}</h2>
      <p class="hint">
        ${esc(schedule.day || "Day 1")} ·
        ${esc(schedule.time || "全天")}
      </p>
    </div>

    ${schedule.place || schedule.mapKeyword ? `
      <div class="detail-note">
        <small>地點</small>
        <p>${esc(schedule.place || schedule.mapKeyword)}</p>
      </div>
    ` : ""}

    ${notes ? `
      <div class="detail-note">
        <small>旅行筆記</small>
        <p style="white-space:pre-wrap">${esc(notes)}</p>
      </div>
    ` : `
      <p class="hint">
        還沒有備註，點編輯記下預約或交通資訊。
      </p>
    `}

    <div class="map-actions">
      <a class="btn aq"
        target="_blank" rel="noopener noreferrer"
        href="${esc(mapUrl(schedule, "google"))}">
        Google Maps ↗
      </a>

      ${korea ? `
        <a class="btn gr"
          target="_blank" rel="noopener noreferrer"
          href="${esc(mapUrl(schedule, "naver"))}">
          Naver Map ↗
        </a>
      ` : ""}
    </div>

    <p class="hint">
      ${schedule.customGoogleUrl || schedule.customNaverUrl
        ? "已設定自訂地圖連結"
        : "依目的地與地點名稱搜尋，請確認分店是否正確。"}
    </p>

    <button class="btn co wide" id="edit-this-schedule">
      ✎ 編輯這個行程

  }

/* ---------- 文字導入 ---------- */
function parseItinerary(text) {
  let day = "Day 1";
  let current = null;

  const items = [];
  const warnings = [];

  const lines = text.split("\n")
    .map(line => line.trim())
    .filter(Boolean);

  for (const raw of lines) {
    const dayMatch = raw.match(
      /^(?:Day\s*(\d+)|第([一二三四五六七八九十\d]+)天)\s*(?:[：:、.\-].*)?$/i
    );

    const dateMatch = raw.match(
      /^(\d{4}-\d{2}-\d{2})$/
    );

    if (dayMatch || dateMatch) {
      if (current) items.push(current);

      current = null;

      if (dateMatch) {
        day = dateMatch[1];
      } else {
        const number = dayMatch[1] || (
          /^\d+$/.test(dayMatch[2])
            ? dayMatch[2]
            : "一二三四五六七八九十"
                .indexOf(dayMatch[2]) + 1
        );

        day = "Day " + number;
      }

      continue;
    }

    const normalized = raw.replace(/：/g, ":");

    const timeMatch = normalized.match(
      /^[•\-\s]*(\d{1,2}):(\d{2})\s*(.*)$/
    );

    if (
      timeMatch &&
      Number(timeMatch[1]) < 24 &&
      Number(timeMatch[2]) < 60
    ) {
      if (current) items.push(current);

      current = {
        day,
        time:
          timeMatch[1].padStart(2, "0") +
          ":" + timeMatch[2],
        title:timeMatch[3].trim(),
        location:""
      };
    } else if (current) {
      current.location +=
        (current.location ? "\n" : "") + raw;
    } else {
      warnings.push(raw);
    }
  }

  if (current) items.push(current);

  return {items, warnings};
}

const COLLECTION_CATEGORIES = {
  food:["美食家","🍴"],
  spot:["探險家","⌁"],
  shop:["購物達人","♧"]
};

function category(title = "") {
  if (
    /交通|機場|租車|還車|출발|空港/.test(title)
  ) return null;

  if (
    /餐廳|美食|咖啡|晚餐|午餐|早餐|烤肉|料理|吃|맛집|식당|카페|ร้านอาหาร/.test(title)
  ) return "food";

  if (
    /購物|免稅|超市|商場|買|마트|쇼핑|ช้อปปิ้ง/.test(title)
  ) return "shop";

  return "spot";
}

function compressImage(file) {
  return new Promise(resolve => {
    const reader = new FileReader();

    reader.onload = event => {
      const image = new Image();

      image.onload = () => {
        const canvas = document.createElement("canvas");
        const maximum = 500;

        let width = image.width;
        let height = image.height;

        if (width > height && width > maximum) {
          height *= maximum / width;
          width = maximum;
        } else if (height > maximum) {
          width *= maximum / height;
          height = maximum;
        }

        canvas.width = width;
        canvas.height = height;

        canvas.getContext("2d").drawImage(
          image, 0, 0, width, height
        );

        resolve(canvas.toDataURL("image/jpeg", .6));
      };

      image.onerror = () => resolve("");
      image.src = event.target.result;
    };

    reader.onerror = () => resolve("");
    reader.readAsDataURL(file);
  });
}

function openCheckin(scheduleId) {

    item.id === scheduleId
  );

  if (!schedule) return;

  const current = state.personalCheckins[scheduleId];

  const reference = doc(
    db,
    "projects",
    state.project.id,
    "checkins",
    scheduleId + "_" + uid()
  );

  const mask = modal(esc(cleanTitle(schedule.title)), `

  `);

  q(mask, "#upload-photo").onclick = () =>

      if (!file) {
        alert("請先選擇照片。");
        return false;

      const photoUrl = await compressImage(file);

        alert(
          "圖片壓縮失敗或檔案過大，請換一張較小的照片。"
        );

      await setDoc(reference, {

      });

      mask.remove();
      notify("已加入我的收藏 ✨");

      runButton(cancelButton, async () => {
        await deleteDoc(reference);
        mask.remove();
      });
  }
}

/* ---------- 分帳名單 ---------- */
function accountingNames() {
  const allowed = new Set(
    state.project?.memberUids || []
  );

  const accounts = new Map();

  for (const record of state.members) {
    const accountId = record.userUid || record.id;

    if (allowed.has(accountId) && record.name) {
      accounts.set(accountId, record.name);
    }
  }

  if (allowed.has(uid())) {
    accounts.set(uid(), myName());
  }

  return [...accounts.values()];
}

function memberLabel(name) {
  const simple = value =>
    value.replace(/\s*\(@[a-z0-9_]+\)$/i, "");

  const label = simple(name);
  const duplicates = accountingNames().filter(other =>
    simple(other) === label
  ).length;

  return duplicates > 1 ? name : label;
}

          if (value > 0) {

        invalid ||
        Math.abs(sum - amount) > .01
      ) {

        return false;

/* ---------- 結算 ---------- */
function calculateTransfers(balance) {
  const creditors = [];
  const debtors = [];

  for (const [name, amount] of Object.entries(balance)) {
    if (amount > .01) creditors.push([name, amount]);
    if (amount < -.01) debtors.push([name, -amount]);
  }

  const transfers = [];

  while (creditors.length && debtors.length) {
    creditors.sort((a, b) => b[1] - a[1]);
    debtors.sort((a, b) => b[1] - a[1]);

    const amount = Math.min(
      creditors[0][1],
      debtors[0][1]
    );

    transfers.push({
      from:debtors[0][0],
      to:creditors[0][0],
      amount
    });

    creditors[0][1] -= amount;
    debtors[0][1] -= amount;

    if (creditors[0][1] < .01) creditors.shift();
    if (debtors[0][1] < .01) debtors.shift();
  }

  return transfers;
}

$("settle").onclick = () => {
  const groups = {};

  state.expenses.forEach(expense => {
    const currency = expense.cur || "TWD";

    const settlementCurrency =
      expense.settle === "orig"
        ? currency
        : "TWD";

    if (!groups[settlementCurrency]) {
      groups[settlementCurrency] = {};
    }

    const balance = groups[settlementCurrency];

    const total = settlementCurrency === currency
      ? expense.amount
      : expense.amount * (RATE[currency] || 1);

    balance[expense.payer] =
      (balance[expense.payer] || 0) + total;

    const shares =
      expense.split &&
      Object.keys(expense.split).length
        ? expense.split
        : {[expense.payer]:expense.amount};

    const shareTotal = Object.values(shares)
      .reduce((sum, value) =>
        sum + Number(value), 0
      );

    for (const [name, value] of Object.entries(shares)) {
      const share = shareTotal
        ? total * Number(value) / shareTotal
        : 0;

      balance[name] =
        (balance[name] || 0) - share;
    }
  });

  let html = "";

  for (const [currency, balance] of Object.entries(groups)) {
    const transfers = calculateTransfers(balance);

    if (!transfers.length) continue;

    html += `
      <h3>${esc(currency)} 結算</h3>
      ${transfers.map(transfer => `
        <div class="box" style="background:var(--aq)">
          ${esc(transfer.from)} ➜ ${esc(transfer.to)}
          <b>
            ${esc(currency)}
            ${transfer.amount.toLocaleString(
              undefined,
              {maximumFractionDigits:2}
            )}
          </b>
        </div>
      `).join("")}
    `;
  }

  modal(
    "📊 結算明細",
    html || '<p class="mute">目前不需要轉帳 🎉</p>'
  );
};

async function publicJSON(url, signal) {
  const controller = new AbortController();
  const abort = () => controller.abort();

  if (signal?.aborted) {
    throw new DOMException("Aborted", "AbortError");
  }

  signal?.addEventListener(
    "abort",
    abort,
    {once:true}
  );

  const timer = setTimeout(abort, 12000);

  try {
    const response = await fetch(url, {
      signal:controller.signal,
      credentials:"omit",
      referrerPolicy:"no-referrer"
    });

    if (!response.ok) {
      throw new Error("Source unavailable");
    }

    return await response.json();
  } finally {
    clearTimeout(timer);
    signal?.removeEventListener("abort", abort);
  }
}

function wikiURL(destination, section = "") {
  return "https://zh.wikivoyage.org/wiki/" +
    encodeURIComponent(destination) +
    (
      section
        ? "#" + encodeURIComponent(section)
        : ""
    );
}

async function fetchGuide(destination, signal) {
  const api = "https://zh.wikivoyage.org/w/api.php";

  const url = new URL(api);

  url.search = new URLSearchParams({
    action:"parse",
    page:destination.name,
    prop:"sections",
    format:"json",
    origin:"*",
    redirects:"1"
  });

  const result = await publicJSON(url, signal);

  if (!result.parse?.sections) {
    throw new Error("Guide unavailable");
  }

  const sections = result.parse.sections.filter(section =>
    /安全|健康|氣候|气候|交通|抵達|抵达|通訊|通讯|尊重|注意/
      .test(section.line)
  ).slice(0, 4);

  if (!sections.length) {
    throw new Error("No matching travel sections");
  }

  const excerpts = await Promise.all(
    sections.map(async section => {
      const part = new URL(api);

      part.search = new URLSearchParams({
        action:"parse",
        page:destination.name,
        section:section.index,
        prop:"text",
        format:"json",
        origin:"*",
        redirects:"1"
      });

      try {
        const data = await publicJSON(part, signal);
        const html = data.parse?.text?.["*"];

        if (!html) return null;

        const template =
          document.createElement("template");

        template.innerHTML = html;

        template.content.querySelectorAll(
          "script,style,sup,table,.mw-editsection,.hatnote,.toc"
        ).forEach(node => node.remove());

        const text = [
          ...template.content.querySelectorAll("p,li")
        ].map(node =>
          node.textContent.replace(/\s+/g, " ").trim()
        ).filter(line =>
          line.length > 12
        ).slice(0, 2).join("\n");

        if (!text) return null;

        const heading =
          document.createElement("template");

        heading.innerHTML = section.line;

        return {
          title:heading.content.textContent,
          text:
            text.slice(0, 700) +
            (text.length > 700 ? "…" : ""),
          url:wikiURL(
            destination.name,
            section.anchor
          )
        };
      } catch (error) {
        if (signal.aborted) throw error;
        return null;
      }
    })
  );

  const items = excerpts.filter(Boolean);

  if (!items.length) {
    throw new Error("Guide unavailable");
  }

  return {
    items,
    at:Date.now()
  };
}

async function fetchWeather(destination, signal) {
  const url = new URL(
    "https://api.open-meteo.com/v1/forecast"
  );

  url.search = new URLSearchParams({
    latitude:destination.latitude,
    longitude:destination.longitude,
    daily:[
      "weather_code",
      "temperature_2m_max",
      "temperature_2m_min",
      "precipitation_probability_max",
      "wind_speed_10m_max"
    ].join(","),
    timezone:"auto",
    forecast_days:"7",
    wind_speed_unit:"kmh"
  });

  const data = await publicJSON(url, signal);
  const daily = data.daily;

  if (
    !daily ||
    !Array.isArray(daily.time) ||
    !daily.time.length
  ) {
    throw new Error("Weather unavailable");
  }

  for (const field of [
    "weather_code",
    "temperature_2m_max",
    "temperature_2m_min",
    "precipitation_probability_max",
    "wind_speed_10m_max"
  ]) {
    if (
      !Array.isArray(daily[field]) ||
      daily[field].length !== daily.time.length
    ) {
      throw new Error("Incomplete weather response");
    }
  }

  return {
    daily,
    at:Date.now()
  };
}

function weatherSymbol(code) {
  if (code === 0) return "☀";
  if (code <= 3) return "⛅";
  if (code === 45 || code === 48) return "≋";
  if (code >= 95) return "⛈";

  if ([71,73,75,77,85,86].includes(code)) {
    return "❄";
  }

  return "☂";
}

function weatherScope(dates, times) {
  const match = String(dates || "").match(
    /(\d{4})[年/.-]?\s*(\d{1,2})[月/.-]\s*(\d{1,2})/
  );

  if (!match) {
    return "以下為目的地近期預報，請確認是否涵蓋你的出發日期。";
  }

  const start =
    match[1] + "-" +
    match[2].padStart(2, "0") + "-" +
    match[3].padStart(2, "0");

  return times.includes(start)
    ? "預報涵蓋出發日；行程後段仍可能超出預報範圍。"
    : "旅程日期不在目前預報範圍內，以下僅供近期天氣參考，並非旅程當天預報。";
}

function weatherAdvice(daily) {
  const numbers = field =>
    daily[field].filter(value =>
      typeof value === "number" &&
      Number.isFinite(value)
    );

  const notes = [];

  if (
    numbers("temperature_2m_min")
      .some(value => value < 12)
  ) {
    notes.push("近期低溫偏涼，準備保暖層與薄外套。");
  }

  if (
    numbers("temperature_2m_max")
      .some(value => value >= 30)
  ) {
    notes.push("近期白天可能炎熱，安排補水、遮陽與休息。");
  }

  if (
    numbers("precipitation_probability_max")
      .some(value => value >= 60)
  ) {
    notes.push(
      "近期部分時段降雨機率較高，準備雨具並保留室內備案。"
    );
  }

  if (
    numbers("wind_speed_10m_max")
      .some(value => value >= 35)
  ) {
    notes.push(
      "近期可能有較強風，海邊、山區與船班出發前請再次確認狀況。"
    );
  }

  if (
    daily.weather_code.some(code =>
      [71,73,75,77,85,86].includes(code)
    )
  ) {
    notes.push(
      "近期預報包含降雪，自駕前請查道路狀況並確認車輛配備。"
    );
  }

  return notes.length
    ? notes
    : [
        "近期預報沒有觸發額外穿搭提示，出發前仍請重新確認天氣。"
      ];
}

function sourceTime(at) {
  return new Date(at).toLocaleString(
    "zh-TW",
    {hour12:false}
  );
}

function weatherHTML(data, destination, dates, stale = false) {
  const daily = data.daily;

  const temperature = value =>
    typeof value === "number" && Number.isFinite(value)
      ? Math.round(value) + "°"
      : "—";

  return `
    <p class="hint">
      ${esc(weatherScope(dates, daily.time))}
    </p>

    ${stale ? `
      <p class="reminder-state">
        更新失敗，以下保留上次成功查詢的資料。
      </p>
    ` : ""}

    <div class="weather-strip">
      ${daily.time.map((date, index) => `
        <div class="weather-day">
          <span>
            ${esc(date.slice(5).replace("-", "/"))}
          </span>
          <b>${weatherSymbol(daily.weather_code[index])}</b>
          <strong>
            ${temperature(daily.temperature_2m_min[index])}
            –
            ${temperature(daily.temperature_2m_max[index])}
          </strong>
          <small>
            降雨
            ${esc(
              daily.precipitation_probability_max[index] ?? "—"
            )}%
          </small>
        </div>
      `).join("")}
    </div>

    <ul class="weather-advice">
      ${weatherAdvice(daily).map(note => `
        <li>${esc(note)}</li>
      `).join("")}
    </ul>

    <p class="source-line">
      來源：
      <a href="https://open-meteo.com/"
        target="_blank" rel="noopener noreferrer">
        Open-Meteo
      </a>
      · 查詢 ${esc(sourceTime(data.at))}
      <br>
      位置：${esc(destination.name)}市區代表點；
      山區、海岸與離島可能不同。
      <br>
      以上為預報推導的準備建議，不是官方即時警報。
    </p>
  `;
}

function guideHTML(data, destination, stale = false) {
  return `

      <p class="reminder-state">

function renderReminders(force = false) {
  reminderController?.abort();
  reminderController = new AbortController();

  const signal = reminderController.signal;
  const revision = projectRevision;

  const destination = reminderDestination(
    state.project?.name
  );

  const dates = state.project?.dates || "";

  $("tab-reminders").innerHTML = `
    <div class="detail-heading">
      <span class="eyebrow">BEFORE YOU GO</span>

      <h2>
        ${esc(
          destination?.name ||
          state.project?.name ||
          ""
        )}・出發準備清單
      </h2>

      <p class="hint">
        天氣自動查詢；穿著、金錢、充電與行前事項
        依目的地整理。
      </p>
    </div>

    <section class="reminder-section">
      <div class="row" style="margin-top:0">
        <h3>01 天氣與近期預報</h3>

        <button class="reminder-refresh"
          id="reminders-refresh">
          重新查詢 ↻
        </button>
      </div>

      <div id="weather-result" class="reminder-state">
        ${destination
          ? "正在查詢近期預報…"
          : "目前無法從專案名稱確認城市，因此未查詢天氣。"}
      </div>
    </section>

    ${basicReminders()}

    <section class="reminder-section">
      <h3>查證與延伸閱讀</h3>

      <p class="hint">
        上方行前準備為固定參考，
        並非即時入境政策或官方警報。
      </p>

      ${destination ? `
        <div class="reference-links">
          <a href="${esc(destination.official)}"
            target="_blank"
            rel="noopener noreferrer">
            官方旅遊資訊 ↗
          </a>

          <a href="${esc(wikiURL(destination.name))}"
            target="_blank"
            rel="noopener noreferrer">
            維基導遊原頁 ↗
          </a>
        </div>
      ` : ""}

      <details style="margin-top:14px">
        <summary class="hint">
          補充旅遊網頁摘錄
        </summary>

        <div id="guide-result" class="reminder-state">
          ${destination
            ? "正在讀取補充網頁資訊…"
            : "目前無法確認對應頁面。"}
        </div>
      </details>
    </section>
  `;

  $("reminders-refresh").onclick = () =>
    renderReminders(true);

  if (!destination) return;

  const cache =
    reminderCache.get(destination.name) || {};

  let remaining = 2;

  $("reminders-refresh").disabled = true;

  function complete() {
    remaining--;

    if (
      remaining === 0 &&
      revision === projectRevision &&
      !signal.aborted
    ) {
      $("reminders-refresh").disabled = false;
    }
  }

  for (const kind of ["weather", "guide"]) {
    const target = kind === "weather"
      ? "weather-result"
      : "guide-result";

    function render(data, stale = false) {
      if (
        revision !== projectRevision ||
        signal.aborted
      ) return;

      $(target).innerHTML = kind === "weather"
        ? weatherHTML(
            data,
            destination,
            dates,
            stale
          )
        : guideHTML(
            data,
            destination,
            stale
          );
    }

    if (
      !force &&
      cache[kind] &&
      Date.now() - cache[kind].at <
        30 * 60 * 1000
    ) {
      render(cache[kind]);
      complete();
      continue;
    }

    const operation = kind === "weather"
      ? fetchWeather(destination, signal)
      : fetchGuide(destination, signal);

    operation.then(data => {
      if (
        signal.aborted ||
        revision !== projectRevision
      ) return;

      cache[kind] = data;

      reminderCache.set(
        destination.name,
        cache
      );

      render(data);
    }).catch(() => {
      if (
        signal.aborted ||
        revision !== projectRevision
      ) return;

      if (cache[kind]) {
        render(cache[kind], true);
      } else {
        $(target).textContent =
          kind === "weather"
            ? "目前無法讀取天氣來源，請稍後重新查詢。其他行前準備仍可查看。"
            : "補充網頁目前無法讀取，可使用上方官方連結查證；不影響主要準備清單。";
      }
    }).finally(complete);
  }
}

      `).join("");

    $("language-phrases")
      .querySelectorAll("[data-phrase]")
      .forEach(button => {
        button.onclick = () => {
          const phrase =
            phrases[Number(button.dataset.phrase)];

          state.phrase = phrase;

          $("phrase-chinese").textContent = phrase[0];
          $("phrase-foreign").textContent = phrase[1];
        };
      });
  }

  $("language-categories").innerHTML =
    LANGUAGE_CATEGORIES.map(([key, label]) => `
      <button class="btn" data-category="${key}">
        ${label}
      </button>
    `).join("");

  $("language-categories")
    .querySelectorAll("button")
    .forEach(button => {
      button.onclick = () =>
        show(button.dataset.category);
    });

  show("airport");
}

  if (!state.phrase) return;

  if (!("speechSynthesis" in window)) {
    notify("這個瀏覽器不支援朗讀。");

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(state.phrase[1]);

  utterance.lang = currentLanguage().code;

  speechSynthesis.speak(utterance);
};

/* ---------- 自動選中今天 ---------- */

function tripDate(text) {
  const match = String(text || "").match(
    /(\d{4})[年/.-]?\s*(\d{1,2})[月/.-]\s*(\d{1,2})/
  );

  if (!match) return null;

  const value = Date.UTC(
    Number(match[1]),
    Number(match[2]) - 1,
    Number(match[3])
  );

  const expected =
    `${match[1]}-` +
    `${match[2].padStart(2, "0")}-` +
    `${match[3].padStart(2, "0")}`;

  return new Date(value).toISOString().slice(0, 10) === expected
    ? value
    : null;
}

function todayDay(now = new Date()) {
  const parts = Object.fromEntries(
    new Intl.DateTimeFormat("en-US", {
      timeZone: "Asia/Taipei",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(now).map(part => [
      part.type,
      part.value
    ])
  );

  const iso = `${parts.year}-${parts.month}-${parts.day}`;
  const start = tripDate(state.project?.dates);

  const number = start === null
    ? null
    : Math.floor((Date.parse(iso) - start) / 86400000) + 1;

  const days = [
    ...new Set(
      state.schedules.map(schedule =>
        schedule.day || "Day 1"
      )
    )
  ];

  return days.find(day =>
    day === iso ||
    (
      /^Day\s*\d+$/i.test(day) &&
      Number(day.replace(/\D/g, "")) === number
    )
  ) || null;
}

const oldRenderSchedules = renderSchedules;

renderSchedules = function () {
  const today = todayDay();

  if (extra.pendingDay && state.schedules.length) {
    state.day = today || "all";
    extra.pendingDay = false;
  }

  oldRenderSchedules();

  $("days").querySelectorAll("button").forEach(button => {
    if (button.dataset.day === today) {
      button.textContent += " · 今天";

      button.style.background =
        button.dataset.day === state.day
          ? "#b9d7ac"
          : "#edf4e7";

      button.style.borderColor = "#536747";
      button.style.fontWeight = "bold";
    }

    const original = button.onclick;

    button.onclick = () => {
      extra.pendingDay = false;
      original();
    };
  });
};

      "護照與必要入境文件",
      "機票、住宿與保險資料",
      "信用卡與少量當地現金"
    ],
    "衣物": [
      "每日換洗衣物與內衣襪",
      "舒適好走的鞋",
      "睡衣與薄外套"
    ],
    "盥洗保養": [
      "牙刷牙膏與個人清潔用品",
      "個人保養品",
      "眼鏡與隱形眼鏡用品（依需要）"
    ],
    "電子與充電": [
      "手機與充電線",
      "充電器與適用轉接頭",
      "行動電源（確認航空公司規定）",
      "SIM／eSIM／漫遊設定"
    ],
    "藥品": [
      "個人常備藥與處方資料",
      "OK繃與簡易急救用品"
    ],
    "防曬雨具": [
      "防曬用品與帽子",
      "折疊傘或輕便雨衣"
    ],
    "其他": [
      "隨身小包",
      "水壺與購物袋"
    ]
  };

  const month = new Date(
    tripDate(state.project?.dates) || Date.now()
  ).getUTCMonth() + 1;

  if (
    ["korea", "japan"].includes(
      destinationType(state.project.name)
    )
  ) {
    if (month <= 3 || month >= 11) {
      groups.衣物.push(
        "保暖外套與分層衣物（依實際氣溫調整）"
      );
    } else if (month >= 6 && month <= 9) {
      groups.衣物.push("透氣快乾衣物");
    }
  }

  return Object.entries(groups).flatMap(
    ([category, labels]) =>
      labels.map(label => newItem(category, label))
  );
}

async function mutatePacking(
  change,
  reference = packingRef()
) {
  const initialItems = basicPacking();

  await runTransaction(db, async transaction => {
    const snapshot = await transaction.get(reference);

    const data = snapshot.exists()
      ? snapshot.data()
      : {
          items: initialItems,
          removed: [],
          webStatus: "尚未更新",
          sources: []
        };

    change(data);

    if (data.items.length > 300) {
      throw new Error(
        "每趟旅程最多保留 300 件物品。"
      );
    }

    transaction.set(reference, {
      ...data,
      updatedAt: Date.now()
    });
  });
}

async function packingAction(button, operation) {
  button.disabled = true;

  try {
    await operation();
  } catch (error) {
    drawPacking();

    if (extra.mask?.isConnected) {
      q(extra.mask, ".modal-error").textContent =
        error.code
          ? errorMessage(error)
          : error.message;
    }
  } finally {
    button.disabled = false;
  }
}

                )

      <p class="hint">

      <select id="packing-category">

          <option>${category}</option>
        `).join("")}
      </select>

      <input
        id="packing-label"

        required
        placeholder="例如：保溫瓶"
      >

      <button
        class="btn aq"
        style="margin-top:8px"
      >
        ＋ 新增物品
      </button>
    </form>

    ${PACK_CATEGORIES.map(category => `
      <h3>${category}</h3>
      ${
        items.filter(item =>
          item.category === category
        ).map(item => `
          <div
            class="row"
            style="align-items:flex-start;flex-wrap:nowrap;gap:8px"
          >
            <label style="
              display:flex;
              gap:10px;
              flex:1;
              min-width:0;
              align-items:flex-start;
            ">
              <input
                type="checkbox"
                data-pack-check="${esc(item.id)}"
                ${item.done ? "checked" : ""}
                style="

                  flex-shrink:0;
                  margin-top:4px;

        () => mutatePacking(data => {

            item.id === button.dataset.packCheck
          );

          if (item) item.done = button.checked;
        }, reference)
      );
    });

  root.querySelectorAll("[data-pack-delete]")
    .forEach(button => {
      button.onclick = () => packingAction(
        button,
        () => mutatePacking(data => {
          const item = data.items.find(item =>
            item.id === button.dataset.packDelete
          );

          if (!item) return;

          data.removed = [
            ...new Set([
              ...(data.removed || []),

          ].slice(-600);

          data.items = data.items.filter(
            other => other.id !== item.id

          q(mask, "#packing-label").value = "";
        }
      }
    );
  };

  q(root, "#packing-query").onclick = event =>
    packingAction(
      event.currentTarget,
      () => queryPacking()
    );

/* ---------- 依網頁與天氣補充打包建議 ---------- */

async function queryPacking() {
  if (extra.controller) return;

  const reference = packingRef();
  const revision = projectRevision;

  const destination =
    reminderDestination(state.project.name);

  if (!destination) {
    await mutatePacking(data => {
      data.webStatus =
        "尚未辨識到支援的城市，先使用基本清單";
      data.checkedAt = Date.now();
    }, reference);

    return;
  }

  const controller = new AbortController();
  extra.controller = controller;

  try {
    const results = await Promise.allSettled([
      fetchGuide(destination, controller.signal),
      fetchWeather(destination, controller.signal)
    ]);

    if (
      revision !== projectRevision ||
      controller.signal.aborted
    ) return;

    const suggested = [];
    const sources = [];

    if (results[0].status === "fulfilled") {
      const guide = results[0].value;

      for (const section of guide.items) {
        sources.push({
          title: `維基導遊（CC BY-SA）· ${section.title}`,
          url: section.url,
          text: section.text.slice(0, 350)
        });

        const rules = [
          [
            /雨|降水/,
            "防曬雨具",
            "折疊傘或輕便雨衣"
          ],
          [
            /寒冷|低溫|低温|保暖|冬季/,
            "衣物",
            "保暖衣物（出發前確認預報）"
          ],
          [
            /日照|防曬|防晒|紫外線|紫外线/,
            "防曬雨具",
            "防曬用品與帽子"
          ],
          [
            /蚊|登革/,
            "藥品",
            "適用的防蚊用品"
          ],
          [
            /插座|插頭|插头|電壓|电压/,
            "電子與充電",
            "充電器與適用轉接頭"
          ],
          [
            /步行|徒步|健行/,
            "衣物",
            "舒適好走的鞋"
          ]
        ];

        for (
          const [pattern, category, label] of rules
        ) {
          if (pattern.test(section.text)) {
            suggested.push(
              newItem(
                category,
                label,
                `網頁文字提示：${section.title}；請依自身需求確認`
              )
            );
          }
        }
      }
    }

    if (results[1].status === "fulfilled") {
      const weather = results[1].value;
      const start = tripDate(state.project.dates);
      const daily = weather.daily || weather;

      const dayCount = state.schedules.reduce(
        (max, schedule) =>
          /^Day\s*\d+$/i.test(schedule.day || "")
            ? Math.max(max, dayOrder(schedule.day))
            : max,
        1
      );

      const rows = (daily.time || [])
        .map((date, index) => ({
          date,
          min: daily.temperature_2m_min?.[index],
          rain:
            daily.precipitation_probability_max?.[index]
        }))
        .filter(row =>
          start !== null &&
          Date.parse(row.date) >= start &&
          Date.parse(row.date) <
            start + dayCount * 86400000
        );

      if (rows.length) {
        sources.push({
          title: "Open-Meteo · 旅程日期內的天氣預報",
          url: "https://open-meteo.com/",
          text:
            "僅對目前可預報且與旅程重疊的日期提供準備提示。"
        });

        if (
          rows.some(row =>
            Number.isFinite(row.min) &&
            row.min < 12
          )
        ) {
          suggested.push(
            newItem(
              "衣物",
              "保暖衣物（出發前確認預報）",
              "旅程日期預報：低溫低於 12°C"
            )
          );
        }

        if (
          rows.some(row =>
            Number.isFinite(row.rain) &&
            row.rain >= 60
          )
        ) {
          suggested.push(
            newItem(
              "防曬雨具",
              "折疊傘或輕便雨衣",
              "旅程日期預報：降雨機率至少 60%"
            )
          );
        }
      }
    }

    await mutatePacking(data => {
      const keys = new Set([
        ...data.items.map(itemKey),
        ...(data.removed || [])
      ]);

      for (const item of suggested) {
        if (
          !keys.has(itemKey(item)) &&
          data.items.length < 300
        ) {
          data.items.push(item);
          keys.add(itemKey(item));
        }
      }

      data.sources = sources.length
        ? sources
        : data.sources || [];

      data.checkedAt = Date.now();

      data.webStatus = sources.length
        ? "已查詢；網頁摘錄為補充參考，非完整打包建議"
        : "網頁建議尚未更新，保留基本清單與上次資料，可稍後重查";
    }, reference);
  } finally {
    if (extra.controller === controller) {
      extra.controller = null;
    }
  }
}

/* ---------- 結算金額與已收款紀錄 ---------- */

const moneyScale = currency =>
  ["KRW", "JPY"].includes(currency) ? 1 : 100;

function ledger() {
  const groups = new Map();

  const add = (currency, name, value) => {
    if (!groups.has(currency)) {
      groups.set(currency, new Map());
    }

    const group = groups.get(currency);

    group.set(
      name,
      (group.get(name) || 0) + value
    );
  };

  for (const expense of state.expenses) {
    const currency = expense.settle === "orig"
      ? expense.cur || "TWD"
      : "TWD";

    const scale = moneyScale(currency);

    const total = Math.round(
      Number(expense.amount) *
      (
        currency === (expense.cur || "TWD")
          ? 1
          : RATE[expense.cur || "TWD"] || 1
      ) *
      scale
    );

    const shares = Object.entries(
      expense.split || {}
    ).filter(([, value]) => Number(value) > 0);

    if (!shares.length) {
      shares.push([expense.payer, 1]);
    }

    const sum = shares.reduce(
      (sum, [, value]) =>
        sum + Number(value),
      0
    );

    if (
      !Number.isSafeInteger(total) ||
      total < 0 ||
      !Number.isFinite(sum)
    ) {
      throw new Error(
        "帳目金額異常，請先檢查原始帳目。"
      );
    }

    const allocated = shares.map(([name, value]) => {
      const raw = total * Number(value) / sum;

      return {
        name,
        raw,
        value: Math.floor(raw)
      };
    });

    let left = total - allocated.reduce(
      (sum, part) => sum + part.value,
      0
    );

    [...allocated].sort((a, b) =>
      (b.raw - b.value) - (a.raw - a.value) ||
      a.name.localeCompare(b.name)
    ).forEach(part => {
      if (left > 0) {
        part.value++;
        left--;
      }
    });

    add(currency, expense.payer, total);

    allocated.forEach(part =>
      add(currency, part.name, -part.value)
    );
  }

  for (
    const payment of extra.payments.filter(
      payment => payment.status === "received"
    )
  ) {
    add(
      payment.currency,
      payment.fromName,
      payment.units
    );

    add(
      payment.currency,
      payment.toName,
      -payment.units
    );
  }

  const transfers = [];

  for (const [currency, balances] of groups) {
    const debt = [...balances]
      .filter(([, amount]) => amount < 0)
      .sort(([a], [b]) => a.localeCompare(b))
      .map(([name, amount]) => ({
        name,
        amount: -amount
      }));

    const credit = [...balances]
      .filter(([, amount]) => amount > 0)
      .sort(([a], [b]) => a.localeCompare(b))
      .map(([name, amount]) => ({
        name,
        amount
      }));

    let debtor = 0;
    let creditor = 0;

    while (
      debtor < debt.length &&
      creditor < credit.length
    ) {
      const units = Math.min(
        debt[debtor].amount,
        credit[creditor].amount
      );

      if (units) {
        transfers.push({
          currency,
          fromName: debt[debtor].name,
          toName: credit[creditor].name,
          units
        });
      }

      debt[debtor].amount -= units;
      credit[creditor].amount -= units;

      if (!debt[debtor].amount) debtor++;
      if (!credit[creditor].amount) creditor++;
    }
  }

  return transfers;
}

function accountUid(name) {
  if (name === myName()) return uid();

  const member = state.members.find(member =>
    member.name === name &&
    state.project.memberUids.includes(
      member.userUid || member.id
    )
  );

  return member
    ? member.userUid || member.id
    : null;
}

const amountText = payment =>
  `${payment.currency} ${
    (
      payment.units /
      moneyScale(payment.currency)
    ).toLocaleString(undefined, {
      maximumFractionDigits: 2
    })
  }`;

function ledgerSignature() {
  return JSON.stringify([
    state.expenses.map(expense => [
      expense.id,
      expense.amount,
      expense.cur,
      expense.settle,
      expense.payer,
      expense.split
    ]).sort((a, b) =>
      a[0].localeCompare(b[0])
    ),

    extra.payments
      .filter(payment =>
        payment.status === "received"
      )
      .map(payment => payment.id)
      .sort()
  ]);
}

async function basisHash(basis) {
  const digest = await crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(basis)
  );

  return [...new Uint8Array(digest)]
    .map(byte =>
      byte.toString(16).padStart(2, "0")
    )
    .join("");
}

  );

function drawSettlement(mask) {
  if (!mask?.isConnected) return;

  const root = q(mask, "#settlement-body");

  if (extra.error) {
    root.textContent = extra.error;
    return;

  if (!extra.paymentsReady) {
    root.textContent = "載入收付款紀錄中…";

  }

  let transfers;

  try {
    transfers = ledger();
  } catch (error) {
    root.textContent = error.message;
    return;
  }

  const pending = extra.payments.filter(
    payment => payment.status === "paid"
  );

  const blocked = new Set(
    pending.map(payment => payment.currency)
  );

  const available = transfers.filter(
    transfer => !blocked.has(transfer.currency)
  );

  root.innerHTML = `
    <p class="hint">
      付款人標記已付款，收款人確認實際收到後才結清。

    </p>

    ${
      pending.length
        ? `

          <p class="hint">
            同幣別有待確認款項時，先完成確認，
            或由付款人撤回，再安排其他付款。

    ${pending.map(payment => `

              <button

                data-receive="${esc(payment.id)}"
              >
                確認已收款
              </button>
            `
            : ""
        }

        ${

            ? `
              <button
                class="btn"
                data-cancel-pay="${esc(payment.id)}"
              >
                撤回付款標記
              </button>
            `
            : ""
        }
      </div>
    `).join("")}

    <h3>尚待結算</h3>

    ${
      available.map((transfer, index) => `
        <div class="box" style="background:var(--aq)">
          <b>
            ${esc(transfer.fromName)}
            →
            ${esc(transfer.toName)}
          </b>

          <h3>${esc(amountText(transfer))}</h3>

                <small>
                  ${
                    !accountUid(transfer.fromName) ||
                    !accountUid(transfer.toName)
                      ? "歷史暱稱尚未對應帳號，請另行核對；不會自動認領。"
                      : "由付款人登入後標記付款"
                  }
                </small>
              `
          }
        </div>
      `).join("") ||
      '<p class="hint">目前沒有可安排的新轉帳。</p>'
    }

    ${
      extra.payments.some(payment =>
        payment.status === "received"
      )
        ? `
          <details>
            <summary>已結清紀錄</summary>

            ${
              extra.payments.filter(payment =>
                payment.status === "received"
              ).map(payment => `
                <div class="box">
                  <b>
                    ${esc(payment.fromName)}
                    →
                    ${esc(payment.toName)}

            }
          </details>

        : ""
