<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我們的溫馨小旅行 ✈️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #fcf9f2; 
            max-width: 480px; 
            margin: auto; 
            min-height: 100vh; 
            position: relative; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            letter-spacing: 0.3px;
        }
        .cute-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 6px 24px rgba(220, 170, 140, 0.15);
            border: 2px solid #fcefe6;
        }
    </style>
</head>
<body class="pb-28 text-gray-800">

    <!-- 頂部標題區 -->
    <header class="bg-gradient-to-r from-amber-200 to-orange-200 text-amber-950 px-4 py-3.5 shadow-sm sticky top-0 z-50 flex justify-between items-center rounded-b-3xl">
        <div class="flex items-center gap-2 min-w-0 pr-2">
            <button id="back-btn" onclick="backToProjects()" class="hidden bg-white/90 hover:bg-white text-amber-950 px-2.5 py-1.5 rounded-full text-xs font-bold shadow-sm transition active:scale-95 shrink-0 flex items-center gap-1">
                ⬅ 專案
            </button>
            <div class="min-w-0">
                <h1 id="header-title" class="text-sm font-black truncate flex items-center gap-1">🌸 我的旅遊小專案</h1>
                <p id="header-sub" class="text-[11px] text-amber-900 opacity-90 truncate mt-0.5">選擇你的冒險旅程 ✨</p>
            </div>
        </div>
        <button id="share-btn" onclick="shareCurrentProject()" class="hidden bg-white/90 hover:bg-white text-amber-950 text-xs px-3 py-2 rounded-2xl font-bold shadow-sm transition active:scale-95 shrink-0">
            ✨ 分享
        </button>
    </header>

    <!-- 內容容器 -->
    <main class="p-4 space-y-4">
        
        <!-- 視圖 0：專案選擇首頁 -->
        <div id="view-projects" class="space-y-4">
            <div class="flex justify-between items-center px-1">
                <h2 class="font-black text-amber-950 text-sm">🧳 我的旅遊專案清單</h2>
                <button onclick="openNewProjectModal()" class="bg-gradient-to-r from-orange-500 to-amber-500 text-white text-xs px-4 py-2.5 rounded-2xl font-black shadow-md shadow-orange-200 transition active:scale-95">
                    ＋ 新增專案
                </button>
            </div>

            <div id="project-list" class="space-y-3.5">
                <p class="text-center text-xs text-gray-400 py-8">載入中... ☁️</p>
            </div>
        </div>

        <!-- 視圖 1：專案內部功能 (預設隱藏) -->
        <div id="view-workspace" class="hidden space-y-4">
            
            <!-- 分頁 1：行程 -->
            <div id="tab-schedule" class="tab-content space-y-4">
                
                <!-- 🌟 即將到來的行程置頂卡片 -->
                <div id="upcoming-card-container"></div>

                <!-- 行程列表標題與功能按鈕列 -->
                <div class="flex justify-between items-center px-1">
                    <h3 class="font-black text-gray-700 text-xs tracking-wider">📅 完整行程時間軸</h3>
                    <div class="flex gap-2">
                        <button onclick="openSmartPasteModal()" class="bg-gradient-to-r from-orange-400 to-amber-400 text-white text-xs px-3.5 py-2 rounded-2xl font-black shadow-sm shadow-orange-200 transition active:scale-95">
                            ✨ 智慧導入
                        </button>
                        <button onclick="openAddScheduleModal()" class="bg-amber-500 text-white text-xs px-3.5 py-2 rounded-2xl font-black shadow-sm shadow-amber-200 transition active:scale-95">
                            ＋ 手動新增
                        </button>
                    </div>
                </div>

                <!-- 依天數展開/收合的時間軸容器 -->
                <div id="schedule-container" class="space-y-3">
                    <p class="text-center text-xs text-gray-400 py-6">正在載入行程... ⏳</p>
                </div>
            </div>

            <!-- 分頁 2：提醒 -->
            <div id="tab-ai" class="tab-content hidden space-y-3.5">
                <div id="dynamic-reminders-container" class="space-y-3.5"></div>
            </div>

            <!-- 分頁 3：語言 (全新互動式大框與左右分類清單) -->
            <div id="tab-lang" class="tab-content hidden space-y-4">
                
                <!-- 🌟 頂部大展示框 -->
                <div class="cute-card p-6 bg-gradient-to-br from-amber-50/80 to-orange-50/80 border-2 border-orange-300 space-y-3 shadow-md text-center relative">
                    <div class="absolute top-3 left-4">
                        <span class="text-[10px] bg-orange-200 text-orange-900 px-2.5 py-0.5 rounded-full font-black">🗣️ 實用翻譯發音</span>
                    </div>
                    
                    <div class="pt-2">
                        <p id="display-cn" class="text-xs text-gray-500 font-bold">請點選下方分類與句子 ▼</p>
                        <h2 id="display-foreign" class="text-2xl font-black text-amber-950 mt-1 break-words">請選擇想說的話 ✨</h2>
                    </div>

                    <div class="pt-1">
                        <button onclick="speakCurrentPhrase()" class="bg-gradient-to-r from-orange-500 to-amber-500 text-white px-5 py-2.5 rounded-2xl text-xs font-black shadow-md shadow-orange-200 transition active:scale-95 inline-flex items-center gap-1.5">
                            🔊 點擊朗讀
                        </button>
                    </div>
                </div>

                <!-- 左右雙欄配置：左下分類選單、右下句子清單 -->
                <div class="grid grid-cols-12 gap-3">
                    
                    <!-- 左下：分類按鈕清單 (4欄) -->
                    <div id="lang-categories" class="col-span-4 space-y-2">
                        <!-- 動態產生分類按鈕 -->
                    </div>

                    <!-- 右下：該分類對應的中文句子清單 (8欄) -->
                    <div id="lang-phrases" class="col-span-8 space-y-2">
                        <div class="cute-card p-4 text-center text-xs text-gray-400">請先點選左側分類</div>
                    </div>

                </div>
            </div>

            <!-- 分頁 4：分帳 -->
            <div id="tab-split" class="tab-content hidden space-y-4">
                <div class="bg-gradient-to-r from-orange-400 to-pink-400 text-white p-5 rounded-3xl shadow-lg shadow-orange-200/50 space-y-1">
                    <p class="text-xs opacity-90 font-medium">✨ 總花費金額</p>
                    <h3 class="text-2xl font-black tracking-tight">NT$ 24,500</h3>
                </div>
            </div>

        </div>
    </main>

    <!-- 🌸 行程詳細資訊與切換修改視窗 -->
    <div id="detail-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="cute-card bg-white w-full max-w-sm p-6 space-y-4 shadow-2xl">
            
            <!-- 檢視模式 -->
            <div id="modal-view-mode" class="space-y-4">
                <div class="flex justify-between items-start">
                    <div>
                        <span id="modal-day" class="text-xs bg-orange-100 text-orange-700 px-3 py-1 rounded-full font-black">Day 1</span>
                        <span id="modal-time" class="text-xs text-gray-400 font-bold ml-2">12:00</span>
                    </div>
                    <button onclick="closeDetailModal()" class="text-gray-400 hover:text-gray-600 text-base font-black">✕</button>
                </div>
                
                <div>
                    <h3 id="modal-title" class="font-black text-gray-900 text-base mt-2">行程名稱</h3>
                    <!-- 備註區塊 -->
                    <div id="modal-location-container" class="mt-2 hidden bg-amber-50/50 p-3 rounded-2xl border border-amber-100">
                        <p class="text-xs text-gray-600 font-bold mb-0.5">📝 備註：</p>
                        <p id="modal-location" class="text-xs text-gray-800 whitespace-pre-line font-medium"></p>
                    </div>
                </div>

                <div class="pt-2 flex gap-2.5">
                    <a id="modal-gmap" href="#" target="_blank" class="flex-1 text-center text-xs bg-amber-50 text-amber-900 py-3 rounded-2xl font-black hover:bg-amber-100 transition flex items-center justify-center gap-1 shadow-sm">
                        🗺 Google Maps
                    </a>
                    <a id="modal-naver" href="#" target="_blank" class="flex-1 text-center text-xs bg-orange-50 text-orange-900 py-3 rounded-2xl font-black hover:bg-orange-100 transition flex items-center justify-center gap-1 shadow-sm">
                        🚗 Naver Map
                    </a>
                </div>

                <div class="pt-2 flex gap-2.5">
                    <button onclick="switchToEditMode()" class="flex-1 bg-amber-100 text-amber-900 text-xs py-3 rounded-2xl font-black hover:bg-amber-200 transition">✏️ 修改行程</button>
                    <button onclick="closeDetailModal()" class="flex-1 bg-gray-100 text-gray-600 text-xs py-3 rounded-2xl font-bold">關閉</button>
                </div>
            </div>

            <!-- 編輯模式 -->
            <div id="modal-edit-mode" class="hidden space-y-3 text-xs">
                <div class="flex justify-between items-center">
                    <h3 class="font-black text-amber-950 text-base">✏️ 編輯行程內容</h3>
                    <button onclick="closeDetailModal()" class="text-gray-400 text-base font-black">✕</button>
                </div>
                
                <input type="hidden" id="edit-schedule-id">

                <div>
                    <label class="block font-bold text-gray-600 mb-1">天數</label>
                    <input type="text" id="edit-day" class="w-full p-3 bg-amber-50/50 border border-amber-100 rounded-2xl outline-none focus:ring-2 focus:ring-orange-300 font-bold">
                </div>
                <div>
                    <label class="block font-bold text-gray-600 mb-1">時間</label>
                    <input type="text" id="edit-time" class="w-full p-3 bg-amber-50/50 border border-amber-100 rounded-2xl outline-none focus:ring-2 focus:ring-orange-300 font-bold">
                </div>
                <div>
                    <label class="block font-bold text-gray-600 mb-1">行程名稱</label>
                    <input type="text" id="edit-title" class="w-full p-3 bg-amber-50/50 border border-amber-100 rounded-2xl outline-none focus:ring-2 focus:ring-orange-300 font-bold">
                </div>
                <div>
                    <label class="block font-bold text-gray-600 mb-1">備註</label>
                    <textarea id="edit-location" rows="3" class="w-full p-3 bg-amber-50/50 border border-amber-100 rounded-2xl outline-none focus:ring-2 focus:ring-orange-300 font-bold resize-none" placeholder="輸入備註或預訂代碼..."></textarea>
                </div>

                <div class="flex gap-2.5 pt-2">
                    <button onclick="switchToViewMode()" class="flex-1 bg-gray-100 text-gray-600 text-xs py-3 rounded-2xl font-black">返回</button>
                    <button onclick="saveScheduleEdit()" class="flex-1 bg-gradient-to-r from-orange-400 to-amber-400 text-white text-xs py-3 rounded-2xl font-black shadow-md shadow-orange-200">儲存修改</button>
                </div>
            </div>

        </div>
    </div>

    <!-- 🌸 智慧導入大格子彈跳視窗 -->
    <div id="smart-paste-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="cute-card bg-white w-full max-w-md p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="font-black text-amber-950 text-base">✨ AI 智慧導入行程</h3>
                <button onclick="closeSmartPasteModal()" class="text-gray-400 hover:text-gray-600 text-base font-black">✕</button>
            </div>
            <p class="text-xs text-gray-500 leading-relaxed">請將多天行程整段貼在下方。時間精準抓取，備註與營業時間內的數字絕不誤判！</p>
            <textarea id="smart-paste-input" rows="8" placeholder="貼上你的詳細行程..." class="w-full text-xs p-3.5 bg-amber-50/50 border border-amber-100 rounded-2xl focus:ring-2 focus:ring-orange-300 outline-none resize-none placeholder:text-gray-400"></textarea>
            <div class="flex gap-2.5 pt-1">
                <button onclick="closeSmartPasteModal()" class="flex-1 bg-gray-100 text-gray-600 text-xs py-3 rounded-2xl font-black">取消</button>
                <button onclick="parseSmartPaste()" class="flex-1 bg-gradient-to-r from-orange-400 to-amber-400 text-white text-xs py-3 rounded-2xl font-black shadow-md shadow-orange-200">開始智慧拆解</button>
            </div>
        </div>
    </div>

    <!-- 🌸 手動新增表單 Modal -->
    <div id="schedule-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="cute-card bg-white w-full max-w-sm p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="font-black text-amber-950 text-base">✏️ 手動新增行程</h3>
                <button onclick="closeAddScheduleModal()" class="text-gray-400 hover:text-gray-600 text-base font-black">✕</button>
            </div>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-gray-600 mb-1">天數（例如：Day 1）</label>
                    <input type="text" id="input-day" value="Day 1" class="w-full p-3 bg-amber-50/50 border border-amber-100 rounded-2xl outline-none focus:ring-2 focus:ring-orange-300 font-bold">
                </div>
                <div>
                    <label class="block font-bold text-gray-600 mb-1">時間（例如：14:00）</label>
                    <input type="text" id="input-time" value="10:00" class="w-full p-3 bg-amber-50/50 border border-amber-100 rounded-2xl outline-none focus:ring-2 focus:ring-orange-300 font-bold">
                </div>
                <div>
                    <label class="block font-bold text-gray-600 mb-1">行程名稱</label>
                    <input type="text" id="input-title" placeholder="例如：黑豬肉晚餐" class="w-full p-3 bg-amber-50/50 border border-amber-100 rounded-2xl outline-none focus:ring-2 focus:ring-orange-300 font-bold">
                </div>
                <div>
                    <label class="block font-bold text-gray-600 mb-1">備註（選填）</label>
                    <textarea id="input-location" rows="3" placeholder="例如：餐廳預訂代碼或補充說明" class="w-full p-3 bg-amber-50/50 border border-amber-100 rounded-2xl outline-none focus:ring-2 focus:ring-orange-300 font-bold resize-none"></textarea>
                </div>
            </div>

            <div class="flex gap-2.5 pt-2">
                <button onclick="closeAddScheduleModal()" class="flex-1 bg-gray-100 text-gray-600 text-xs py-3 rounded-2xl font-black transition active:scale-95">取消</button>
                <button onclick="submitScheduleForm()" class="flex-1 bg-gradient-to-r from-orange-400 to-amber-400 text-white text-xs py-3 rounded-2xl font-black shadow-md shadow-orange-200 transition active:scale-95">確認新增</button>
            </div>
        </div>
    </div>

    <!-- 底部導覽列 -->
    <nav id="bottom-nav" class="hidden fixed bottom-3 left-4 right-4 max-w-[448px] mx-auto bg-white/95 backdrop-blur-md border border-amber-100 flex justify-around py-3 rounded-2xl shadow-xl z-50">
        <button onclick="switchTab('schedule')" id="nav-schedule" class="flex flex-col items-center text-orange-500 text-xs font-black gap-0.5"><span class="text-xl">📅</span>行程</button>
        <button onclick="switchTab('ai')" id="nav-ai" class="flex flex-col items-center text-gray-400 text-xs font-bold gap-0.5"><span class="text-xl">💡</span>提醒</button>
        <button onclick="switchTab('lang')" id="nav-lang" class="flex flex-col items-center text-gray-400 text-xs font-bold gap-0.5"><span class="text-xl">🗣️</span>語言</button>
        <button onclick="switchTab('split')" id="nav-split" class="flex flex-col items-center text-gray-400 text-xs font-bold gap-0.5"><span class="text-xl">💰</span>分帳</button>
    </nav>

        function getMyProjectIds() {
            return JSON.parse(localStorage.getItem('my_subscribed_projects')) || [];
        }

        function saveMyProjectId(id) {
            let list = getMyProjectIds();
            if (!list.includes(id)) {
                list.unshift(id);
                localStorage.setItem('my_subscribed_projects', JSON.stringify(list));
            }
        }

        function removeMyProjectId(id) {
            let list = getMyProjectIds();
            list = list.filter(item => item !== id);
            localStorage.setItem('my_subscribed_projects', JSON.stringify(list));
        }

        async function renderProjects() {
            const list = document.getElementById('project-list');
            const myIds = getMyProjectIds();

            if (myIds.length === 0) {
                list.innerHTML = `<p class="text-center text-xs text-gray-400 py-8">目前沒有專案。點上方按鈕新增，或透過朋友的分享連結加入！✨</p>`;
                return;
            }

            list.innerHTML = '';
            for (let id of myIds) {
                try {
                    const docRef = doc(db, "projects", id);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        const p = docSnap.data();
                        const card = document.createElement('div');
                        card.className = "cute-card p-5 space-y-3 relative transition hover:border-orange-300 overflow-hidden";
                        card.innerHTML = `
                            <div class="flex justify-between items-center gap-2 w-full">
                                <span class="text-xs bg-orange-100 text-orange-800 px-3 py-1 rounded-full font-black shrink-0">進行中 🚗</span>
                                <div class="flex items-center gap-2 shrink-0">

            if (!name) return;
            const dates = prompt("請輸入旅遊日期區間（例如：11/23 - 11/27）：", "11/23 - 11/27");
            
            try {
                const newId = 'proj_' + Date.now();
                await setDoc(doc(db, "projects", newId), {
                    name: name,
                    dates: dates,
                    createdAt: Date.now()
                });
                saveMyProjectId(newId);
                renderProjects();

        // 🌟 根據專案名稱初始化語言模組
        function initLanguageModule(projectName) {
            let nameLower = projectName.toLowerCase();
            let destKey = 'general';

            if (nameLower.includes('濟州') || nameLower.includes('韓國') || nameLower.includes('釜山') || nameLower.includes('首爾')) {
                destKey = 'korea';
            } else if (nameLower.includes('東京') || nameLower.includes('日本') || nameLower.includes('大阪') || nameLower.includes('京都') || nameLower.includes('沖繩') || nameLower.includes('北海道') || nameLower.includes('名古屋')) {
                destKey = 'japan';
            } else if (nameLower.includes('泰國') || nameLower.includes('曼谷') || nameLower.includes('清邁') || nameLower.includes('普吉')) {
                destKey = 'thailand';
            }

            const currentLangPack = languageData[destKey];
            currentDestinationLang = currentLangPack.langCode;

            // 預設大框顯示歡迎提示
            currentActivePhrase = { cn: "請點選左側分類與右側句子", foreign: "Ready to Speak ✨" };
            document.getElementById('display-cn').innerText = currentActivePhrase.cn;
            document.getElementById('display-foreign').innerText = currentActivePhrase.foreign;

            // 渲染左側分類
            const catContainer = document.getElementById('lang-categories');
            catContainer.innerHTML = '';
            currentLangPack.categories.forEach((cat, idx) => {
                let btn = document.createElement('button');
                btn.className = `w-full text-left text-xs font-black p-3 rounded-2xl transition border ${idx === 0 ? 'bg-orange-500 text-white border-orange-500 shadow-sm' : 'bg-white text-gray-700 border-amber-100 hover:bg-amber-50'}`;
                btn.innerText = cat.name;
                btn.onclick = () => {
                    // 切換按鈕樣式
                    document.querySelectorAll('#lang-categories button').forEach(b => {
                        b.className = "w-full text-left text-xs font-black p-3 rounded-2xl transition border bg-white text-gray-700 border-amber-100 hover:bg-amber-50";
                    });
                    btn.className = "w-full text-left text-xs font-black p-3 rounded-2xl transition border bg-orange-500 text-white border-orange-500 shadow-sm";
                    
                    // 渲染右側句子
                    renderPhrases(currentLangPack.phrases[cat.id]);
                };
                catContainer.appendChild(btn);
            });

            // 預設載入第一個分類的句子
            renderPhrases(currentLangPack.phrases[currentLangPack.categories[0].id]);
        }

        // 渲染右側句子清單
        function renderPhrases(phrases) {
            const phraseContainer = document.getElementById('lang-phrases');
            phraseContainer.innerHTML = '';

            phrases.forEach(p => {
                let card = document.createElement('div');
                card.className = "cute-card p-3.5 bg-amber-50/40 hover:bg-amber-50 border border-amber-100/80 cursor-pointer transition flex justify-between items-center";
                card.innerHTML = `

                        <p class="text-[11px] text-orange-700 font-black mt-0.5">${p.foreign}</p>
                    </div>
                    <span class="text-base">👉</span>
                `;

                    currentActivePhrase = p;
                    document.getElementById('display-cn').innerText = p.cn;
                    document.getElementById('display-foreign').innerText = p.foreign;

                phraseContainer.appendChild(card);
            });

        function loadSchedules(projId) {
            const schedulesRef = collection(db, "projects", projId, "schedules");
            const q = query(schedulesRef, orderBy("createdAt", "asc"));

            if (unsubscribeSchedules) unsubscribeSchedules();

            unsubscribeSchedules = onSnapshot(q, (snapshot) => {
                allSchedulesData = [];
                snapshot.forEach((docSnap) => {
                    allSchedulesData.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderScheduleUI();
            });
        }

        function cleanDisplayTitle(title) {
            if (!title) return '';
            return title.replace(/^\d{1,2}[:：]\d{2}\s*/, '').trim();
        }

        function renderScheduleUI() {
            const container = document.getElementById('schedule-container');
            const upcomingContainer = document.getElementById('upcoming-card-container');
            container.innerHTML = '';
            upcomingContainer.innerHTML = '';

            if (allSchedulesData.length === 0) {
                upcomingContainer.innerHTML = '';
                container.innerHTML = `<p class="text-center text-xs text-gray-400 py-6">目前還沒有行程，快點擊上方按鈕新增或智慧導入吧！✨</p>`;
                return;
            }

            const nextItem = allSchedulesData[0];
            const cleanNextTitle = cleanDisplayTitle(nextItem.title);
            upcomingContainer.innerHTML = `
                <div onclick="openDetailModal('${nextItem.id}')" class="cute-card p-5 bg-gradient-to-r from-amber-50 to-orange-50 border-2 border-orange-300 space-y-2 relative shadow-md cursor-pointer hover:scale-[1.01] transition">
                    <div class="flex justify-between items-center">
                        <span class="text-xs bg-orange-500 text-white px-3 py-1 rounded-full font-black">🚀 即將到來</span>
                        <span class="text-xs font-black text-orange-800">${nextItem.day || 'Day 1'} • ${nextItem.time || '全天'}</span>
                    </div>
                    <h4 class="font-black text-gray-900 text-sm pt-0.5">${cleanNextTitle}</h4>
                </div>
            `;

            let grouped = {};
            allSchedulesData.forEach(item => {
                let dayKey = item.day || 'Day 1';
                if (!grouped[dayKey]) grouped[dayKey] = [];
                grouped[dayKey].push(item);
            });

            Object.keys(grouped).forEach((dayKey, index) => {
                let items = grouped[dayKey];
                let sectionId = `day_section_${index}`;
                let dayBox = document.createElement('div');
                dayBox.className = "cute-card overflow-hidden border border-amber-100";
                
                let headerHtml = `
                    <div onclick="toggleDayCollapse('${sectionId}')" class="bg-amber-100/70 p-4 flex justify-between items-center cursor-pointer hover:bg-amber-100 transition">
                        <h4 class="font-black text-amber-950 text-xs flex items-center gap-1.5">
                            📅 ${dayKey} <span class="text-xs text-amber-800 font-bold">(${items.length} 個行程)</span>
                        </h4>
                        <span id="icon_${sectionId}" class="text-xs text-amber-900 font-black">▼ 展開</span>
                    </div>
                `;

                let isExpanded = false;
                let listHtml = `<div id="${sectionId}" class="${isExpanded ? '' : 'hidden'} p-3 space-y-2.5 bg-white">`;

                items.forEach(s => {
                    let cleanTitle = cleanDisplayTitle(s.title);
                    let timeLabel = s.time || '全天';
                    listHtml += `
                        <div onclick="openDetailModal('${s.id}')" class="p-3.5 bg-amber-50/40 hover:bg-amber-50 rounded-2xl border border-amber-100/80 flex justify-between items-center cursor-pointer transition">
                            <div class="space-y-1">
                                <span class="text-[11px] bg-orange-100 text-orange-800 px-2.5 py-0.5 rounded-md font-black">${timeLabel}</span>
                                <h5 class="font-black text-gray-900 text-sm mt-1">${cleanTitle}</h5>
                            </div>
                            <div>
                                <button onclick="event.stopPropagation(); deleteSchedule('${s.id}')" class="text-gray-300 hover:text-red-500 text-sm p-1.5">🗑️</button>
                            </div>
                        </div>
                    `;
                });
                listHtml += `</div>`;

                dayBox.innerHTML = headerHtml + listHtml;
                container.appendChild(dayBox);
            });
        }

        window.toggleDayCollapse = function(sectionId) {
            const el = document.getElementById(sectionId);
            const icon = document.getElementById(`icon_${sectionId}`);
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                icon.innerText = "▲ 收合";
            } else {
                el.classList.add('hidden');
                icon.innerText = "▼ 展開";
            }
        }

        window.openDetailModal = function(id) {
            const item = allSchedulesData.find(s => s.id === id);
            if (!item) return;

            document.getElementById('modal-day').innerText = item.day || 'Day 1';
            document.getElementById('modal-time').innerText = item.time || '全天';
            document.getElementById('modal-title').innerText = cleanDisplayTitle(item.title);
            
            const locContainer = document.getElementById('modal-location-container');
            const locSpan = document.getElementById('modal-location');
            if (item.location && item.location.trim() !== '') {
                locSpan.innerText = item.location;
                locContainer.classList.remove('hidden');
            } else {
                locSpan.innerText = '';
                locContainer.classList.add('hidden');
            }

            const queryText = encodeURIComponent(cleanDisplayTitle(item.title));
            document.getElementById('modal-gmap').href = `https://maps.google.com/?q=${queryText}`;
            document.getElementById('modal-naver').href = `https://map.naver.com/v5/search/${queryText}`;

            document.getElementById('edit-schedule-id').value = item.id;
            document.getElementById('edit-day').value = item.day || 'Day 1';
            document.getElementById('edit-time').value = item.time || '10:00';
            document.getElementById('edit-title').value = cleanDisplayTitle(item.title);
            document.getElementById('edit-location').value = item.location || '';

            document.getElementById('modal-view-mode').classList.remove('hidden');
            document.getElementById('modal-edit-mode').classList.add('hidden');

            document.getElementById('detail-modal').classList.remove('hidden');
        }

        window.closeDetailModal = function() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        window.switchToEditMode = function() {
            document.getElementById('modal-view-mode').classList.add('hidden');
            document.getElementById('modal-edit-mode').classList.remove('hidden');
        }

        window.switchToViewMode = function() {
            document.getElementById('modal-edit-mode').classList.add('hidden');
            document.getElementById('modal-view-mode').classList.remove('hidden');
        }

        window.saveScheduleEdit = async function() {
            if (!currentProjectId) return;
            const scheduleId = document.getElementById('edit-schedule-id').value;
            const day = document.getElementById('edit-day').value.trim();
            const time = document.getElementById('edit-time').value.trim();
            const title = document.getElementById('edit-title').value.trim();
            let location = document.getElementById('edit-location').value.trim();

            if (!title) { alert("請填寫行程名稱！"); return; }

            try {
                const docRef = doc(db, "projects", currentProjectId, "schedules", scheduleId);
                await updateDoc(docRef, { day, time, title, location });
                closeDetailModal();
                alert("✨ 行程修改成功！");
            } catch (e) {
                console.error("修改失敗", e);
                alert("修改失敗，請檢查網路連線");
            }
        }

        window.openSmartPasteModal = function() {
            if (!currentProjectId) return;
            document.getElementById('smart-paste-modal').classList.remove('hidden');
        }

        window.closeSmartPasteModal = function() {
            document.getElementById('smart-paste-modal').classList.add('hidden');
        }

        window.openAddScheduleModal = function() {
            if (!currentProjectId) return;
            document.getElementById('schedule-modal').classList.remove('hidden');
        }

        window.closeAddScheduleModal = function() {
            document.getElementById('schedule-modal').classList.add('hidden');
        }

        window.submitScheduleForm = async function() {
            if (!currentProjectId) return;
            const day = document.getElementById('input-day').value.trim() || "Day 1";
            const time = document.getElementById('input-time').value.trim() || "10:00";
            const title = document.getElementById('input-title').value.trim();
            let location = document.getElementById('input-location').value.trim();

            if (!title) { alert("請填寫行程名稱！"); return; }

            try {
                await addDoc(collection(db, "projects", currentProjectId, "schedules"), {
                    day, time, title, location,
                    createdAt: Date.now()
                });
                closeAddScheduleModal();
                document.getElementById('input-title').value = '';
                document.getElementById('input-location').value = '';
                alert("✨ 行程新增成功！");
            } catch (e) {
                console.error("新增失敗", e);
                alert("新增失敗，請檢查網路連線");
            }
        }

        window.deleteSchedule = async function(scheduleId) {
            if (!currentProjectId) return;
            if (confirm("確定要刪除這個行程嗎？")) {
                try {
                    await deleteDoc(doc(db, "projects", currentProjectId, "schedules", scheduleId));
                } catch (e) { console.error("刪除失敗", e); }
            }
        }

        window.parseSmartPaste = async function() {
            const rawText = document.getElementById('smart-paste-input').value.trim();
            if(!rawText) { alert("請先輸入或貼上行程文字喔！"); return; }

            alert("✨ AI 正在進行智慧拆解與備註配對中...");

            const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            let currentDay = "Day 1";
            let parsedItems = [];
            let currentItem = null;

            try {
                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i];

                    let dayMatch = line.match(/(Day\s*\d+|第[一二三四五六七八九十]+天)/i);
                    if (dayMatch) {
                        if (currentItem) {
                            parsedItems.push(currentItem);
                            currentItem = null;
                        }
                        currentDay = dayMatch[0];
                        continue;
                    }

                    let timeMatch = line.match(/(\d{1,2}[:：]\d{2})/);
                    let hasNoteKeyword = line.includes("備註") || line.includes("營業時間") || line.includes("預訂");
                    let isNewItem = timeMatch && !hasNoteKeyword && (line.includes("•") || line.startsWith("•") || line.match(/^\s*•?\s*\d{1,2}[:：]\d{2}/));

                    if (isNewItem) {
                        if (currentItem) {
                            parsedItems.push(currentItem);
                        }

                        let timeStr = timeMatch[1];
                        let cleanTitle = line
                            .replace(/^\s*•?\s*\d{1,2}[:：]\d{2}\s*/, '')
                            .replace(/^[-•\*\d\.]+\s*/, '')
                            .trim();

                        currentItem = {
                            day: currentDay,
                            time: timeStr,
                            title: cleanTitle,
                            location: "",
                            createdAt: Date.now() + parsedItems.length
                        };
                    } else if (currentItem) {
                        currentItem.location = currentItem.location ? (currentItem.location + "\n" + line) : line;
                    }
                }

                if (currentItem) {
                    parsedItems.push(currentItem);
                }

                if (parsedItems.length === 0) {
                    alert("沒有解析到有效行程，請檢查格式喔！");
                    return;
                }

                for (let i = 0; i < parsedItems.length; i++) {
                    await addDoc(collection(db, "projects", currentProjectId, "schedules"), parsedItems[i]);
                }

                document.getElementById('smart-paste-input').value = "";
                closeSmartPasteModal();
                alert(`✨ 成功！已智慧導入 ${parsedItems.length} 筆行程！`);
            } catch (e) {
                console.error("AI 拆解失敗", e);
                alert("解析發生錯誤，請再試一次");
            }
        }

        window.shareCurrentProject = function() {
            if (!currentProjectId) return;
            const baseUrl = window.location.href.split('?')[0];
            const shareUrl = `${baseUrl}?project=${currentProjectId}`;
            navigator.clipboard.writeText(shareUrl);
            alert("🌸 專屬分享網址已複製！朋友點開後會自動將這個專案加入清單中！");
        }

        window.switchTab = function(tabName) {
            ['schedule', 'ai', 'lang', 'split'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).className = "flex flex-col items-center text-gray-400 text-xs font-bold gap-0.5";
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`nav-${tabName}`).className = "flex flex-col items-center text-orange-500 text-xs font-black gap-0.5";
        }

        window.speakText = function(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            window.speechSynthesis.speak(utterance);
        }

        async function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const sharedProjId = urlParams.get('project');

            if (sharedProjId) {
                saveMyProjectId(sharedProjId);
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            renderProjects();
        }

        initApp();
    </script>
