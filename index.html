<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🧳 放風之旅</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="放風 ✈">
<meta name="theme-color" content="#FFFCF6">
<link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--ink:#3E3A39;--paper:#FFFCF6;--co:#F2A497;--ye:#F6D27A;--aq:#A8D3E6;--gr:#B9DAA5}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0 auto;max-width:480px;min-height:100vh;background:var(--paper);color:var(--ink);font:15px/1.6 "Huninn","Noto Sans TC",system-ui,sans-serif;padding:0 14px calc(75px + env(safe-area-inset-bottom));touch-action:manipulation}
h2,h3{margin:0}small{opacity:.7}.mute{text-align:center;opacity:.6;padding:18px 0}
.box{border:3px solid var(--ink);border-radius:24px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);padding:14px;margin:12px 0}
.btn{font:inherit;font-size:13px;color:var(--ink);background:var(--ye);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);text-decoration:none;display:inline-block}
.btn:active{transform:translate(2px,2px);box-shadow:none}.co{background:var(--co)}.aq{background:var(--aq)}.gr{background:var(--gr)}
header{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:3px solid var(--ink);margin:0 -14px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
header div{flex:1;min-width:0}header b,header small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}.gap{justify-content:flex-end}
.art{border:3px solid var(--ink);border-radius:24px;overflow:hidden;margin:12px 0;box-shadow:3px 3px 0 var(--ink);line-height:0}.art svg{width:100%;height:auto}
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.pill{font:inherit;flex:none;border:3px solid var(--ink);border-radius:999px;background:var(--paper);padding:2px 14px;cursor:pointer;color:var(--ink)}.pill.on{background:var(--aq)}
.tag{display:inline-block;background:var(--ye);border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:12px;margin-bottom:4px}
.item{cursor:pointer;display:block}.item b{display:block}

/* 🌸 導覽列：緊貼底部、無外圍線條、上方一條黑線 */
nav{position:fixed;left:0;right:0;bottom:0;width:100%;max-width:480px;margin:0 auto;background:var(--paper);border-top:3px solid var(--ink);display:flex;justify-content:center;gap:16px;padding:6px 12px calc(4px + env(safe-area-inset-bottom));z-index:9999}
nav button{font:inherit;font-size:12px;border:3px solid transparent;border-radius:20px;background:none;color:var(--ink);padding:2px 10px;cursor:pointer;pointer-events:auto}
nav button span{display:block;font-size:18px}
nav button.on{background:var(--ye);border-color:var(--ink)}

.mask{position:fixed;inset:0;background:rgba(62,58,57,.45);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:100%;max-width:400px;max-height:88vh;overflow:auto;margin:0}
input,textarea,select{font:inherit;font-size:16px!important;width:100%;border:3px solid var(--ink);border-radius:16px;background:#fff;padding:8px 12px;margin:4px 0 8px;color:var(--ink)}
::placeholder { color: #b0a8a0; opacity: 1; }
label{font-size:13px}.chk{display:inline-flex;gap:4px;align-items:center;margin:0 10px 6px 0}.chk input{width:auto;margin:0}
.bar{height:16px;border:3px solid var(--ink);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gr);transition:width .5s}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.bd{width:60px;height:60px;margin:0 auto;border:3px dashed var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;filter:grayscale(1);opacity:.5}
.bd.on{border-style:solid;filter:none;opacity:1}
.lang{display:grid;grid-template-columns:104px 1fr;gap:10px}.lang .btn{display:block;width:100%;text-align:left;margin-bottom:8px;font-size:12px}.lang .btn.on{background:var(--co)}
@keyframes fl{50%{transform:translateY(-5px)}}@keyframes dr{from{transform:translateX(-9px)}to{transform:translateX(9px)}}
@keyframes bn{0%{transform:scale(.82)}55%{transform:scale(1.1)}100%{transform:scale(1)}}
.fl{animation:fl 3s ease-in-out infinite}.dr{animation:dr 6s ease-in-out infinite alternate}.bn{animation:bn .5s cubic-bezier(.3,1.6,.5,1)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head>
<body>
<header>
    <button id="bk" class="btn aq" hidden>← 專案</button>
    <div><b id="ht">🧳 放風之旅</b><small id="hs">選擇你的冒險旅程 ✨</small></div>
    <span>
        <button id="ref" class="btn" style="background:#fff;padding:4px 8px;margin-right:4px">🔄</button>
        <button id="sh" class="btn gr" hidden>✨ 分享</button>
    </span>
</header>
<main>
<section id="v0">
<div class="art" id="hero0"></div>
<div class="row"><h2>我的旅程 ✈</h2><span><button id="imp" class="btn">📥 導入</button> <button id="new" class="btn co">＋ 新增</button></span></div><div id="pl"><p class="mute">載入中…☁️</p></div></section>
<section id="v1" hidden>
<div id="t-schedule" class="tab"><div class="row"><h3>📅 行程時間軸</h3><span><button id="sp" class="btn">✨ 智慧導入</button> <button id="ad" class="btn co">＋ 新增</button></span></div><div class="pills" id="pills"></div><div id="sl"></div></div>
<div id="t-ai" class="tab" hidden></div>
<div id="t-lang" class="tab" hidden><div class="box" style="text-align:center;background:var(--ye)"><small id="dc">請點選下方對話情境與句子</small><h2 id="df" style="margin:4px 0 10px">想說什麼呢？</h2><button id="say" class="btn co">🔊 朗讀</button></div><div class="lang"><div id="lc"></div><div id="lp"></div></div></div>
<div id="t-split" class="tab" hidden><div class="box" style="background:var(--co)"><div class="row" style="margin:0"><small>旅程總花費（折合台幣）</small><button id="mb" class="btn">👥 成員</button></div><h2 id="tot">NT$ 0</h2><small id="brk"></small></div>
<div class="row"><h3>💰 帳目</h3><span><button id="st" class="btn aq">📊 結算</button> <button id="ae" class="btn co">＋ 記一筆</button></span></div><div id="el"></div></div>
<div id="t-quest" class="tab" hidden><div class="box" style="background:var(--gr)"><div class="row" style="margin:0 0 6px"><b id="qc">已打卡 0 / 0</b><b id="qp">0%</b></div><div class="bar" style="background:var(--paper)"><i id="qb" style="width:0"></i></div>
<button id="gal" class="btn aq" style="margin-top:12px">📸 回憶寫真冊</button><div class="badges" style="margin-top:12px"><div><div class="bd" id="b-food">🍽️</div><small id="bt-food"></small></div><div><div class="bd" id="b-spot">🗺️</div><small id="bt-spot"></small></div><div><div class="bd" id="b-shop">🛍️</div><small id="bt-shop"></small></div></div></div><div id="ql"></div></div>
</section></main>
<nav id="nav" hidden></nav>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getFirestore,collection,addDoc,getDoc,getDocs,deleteDoc,doc,setDoc,onSnapshot,query,where,orderBy,updateDoc}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBcKmZhJaZn5emOlHRV95-uC9q01wFxt4M",authDomain:"my-travel-app-6e00c.firebaseapp.com",projectId:"my-travel-app-6e00c",storageBucket:"my-travel-app-6e00c.firebasestorage.app",messagingSenderId:"135860333246",appId:"1:135860333246:web:a25402eb743d6cebc9ccef"});const db=getFirestore(app);
const $=i=>document.getElementById(i),q=(m,s)=>m.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={id:null,name:'',pin:'',me:localStorage.getItem('my_travel_nickname')||'',sch:[],mem:[],exp:[],all:[],chk:{},day:'all',un:[],phrase:null,lang:'en-US',splitMode:'equal'};

/* ---------- 地點與國家判定 ---------- */
const getDestType = n => {
    if(/濟州|韓國|釜山|首爾/.test(n||'')) return 'korea';
    if(/日本|東京|大阪|京都|沖繩|北海道/.test(n||'')) return 'japan';
    if(/曼谷|泰國|清邁|普吉島|芭達雅/.test(n||'')) return 'thailand';
    if(/新加坡/.test(n||'')) return 'singapore';
    if(/馬來西亞|吉隆坡|檳城|沙巴|蘭卡威/.test(n||'')) return 'malaysia';
    if(/香港/.test(n||'')) return 'hongkong';
    if(/澳門/.test(n||'')) return 'macau';
    return 'general';
};
const dest = n => getDestType(n);

const getFlagEmoji = n => {
    const type = getDestType(n);
    if(type === 'korea') return '🇰🇷';
    if(type === 'japan') return '🇯🇵';
    if(type === 'thailand') return '🇹🇭';
    if(type === 'singapore') return '🇸🇬';
    if(type === 'malaysia') return '🇲🇾';
    if(type === 'hongkong') return '🇭🇰';
    if(type === 'macau') return '🇲🇦';
    return '🧳';
};

const dn=s=>+String(s||'').replace(/\D/g,'')||1,clean=t=>(t||'').replace(/^\d{1,2}[:：]\d{2}\s*/,'').trim();
const RATE={TWD:1,KRW:.024,JPY:.21,THB:.92,SGD:24,MYR:7.2,HKD:4.1,MOP:4.1,USD:32};

/* ---------- SVG 插圖 ---------- */
const K='stroke="#3E3A39" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
const cloud=(x,y)=>`<g transform="translate(${x} ${y})"><g class="dr"><path d="M0 18q-2-14 14-12q8-12 22 0q14-2 12 12z" fill="#FFFCF6" ${K}/></g></g>`;
const hill=(c,y)=>`<path d="M-4 140V${y}Q80 ${y-24} 160 ${y}T324 ${y-6}V140z" fill="${c}" ${K}/>`;
const SC={
korea:`<rect width="320" height="140" fill="#A8D3E6"/>${cloud(24,22)}<g class="fl"><circle cx="270" cy="36" r="19" fill="#F6D27A" ${K}/></g><path d="M-4 140V98Q70 34 150 74Q215 58 324 100V140z" fill="#B9DAA5" ${K}/><g class="fl"><circle cx="62" cy="98" r="17" fill="#F6D27A" ${K}/><path d="M62 81q4-9 13-8" fill="none" ${K}/></g><g class="fl"><circle cx="100" cy="110" r="13" fill="#F6D27A" ${K}/></g><g class="dr"><rect x="190" y="98" width="62" height="24" rx="9" fill="#F2A497" ${K}/><rect x="204" y="86" width="32" height="16" rx="6" fill="#FFFCF6" ${K}/><circle cx="206" cy="124" r="7" fill="#FFFCF6" ${K}/><circle cx="238" cy="124" r="7" fill="#FFFCF6" ${K}/></g>`,
japan:`<rect width="320" height="140" fill="#F6D27A"/><g class="fl"><circle cx="58" cy="38" r="19" fill="#F2A497" ${K}/></g>${cloud(196,16)}<path d="M70 124L138 34h24l68 90z" fill="#A8D3E6" ${K}/><path d="M126 52l12-18h24l12 18l-12 7l-12-7l-12 7z" fill="#FFFCF6" ${K}/>${hill('#B9DAA5',116)}<g class="fl"><rect x="250" y="72" width="8" height="46" fill="#F2A497" ${K}/><rect x="284" y="72" width="8" height="46" fill="#F2A497" ${K}/><path d="M240 64h60l-6 11h-48z" fill="#F2A497" ${K}/></g>`,
thailand:`<rect width="320" height="140" fill="#F2A497"/>${cloud(40,20)}<g class="fl"><circle cx="260" cy="40" r="20" fill="#F6D27A" ${K}/></g><path d="M-4 140V105Q80 60 160 95T324 85V140z" fill="#B9DAA5" ${K}/><g class="dr"><path d="M120 95l15-35h20l15 35z" fill="#FFFCF6" ${K}/><path d="M132 60l18-18l18 18z" fill="#A8D3E6" ${K}/></g>`,
singapore:`<rect width="320" height="140" fill="#A8D3E6"/>${cloud(30,20)}<path d="M-4 140V110Q80 80 160 100T324 105V140z" fill="#B9DAA5" ${K}/><g class="fl"><path d="M220 110l15-50h20l15 50z" fill="#F2A497" ${K}/><circle cx="250" cy="50" r="16" fill="#F6D27A" ${K}/></g>`,
malaysia:`<rect width="320" height="140" fill="#B9DAA5"/>${cloud(50,25)}<path d="M-4 140V100Q80 60 160 90T324 95V140z" fill="#A8D3E6" ${K}/><g class="fl"><rect x="140" y="45" width="8" height="60" fill="#F6D27A" ${K}/><rect x="160" y="45" width="8" height="60" fill="#F6D27A" ${K}/><path d="M136 45h36l-4-12h-28z" fill="#F6D27A" ${K}/></g>`,
general:`<rect width="320" height="140" fill="#A8D3E6"/>${cloud(18,30)}${cloud(220,64)}<g class="dr"><path d="M80 60l92-12q24-2 24 8t-24 8l-92-4z" fill="#F6D27A" ${K}/><path d="M124 58l-18-26h14l30 26z" fill="#F2A497" ${K}/></g>${hill('#B9DAA5',112)}<g class="fl"><rect x="232" y="92" width="44" height="34" rx="8" fill="#F2A497" ${K}/><path d="M244 92v-9h20v9" fill="none" ${K}/></g>`};
const scene=n=>`<svg viewBox="0 0 320 140" role="img" aria-label="旅行插圖">${SC[dest(n)]||SC.general}</svg>`;

/* ---------- 共用 UI ---------- */
function modal(title,body,onOk){const m=document.createElement('div');m.className='mask';
m.innerHTML=`<div class="box sheet bn"><div class="row" style="margin-top:0"><h3>${title}</h3><button class="btn x">✕</button></div>${body}<div class="row gap"><button class="btn cl">儲存</button></div></div>`;
const c=()=>m.remove();q(m,'.x').onclick=q(m,'.cl').onclick=async()=>{if(onOk)await onOk(m);c();};m.onclick=e=>{if(e.target===m)c()};
document.body.appendChild(m);return m}

const val=(m,s)=>q(m,s).value.trim();
const copy=async t=>{try{await navigator.clipboard.writeText(t);alert('已複製 ✨')}catch{prompt('請手動複製',t)}};

const getCountdownInfo = datesStr => {
    if(!datesStr) return { text: '未定日期', days: 999999 };
    const match = datesStr.match(/(\d{4})[年/.-]?\s*(\d{1,2})[月/.-]\s*(\d{1,2})/);
    if(!match) return { text: '', days: 999999 };
    const [,y,m,d] = match;
    const start = new Date(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}T00:00:00`);
    const now = new Date(); now.setHours(0,0,0,0);
    const diff = Math.ceil((start - now) / (1000 * 60 * 60 * 24));
    
    if(diff > 0) return { text: `🔥 倒數 ${diff} 天`, days: diff };
    if(diff === 0) return { text: `🎉 今天出發！`, days: 0 };
    return { text: `✈️ 進行中/已結束`, days: 888888 + Math.abs(diff) };
};

const ids=()=>JSON.parse(localStorage.getItem('my_subscribed_projects')||'[]');
const saveIds=a=>localStorage.setItem('my_subscribed_projects',JSON.stringify([...new Set(a)]));

async function renderProjects(){
    const l=$('pl'), a=ids();
    if(!a.length){ l.innerHTML='<p class="mute">還沒有專案，新增一個或輸入 6 位數號碼導入吧 ✨</p>'; return; }
    
    const snaps = await Promise.all(a.map(i=>getDoc(doc(db,'projects',i)).catch(()=>null)));
    let list = [];
    snaps.forEach(s=>{
        if(s && s.exists()){
            const p = s.data();
            const info = getCountdownInfo(p.dates);
            list.push({ id: s.id, ...p, days: info.days, countdownText: info.text });
        }
    });

    list.sort((x, y) => x.days - y.days);

    l.innerHTML = '';
    list.forEach(p => {
        const isExpired = p.days >= 888888;
        const flag = getFlagEmoji(p.name);
        const d=document.createElement('div');
        d.className='box item';
        d.style.display='flex'; d.style.justifyContent='space-between'; d.style.alignItems='center';
        if(isExpired) { d.style.opacity = '0.5'; }
        
        d.innerHTML=`<div style="flex:1;min-width:0" onclick="window.enterProj('${p.id}')"><div class="row" style="margin:0"><span class="tag">${esc(p.dates||'未定日期')}</span><small style="color:var(--co);font-weight:bold">${p.countdownText}</small></div><b style="font-size:16px;margin-top:4px">${flag} ${esc(p.name)}</b></div><button class="btn" style="background:#ffdddd;padding:6px 10px;margin-left:8px" onclick="event.stopPropagation();window.delProj('${p.id}')">🗑️</button>`;
        l.appendChild(d);
    });
}

window.enterProj = id => enter(id);
window.delProj = async id => {
    if(confirm('確定要從清單中移除這個專案嗎？')){
        saveIds(ids().filter(i=>i!==id));
        renderProjects();
    }
};

$('new').onclick=()=> {
    const m = document.createElement('div'); m.className='mask';
    m.innerHTML=`<div class="box sheet bn"><div class="row" style="margin-top:0"><h3>🌸 新增旅程</h3><button class="btn x">✕</button></div><label>旅程名稱</label><input id="n1" placeholder="例如：曼谷五日遊"><label>日期（請包含年份，例如：2027年 1/1-1/8）</label><input id="n2" placeholder="2027年 1/1 - 1/8"><div class="row gap"><button class="btn cl" id="n-ok">建立</button></div></div>`;
    const c=()=>m.remove(); q(m,'.x').onclick=c; m.onclick=e=>{if(e.target===m)c()};
    q(m,'#n-ok').onclick=async()=>{
        const name=val(m,'#n1'); if(!name){alert('請輸入名稱');return;}
        const pin=String(Math.floor(100000+Math.random()*900000)), r=await addDoc(collection(db,'projects'),{name,dates:val(m,'#n2'),pin,createdAt:Date.now()});
        saveIds([r.id,...ids()]); renderProjects(); c();
    };
    document.body.appendChild(m);
};

$('imp').onclick=()=>{
    const m = document.createElement('div'); m.className='mask';
    m.innerHTML=`<div class="box sheet bn"><div class="row" style="margin-top:0"><h3>📥 輸入 6 位數專案號碼</h3><button class="btn x">✕</button></div><input id="c1" maxlength="6" inputmode="numeric" placeholder="例如：883921" style="text-align:center;font-size:20px;letter-spacing:4px"><div class="row gap"><button class="btn cl" id="imp-ok">導入</button></div></div>`;
    const c=()=>m.remove(); q(m,'.x').onclick=c; m.onclick=e=>{if(e.target===m)c()};
    q(m,'#imp-ok').onclick=async()=>{
        const c_code=val(m,'#c1'), r=await getDocs(query(collection(db,'projects'),where('pin','==',c_code)));
        if(r.empty){alert('找不到這個專案號碼');return;}
        saveIds([r.docs[0].id,...ids()]); renderProjects(); c();
    };
    document.body.appendChild(m);
};

$('sh').onclick=()=>{const url=location.origin+location.pathname+'?project='+S.id;const m=modal('✨ 分享此專案',`<h1 style="text-align:center;letter-spacing:6px;margin:6px 0">${esc(S.pin||'------')}</h1><button class="btn gr" id="cp" style="width:100%;margin-bottom:8px">📋 複製 6 位數代碼</button><button class="btn aq" id="cu" style="width:100%">🔗 複製專屬網址</button>`);q(m,'#cp').onclick=()=>copy(S.pin);q(m,'#cu').onclick=()=>copy(url)};

async function enter(id){const s=await getDoc(doc(db,'projects',id));if(!s.exists())return;Object.assign(S,{id,name:s.data().name,pin:s.data().pin||''});
if(S.me)return open_();
const m=document.createElement('div'); m.className='mask';
m.innerHTML=`<div class="box sheet bn"><div class="row" style="margin-top:0"><h3>🌸 歡迎加入旅程</h3><button class="btn x">✕</button></div><input id="nm" placeholder="你的名字，例如：小明"><div class="row gap"><button class="btn cl" id="ent-ok">進入旅程</button></div></div>`;
const c=()=>m.remove(); q(m,'.x').onclick=c; m.onclick=e=>{if(e.target===m)c()};
q(m,'#ent-ok').onclick=()=>{
    const v=val(m,'#nm'); if(!v){alert('請輸入名字');return;}
    S.me=v; localStorage.setItem('my_travel_nickname',v); c(); open_();
};
document.body.appendChild(m);
}

function open_(){
const flag = getFlagEmoji(S.name);
$('v0').hidden=true;$('v1').hidden=false;$('nav').hidden=false;$('bk').hidden=false;$('sh').hidden=false;$('ref').hidden=true;$('ht').textContent=flag+' '+S.name;$('hs').textContent='旅伴：'+S.me;
S.day='all';S.lang=LG[dest(S.name)].c;rRemind();rLang();
setDoc(doc(db,'projects',S.id,'members',S.me),{name:S.me},{merge:true});

function detail(id){
const s=S.sch.find(x=>x.id===id);if(!s)return;
const t=clean(s.title);

const getGoogleQuery = () => {
    let pureTitle = t.replace(/^\[.*?\]\s*/, '').trim();
    let region = '';
    if(/濟州/.test(S.name)) region = '濟州島';
    else if(/首爾/.test(S.name)) region = '首爾';
    else if(/釜山/.test(S.name)) region = '釜山';
    else if(/曼谷/.test(S.name)) region = '曼谷';
    else if(/東京/.test(S.name)) region = '東京';
    else if(/大阪/.test(S.name)) region = '大阪';
    else if(/京都/.test(S.name)) region = '京都';
    else if(/新加坡/.test(S.name)) region = '新加坡';
    else if(/吉隆坡/.test(S.name)) region = '吉隆坡';
    else if(/香港/.test(S.name)) region = '香港';
    else if(/澳門/.test(S.name)) region = '澳門';
    
    return region && !pureTitle.includes(region) ? `${region} ${pureTitle}` : pureTitle;
};

const getNaverQuery = () => {
    const kw = q(m,'#map-kw')?.value?.trim();
    if(kw) return kw;
    let pureTitle = t.replace(/^\[.*?\]\s*/, '').trim();
    let region = '';
    if(/濟州/.test(S.name)) region = '濟州島';
    else if(/首爾/.test(S.name)) region = '首爾';
    else if(/釜山/.test(S.name)) region = '釜山';
    return region && !pureTitle.includes(region) ? `${region} ${pureTitle}` : pureTitle;
};

const setupMapButton = (btnId, mapType) => {
    const btn = q(m, btnId);
    if(!btn) return;
    let pressTimer;

    const handleTap = () => {
        let url = '';
        const customUrl = (mapType === 'naver' ? s.customNaverUrl : s.customGoogleUrl)?.trim();
        
        if (customUrl) {
            let targetUrl = customUrl;
            if (mapType === 'google') {
                if (!targetUrl.includes('/maps/dir/')) {
                    const encodedDest = encodeURIComponent(getGoogleQuery());
                    targetUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodedDest}&travelmode=driving`;
                }
            } else if (mapType === 'naver') {
                if (!targetUrl.includes('nmap://route/car')) {
                    const encodedDest = encodeURIComponent(getNaverQuery());
                    targetUrl = `nmap://route/car?destination=${encodedDest}&dname=${encodedDest}&appname=com.example.myapp`;
                }
            }
            url = targetUrl;
        } else {
            if (mapType === 'naver') {
                const queryStr = encodeURIComponent(getNaverQuery());
                url = `nmap://route/car?dlat=&dlng=&destination=${queryStr}&dname=${queryStr}&appname=com.example.myapp`;
            } else {
                const queryStr = encodeURIComponent(getGoogleQuery());
                url = `https://www.google.com/maps/dir/?api=1&destination=${queryStr}&travelmode=driving`;
            }
        }
        window.open(url, '_blank');
    };

    const handleLongPress = (e) => {
        e.preventDefault();
        const currentCustom = (mapType === 'naver' ? s.customNaverUrl : s.customGoogleUrl) || '';
        const titleName = mapType === 'naver' ? '💚 設定 Naver 自訂網址' : '💙 設定 Google 自訂網址';
        
        const subM = document.createElement('div'); subM.className='mask';
        subM.innerHTML=`<div class="box sheet bn"><div class="row" style="margin-top:0"><h3>${titleName}</h3><button class="btn x">✕</button></div><p style="font-size:12px;opacity:0.7;margin:0 0 6px">貼上網址後點擊下方儲存，之後點擊按鈕將直接導向該網址。</p><input id="custom-url-input" placeholder="請貼上網址 (https://...)" value="${esc(currentCustom)}"><div class="row gap"><button class="btn cl" id="sub-save">儲存</button></div></div>`;
        const closeSub = () => subM.remove();
        q(subM,'.x').onclick = closeSub; subM.onclick = ev => { if(ev.target === subM) closeSub(); };
        q(subM,'#sub-save').onclick = async () => {
            const newUrl = q(subM, '#custom-url-input').value.trim();
            if (mapType === 'naver') s.customNaverUrl = newUrl;
            else s.customGoogleUrl = newUrl;
            await updateDoc(doc(db,'projects',S.id,'schedules',id), {
                customNaverUrl: s.customNaverUrl || '',
                customGoogleUrl: s.customGoogleUrl || ''
            });
            alert('自訂網址已儲存 ✨');
            closeSub();
        };
        document.body.appendChild(subM);
    };

    btn.onclick = handleTap;
    btn.oncontextmenu = handleLongPress;
    btn.ontouchstart = (e) => { pressTimer = setTimeout(() => handleLongPress(e), 600); };
    btn.ontouchend = () => clearTimeout(pressTimer);
    btn.ontouchmove = () => clearTimeout(pressTimer);
};

$('sp').onclick=()=> {
    const m = document.createElement('div'); m.className='mask';
    m.innerHTML=`<div class="box sheet bn"><div class="row" style="margin-top:0"><h3>✨ 智慧導入行程</h3><button class="btn x">✕</button></div><textarea id="p1" rows="9" placeholder="貼上行程，例如：&#10;Day 1&#10;10:00 抵達機場&#10;備註：…"></textarea><div class="row gap"><button class="btn cl" id="sp-ok">開始拆解</button></div></div>`;
    const c=()=>m.remove(); q(m,'.x').onclick=c; m.onclick=e=>{if(e.target===m)c()};
    q(m,'#sp-ok').onclick=async()=>{
        const lines=val(m,'#p1').split('\n').map(l=>l.trim()).filter(Boolean); if(!lines.length){alert('請先貼上行程');return;}
        const CN='一二三四五六七八九十'; let day='Day 1', cur=null; const out=[];
        for(const raw of lines){
            const dm=raw.match(/Day\s*(\d+)|第([一二三四五六七八九十])天/i);
            if(dm){if(cur)out.push(cur); cur=null; day='Day '+(dm[1]||CN.indexOf(dm[2])+1); continue;}
            const line=raw.replace(/：/g,':'), tm=line.match(/(\d{1,2}):(\d{2})/);
            if(tm&&!/備註|營業時間/.test(line)){
                if(cur)out.push(cur);
                cur={day, time:tm[0], title:line.replace(/^[•\-\s]*\d{1,2}:\d{2}\s*/,'').trim(), location:'', mapKeyword:'', createdAt:Date.now()+out.length};
            }else if(cur) cur.location+=(cur.location?'\n':'')+raw;
        }
        if(cur) out.push(cur);
        await Promise.all(out.map(i=>addDoc(collection(db,'projects',S.id,'schedules'),i)));
        alert(`✨ 成功導入 ${out.length} 筆行程！`); c();
    };
    document.body.appendChild(m);
};

function compressAndConvert(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width; let height = img.height; const MAX_DIM = 500;
                if (width > height) { if (width > MAX_DIM) { height *= MAX_DIM / width; width = MAX_DIM; } }
                else { if (height > MAX_DIM) { width *= MAX_DIM / height; height = MAX_DIM; } }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', 0.6));
            };
            img.onerror = () => resolve(e.target.result); img.src = e.target.result;
        };
        reader.onerror = () => resolve(''); reader.readAsDataURL(file);
    });
}

    } catch(err) { console.error(err); alert('上傳失敗請稍後再試'); b.textContent='再試一次'; b.disabled=false; }
};
const np=q(m,'#np');if(np)np.onclick=async()=>{await setDoc(r,{scheduleId:id,uploader:S.me,photoUrl:'',at:Date.now()});m.remove()};
const un=q(m,'#un');if(un)un.onclick=async()=>{await deleteDoc(r);m.remove()}}

$('gal').onclick=()=>{const l=(S.all||[]).filter(c=>c.photoUrl).sort((a,b)=>b.at-a.at);
modal('📸 拍攝回憶寫真冊',l.length?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${l.map((c,i)=>{const s=S.sch.find(x=>x.id===c.scheduleId);return`<div style="border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff;transform:rotate(${i%2?1.5:-1.5}deg)"><img src="${esc(c.photoUrl)}" alt="" loading="lazy" style="width:100%;aspect-ratio:1;object-fit:cover;display:block"><small style="display:block;padding:2px 8px">${esc(s?clean(s.title):'')} · ${esc(c.uploader)}</small></div>`}).join('')}</div>`:'<p class="mute">還沒有照片，去闖關打卡拍一張吧 📷</p>', async()=>{});};

/* ---------- 啟動 ---------- */
$('hero0').innerHTML=scene('');
(async()=>{const p=new URLSearchParams(location.search).get('project');if(p){saveIds([p,...ids()]);history.replaceState({},'',location.pathname)}renderProjects()})();
</script></body></html>
