<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我們的溫馨小旅行 ✈️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #faf6f0; 
            max-width: 480px; 
            margin: auto; 
            min-height: 100vh; 
            position: relative; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .cute-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(220, 180, 150, 0.12);
            border: 1px solid #fcefe6;
        }
    </style>
</head>
<body class="pb-24 text-gray-700">

    <!-- 頂部標題區 -->
    <header class="bg-gradient-to-r from-amber-200 to-orange-200 text-amber-900 p-4 shadow-sm sticky top-0 z-50 flex justify-between items-center rounded-b-3xl">
        <div class="flex items-center gap-2.5">
            <button id="back-btn" onclick="backToProjects()" class="hidden bg-white/80 hover:bg-white text-amber-900 px-2.5 py-1.5 rounded-full text-xs font-bold shadow-sm transition active:scale-95 flex items-center gap-1">
                ⬅️ 專案
            </button>
            <div>
                <h1 id="header-title" class="text-base font-bold flex items-center gap-1.5">🌸 我的旅遊小專案</h1>
                <p id="header-sub" class="text-[11px] text-amber-800 opacity-80 mt-0.5">選擇你的冒險旅程 ✨</p>
            </div>
        </div>
        <button onclick="shareProject()" class="bg-white/85 hover:bg-white text-amber-900 text-xs px-3.5 py-1.5 rounded-full font-medium shadow-sm transition active:scale-95">
            ✨ 分享
        </button>
    </header>

    <!-- 內容容器 -->
    <main class="p-4 space-y-4">
        
        <!-- 視圖 0：專案選擇首頁 -->
        <div id="view-projects" class="space-y-4">
            <div class="flex justify-between items-center px-1">
                <h2 class="font-bold text-amber-900 text-sm">🧳 所有旅遊專案</h2>
                <button onclick="openNewProjectModal()" class="bg-orange-500 text-white text-xs px-3.5 py-2 rounded-xl font-bold shadow-md shadow-orange-200 transition active:scale-95">
                    ＋ 新增專案
                </button>
            </div>

            <!-- 專案列表容器 (動態渲染，最新的在最上面) -->
            <div id="project-list" class="space-y-3">
                <!-- 專案會由 JavaScript 自動帶入 -->
            </div>
        </div>

        <!-- 視圖 1：專案內部功能 (預設隱藏) -->
        <div id="view-workspace" class="hidden space-y-4">
            
            <!-- 分頁 1：行程 -->
            <div id="tab-schedule" class="tab-content space-y-4">
                <div class="cute-card p-4 space-y-3">
                    <h2 class="font-bold text-amber-900 text-sm flex items-center gap-1.5">🪄 AI 魔法貼上行程</h2>
                    <textarea id="smart-paste-input" rows="3" placeholder="把 LINE 亂亂的對話或部落格複製貼上來，AI 幫你整理好～" class="w-full text-xs p-3 bg-amber-50/50 border border-amber-100 rounded-xl focus:ring-2 focus:ring-orange-300 outline-none resize-none placeholder:text-gray-400"></textarea>
                    <button onclick="parseSmartPaste()" class="w-full bg-gradient-to-r from-orange-400 to-amber-400 text-white text-xs py-2.5 rounded-xl font-bold shadow-md shadow-orange-200 transition active:scale-95">
                        ✨ 開始魔法整理
                    </button>
                </div>

                <div class="space-y-3">
                    <h3 class="font-bold text-gray-600 text-xs tracking-wider px-1">📅 精彩行程時間軸</h3>
                    <div id="schedule-container" class="space-y-3">
                        <!-- 行程範例 -->
                        <div class="cute-card p-4 border-l-4 border-l-orange-400 space-y-2 relative">
                            <div class="flex justify-between items-center">
                                <span class="text-xs bg-orange-100 text-orange-700 px-2.5 py-0.5 rounded-full font-bold">14:00</span>
                                <div class="flex items-center gap-2">
                                    <span class="text-[11px] text-gray-400 font-medium">Day 1 🚗</span>
                                    <button onclick="alert('刪除範例行程')" class="text-gray-300 hover:text-red-500 text-xs">🗑️</button>
                                </div>
                            </div>
                            <h4 class="font-bold text-gray-800 text-sm">領車與機場出發發車囉！</h4>
                            <p class="text-xs text-gray-500">📍 地點：Lotte Rent-a-car 濟州機場店</p>
                            <div class="pt-2 flex gap-2">
                                <a href="https://maps.google.com/?q=Lotte+Rent-a-car+Jeju" target="_blank" class="text-xs bg-amber-50 text-amber-800 px-3 py-1.5 rounded-xl font-medium flex items-center gap-1">🗺 Google Maps</a>
                                <a href="#" class="text-xs bg-orange-50 text-orange-800 px-3 py-1.5 rounded-xl font-medium flex items-center gap-1">🚗 Naver Map</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 分頁 2：AI 錦囊 -->
            <div id="tab-ai" class="tab-content hidden space-y-4">
                <div class="cute-card p-4 space-y-2">
                    <h3 class="font-bold text-amber-900 text-sm flex items-center gap-1.5">🌤️ 當地天氣與穿搭</h3>
                    <p class="text-xs text-gray-600 leading-relaxed">氣溫舒服，風較大，建議攜帶防風外套與保暖配件 🧣。</p>
                </div>
            </div>

            <!-- 分頁 3：語言 -->
            <div id="tab-lang" class="tab-content hidden space-y-3">
                <div class="cute-card p-3.5 flex justify-between items-center">
                    <div>
                        <p class="text-[11px] text-gray-400 font-medium">請幫我結帳</p>
                        <p class="font-bold text-gray-800 text-sm mt-0.5">계산해주세요.</p>
                    </div>
                    <button onclick="speakText('계산해주세요.')" class="bg-orange-50 text-orange-600 p-2.5 rounded-2xl text-base">🔊</button>
                </div>
            </div>

            <!-- 分頁 4：分帳 -->
            <div id="tab-split" class="tab-content hidden space-y-4">
                <div class="bg-gradient-to-r from-orange-400 to-pink-400 text-white p-5 rounded-3xl shadow-lg shadow-orange-200/50 space-y-1">
                    <p class="text-xs opacity-90 font-medium">✨ 總花費金額</p>
                    <h3 class="text-2xl font-black tracking-tight">NT$ 24,500</h3>
                </div>
            </div>

        </div>
    </main>

    <!-- 底部導覽列 -->
    <nav id="bottom-nav" class="hidden fixed bottom-3 left-4 right-4 max-w-[448px] mx-auto bg-white/90 backdrop-blur-md border border-amber-100 flex justify-around py-3 rounded-2xl shadow-xl z-50">
        <button onclick="switchTab('schedule')" id="nav-schedule" class="flex flex-col items-center text-orange-500 text-xs font-bold gap-0.5"><span class="text-lg">📅</span>行程</button>
        <button onclick="switchTab('ai')" id="nav-ai" class="flex flex-col items-center text-gray-400 text-xs font-medium gap-0.5"><span class="text-lg">🤖</span>錦囊</button>
        <button onclick="switchTab('lang')" id="nav-lang" class="flex flex-col items-center text-gray-400 text-xs font-medium gap-0.5"><span class="text-lg">🗣️</span>語言</button>
        <button onclick="switchTab('split')" id="nav-split" class="flex flex-col items-center text-gray-400 text-xs font-medium gap-0.5"><span class="text-lg">💰</span>分帳</button>
    </nav>

    <!-- 邏輯與資料儲存控制 -->
    <script>
        // 使用 localStorage 暫存專案，確保重新整理資料不會不見，後續可完全對應 Firebase
        let projects = JSON.parse(localStorage.getItem('travel_projects')) || [
            { id: '1', name: '濟州島自駕遊', dates: '11/23 - 11/27', createdAt: Date.now() - 1000 }
        ];

        // 渲染專案列表（最新建立的排在最上面）
        function renderProjects() {
            const list = document.getElementById('project-list');
            list.innerHTML = '';
            
            // 依時間排序：大的（最新的）在前面
            projects.sort((a, b) => b.createdAt - a.createdAt);

            projects.forEach(p => {
                const card = document.createElement('div');
                card.className = "cute-card p-4 space-y-2 relative transition hover:border-orange-300";
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-xs bg-orange-100 text-orange-700 px-2.5 py-0.5 rounded-full font-bold">進行中 🚗</span>
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] text-gray-400 font-medium">${p.dates}</span>
                            <button onclick="event.stopPropagation(); deleteProject('${p.id}')" class="text-gray-400 hover:text-red-500 text-xs p-1">🗑️</button>
                        </div>
                    </div>
                    <div onclick="enterProject('${p.id}', '${p.name}', '${p.dates}')" class="cursor-pointer">
                        <h3 class="font-bold text-gray-800 text-base">🌸 ${p.name}</h3>
                        <p class="text-xs text-gray-500 mt-0.5">點擊進入專案行程管理 ✨</p>
                    </div>
                `;
                list.appendChild(card);
            });
            localStorage.setItem('travel_projects', JSON.stringify(projects));
        }

        // 新增專案
        window.openNewProjectModal = function() {
            const name = prompt("請輸入新旅遊專案名稱（例如：東京賞櫻行）：");
            if (!name) return;
            const dates = prompt("請輸入旅遊日期區間（例如：4/19 - 4/25）：", "未定日期");
            
            const newProj = {
                id: Date.now().toString(),
                name: name,
                dates: dates,
                createdAt: Date.now() // 記錄當前時間，確保排在最上方
            };
            
            projects.push(newProj);
            renderProjects();
            alert("✨ 新專案建立成功，已經幫你排在最上方囉！");
        }

        // 刪除專案
        window.deleteProject = function(id) {
            if (confirm("確定要刪除這個旅遊專案嗎？")) {
                projects = projects.filter(p => p.id !== id);
                renderProjects();
            }
        }

        window.enterProject = function(id, projectName, dateRange) {
            document.getElementById('view-projects').classList.add('hidden');
            document.getElementById('view-workspace').classList.remove('hidden');
            document.getElementById('bottom-nav').classList.remove('hidden');
            document.getElementById('back-btn').classList.remove('hidden');
            
            document.getElementById('header-title').innerText = `🌸 ${projectName}`;
            document.getElementById('header-sub').innerText = `日期：${dateRange} ✨`;
            switchTab('schedule');
        }

        window.backToProjects = function() {
            document.getElementById('view-workspace').classList.add('hidden');
            document.getElementById('bottom-nav').classList.add('hidden');
            document.getElementById('back-btn').classList.add('hidden');
            document.getElementById('view-projects').classList.remove('hidden');
            
            document.getElementById('header-title').innerText = "🌸 我的旅遊小專案";
            document.getElementById('header-sub').innerText = "選擇你的冒險旅程 ✨";
        }

        window.switchTab = function(tabName) {
            ['schedule', 'ai', 'lang', 'split'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).className = "flex flex-col items-center text-gray-400 text-xs font-medium gap-0.5";
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`nav-${tabName}`).className = "flex flex-col items-center text-orange-500 text-xs font-bold gap-0.5";
        }

        window.speakText = function(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            window.speechSynthesis.speak(utterance);
        }

        window.shareProject = function() {
            navigator.clipboard.writeText(window.location.href);
            alert("🌸 網址已複製！快傳給朋友一起加入吧！");
        }

        window.parseSmartPaste = function() {
            const text = document.getElementById('smart-paste-input').value;
            if(!text) { alert("請先輸入或貼上行程文字喔！"); return; }
            alert("✨ AI 魔法解析成功！行程已經加入囉～");
            document.getElementById('smart-paste-input').value = "";
        }

        // 初始化載入專案列表
        renderProjects();
    </script>
</body>
</html>
