<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我們的溫馨小旅行 ✈️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #faf6f0; 
            max-width: 480px; 
            margin: auto; 
            min-height: 100vh; 
            position: relative; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .cute-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(220, 180, 150, 0.12);
            border: 1px solid #fcefe6;
        }
    </style>
</head>
<body class="pb-24 text-gray-700">

    <!-- 頂部標題區 -->
    <header class="bg-gradient-to-r from-amber-200 to-orange-200 text-amber-900 p-4 shadow-sm sticky top-0 z-50 flex justify-between items-center rounded-b-3xl">
        <div class="flex items-center gap-2.5">
            <button id="back-btn" onclick="backToProjects()" class="hidden bg-white/80 hover:bg-white text-amber-900 px-2.5 py-1.5 rounded-full text-xs font-bold shadow-sm transition active:scale-95 flex items-center gap-1">
                ⬅️ 專案
            </button>
            <div>
                <h1 id="header-title" class="text-base font-bold flex items-center gap-1.5">🌸 我的旅遊小專案</h1>
                <p id="header-sub" class="text-[11px] text-amber-800 opacity-80 mt-0.5">選擇你的冒險旅程 ✨</p>
            </div>
        </div>
        <button id="share-btn" onclick="shareCurrentProject()" class="hidden bg-white/85 hover:bg-white text-amber-900 text-xs px-3.5 py-1.5 rounded-full font-medium shadow-sm transition active:scale-95">
            ✨ 分享專案
        </button>
    </header>

    <!-- 內容容器 -->
    <main class="p-4 space-y-4">
        
        <!-- 視圖 0：專案選擇首頁 -->
        <div id="view-projects" class="space-y-4">
            <div class="flex justify-between items-center px-1">
                <h2 class="font-bold text-amber-900 text-sm">🧳 我的旅遊專案清單</h2>
                <button onclick="openNewProjectModal()" class="bg-orange-500 text-white text-xs px-3.5 py-2 rounded-xl font-bold shadow-md shadow-orange-200 transition active:scale-95">
                    ＋ 新增專案
                </button>
            </div>

            <div id="project-list" class="space-y-3">
                <p class="text-center text-xs text-gray-400 py-6">載入中... ☁️</p>
            </div>
        </div>

        <!-- 視圖 1：專案內部功能 (預設隱藏) -->
        <div id="view-workspace" class="hidden space-y-4">
            
            <!-- 分頁 1：行程 -->
            <div id="tab-schedule" class="tab-content space-y-4">
                <!-- AI 智慧貼上卡片 -->
                <div class="cute-card p-4 space-y-3">
                    <h2 class="font-bold text-amber-900 text-sm flex items-center gap-1.5">🪄 AI 魔法貼上行程</h2>
                    <textarea id="smart-paste-input" rows="3" placeholder="請將多天行程貼上（自動偵測時間、Day 並聰明拆解）～" class="w-full text-xs p-3 bg-amber-50/50 border border-amber-100 rounded-xl focus:ring-2 focus:ring-orange-300 outline-none resize-none placeholder:text-gray-400"></textarea>
                    <button onclick="parseSmartPaste()" class="w-full bg-gradient-to-r from-orange-400 to-amber-400 text-white text-xs py-2.5 rounded-xl font-bold shadow-md shadow-orange-200 transition active:scale-95">
                        ✨ 開始聰明智慧拆解
                    </button>
                </div>

                <!-- 行程列表標題與手動新增按鈕 -->
                <div class="flex justify-between items-center px-1">
                    <h3 class="font-bold text-gray-600 text-xs tracking-wider">📅 精彩行程時間軸</h3>
                    <button onclick="openAddScheduleModal()" class="bg-amber-500 text-white text-xs px-3.5 py-2 rounded-xl font-bold shadow-sm shadow-amber-200 transition active:scale-95">
                        ＋ 手動新增行程
                    </button>
                </div>

                <!-- 動態行程時間軸容器 -->
                <div id="schedule-container" class="space-y-3">
                    <p class="text-center text-xs text-gray-400 py-4">正在載入行程... ⏳</p>
                </div>
            </div>

            <!-- 分頁 2：AI 錦囊 -->
            <div id="tab-ai" class="tab-content hidden space-y-4">
                <div class="cute-card p-4 space-y-2">
                    <h3 class="font-bold text-amber-900 text-sm flex items-center gap-1.5">🌤️ 當地天氣與穿搭</h3>
                    <p class="text-xs text-gray-600 leading-relaxed">氣溫舒服，風較大,建議攜帶防風外套與保暖配件 🧣。</p>
                </div>
            </div>

            <!-- 分頁 3：語言 -->
            <div id="tab-lang" class="tab-content hidden space-y-3">
                <div class="cute-card p-3.5 flex justify-between items-center">
                    <div>
                        <p class="text-[11px] text-gray-400 font-medium">請幫我結帳</p>
                        <p class="font-bold text-gray-800 text-sm mt-0.5">계산해주세요.</p>
                    </div>
                    <button onclick="speakText('계산해주세요.')" class="bg-orange-50 text-orange-600 p-2.5 rounded-2xl text-base">🔊</button>
                </div>
            </div>

            <!-- 分頁 4：分帳 -->
            <div id="tab-split" class="tab-content hidden space-y-4">
                <div class="bg-gradient-to-r from-orange-400 to-pink-400 text-white p-5 rounded-3xl shadow-lg shadow-orange-200/50 space-y-1">
                    <p class="text-xs opacity-90 font-medium">✨ 總花費金額</p>
                    <h3 class="text-2xl font-black tracking-tight">NT$ 24,500</h3>
                </div>
            </div>

        </div>
    </main>

    <!-- 🌸 手動新增行程的互動彈跳表單 (Modal) -->
    <div id="schedule-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="cute-card bg-white w-full max-w-sm p-5 space-y-4 shadow-2xl animate-fade-in">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-amber-900 text-base">✏️ 手動新增行程</h3>
                <button onclick="closeAddScheduleModal()" class="text-gray-400 hover:text-gray-600 text-sm font-bold">✕</button>
            </div>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-gray-600 mb-1">天數（例如：Day 1）</label>
                    <input type="text" id="input-day" value="Day 1" class="w-full p-2.5 bg-amber-50/50 border border-amber-100 rounded-xl outline-none focus:ring-2 focus:ring-orange-300">
                </div>
                <div>
                    <label class="block font-bold text-gray-600 mb-1">時間（例如：14:00）</label>
                    <input type="text" id="input-time" value="10:00" class="w-full p-2.5 bg-amber-50/50 border border-amber-100 rounded-xl outline-none focus:ring-2 focus:ring-orange-300">
                </div>
                <div>
                    <label class="block font-bold text-gray-600 mb-1">行程名稱</label>
                    <input type="text" id="input-title" placeholder="例如：黑豬肉晚餐" class="w-full p-2.5 bg-amber-50/50 border border-amber-100 rounded-xl outline-none focus:ring-2 focus:ring-orange-300">
                </div>
                <div>
                    <label class="block font-bold text-gray-600 mb-1">地圖導航地點（選填，預設同行程名稱）</label>
                    <input type="text" id="input-location" placeholder="例如：濟州島黑豬肉餐廳" class="w-full p-2.5 bg-amber-50/50 border border-amber-100 rounded-xl outline-none focus:ring-2 focus:ring-orange-300">
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="closeAddScheduleModal()" class="flex-1 bg-gray-100 text-gray-600 text-xs py-2.5 rounded-xl font-bold transition active:scale-95">取消</button>
                <button onclick="submitScheduleForm()" class="flex-1 bg-gradient-to-r from-orange-400 to-amber-400 text-white text-xs py-2.5 rounded-xl font-bold shadow-md shadow-orange-200 transition active:scale-95">確認新增</button>
            </div>
        </div>
    </div>

    <!-- 底部導覽列 -->
    <nav id="bottom-nav" class="hidden fixed bottom-3 left-4 right-4 max-w-[448px] mx-auto bg-white/90 backdrop-blur-md border border-amber-100 flex justify-around py-3 rounded-2xl shadow-xl z-50">
        <button onclick="switchTab('schedule')" id="nav-schedule" class="flex flex-col items-center text-orange-500 text-xs font-bold gap-0.5"><span class="text-lg">📅</span>行程</button>
        <button onclick="switchTab('ai')" id="nav-ai" class="flex flex-col items-center text-gray-400 text-xs font-medium gap-0.5"><span class="text-lg">🤖</span>錦囊</button>
        <button onclick="switchTab('lang')" id="nav-lang" class="flex flex-col items-center text-gray-400 text-xs font-medium gap-0.5"><span class="text-lg">🗣️</span>語言</button>
        <button onclick="switchTab('split')" id="nav-split" class="flex flex-col items-center text-gray-400 text-xs font-medium gap-0.5"><span class="text-lg">💰</span>分帳</button>
    </nav>

    <!-- Firebase 與表單邏輯控制 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDoc, deleteDoc, doc, setDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcKmZhJaZn5emOlHRV95-uC9q01wFxt4M",
            authDomain: "my-travel-app-6e00c.firebaseapp.com",
            projectId: "my-travel-app-6e00c",
            storageBucket: "my-travel-app-6e00c.firebasestorage.app",
            messagingSenderId: "135860333246",
            appId: "1:135860333246:web:a25402eb743d6cebc9ccef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentProjectId = null;
        let unsubscribeSchedules = null;

        function getMyProjectIds() {
            return JSON.parse(localStorage.getItem('my_subscribed_projects')) || [];
        }

        function saveMyProjectId(id) {
            let list = getMyProjectIds();
            if (!list.includes(id)) {
                list.unshift(id);
                localStorage.setItem('my_subscribed_projects', JSON.stringify(list));
            }
        }

        function removeMyProjectId(id) {
            let list = getMyProjectIds();
            list = list.filter(item => item !== id);
            localStorage.setItem('my_subscribed_projects', JSON.stringify(list));
        }

        async function renderProjects() {
            const list = document.getElementById('project-list');
            const myIds = getMyProjectIds();

            if (myIds.length === 0) {
                list.innerHTML = `<p class="text-center text-xs text-gray-400 py-6">目前沒有專案。點上方按鈕新增，或透過朋友的分享連結加入！✨</p>`;
                return;
            }

            list.innerHTML = '';
            for (let id of myIds) {
                try {
                    const docRef = doc(db, "projects", id);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        const p = docSnap.data();
                        const card = document.createElement('div');
                        card.className = "cute-card p-4 space-y-2 relative transition hover:border-orange-300";
                        card.innerHTML = `
                            <div class="flex justify-between items-center">
                                <span class="text-xs bg-orange-100 text-orange-700 px-2.5 py-0.5 rounded-full font-bold">進行中 🚗</span>
                                <div class="flex items-center gap-2">
                                    <span class="text-[11px] text-gray-400 font-medium">${p.dates}</span>
                                    <button onclick="event.stopPropagation(); removeProjectFromMyList('${id}')" class="text-gray-400 hover:text-red-500 text-xs p-1" title="從我的清單移除">🗑️</button>
                                </div>
                            </div>
                            <div onclick="enterProject('${id}', '${p.name}', '${p.dates}')" class="cursor-pointer">
                                <h3 class="font-bold text-gray-800 text-base">🌸 ${p.name}</h3>
                                <p class="text-xs text-gray-500 mt-0.5">點擊進入專案行程管理 ✨</p>
                            </div>
                        `;
                        list.appendChild(card);
                    }
                } catch (e) {
                    console.error("載入專案錯誤", e);
                }
            }
        }

        window.openNewProjectModal = async function() {
            const name = prompt("請輸入新旅遊專案名稱（例如：濟州島自駕遊）：");
            if (!name) return;
            const dates = prompt("請輸入旅遊日期區間（例如：11/23 - 11/27）：", "11/23 - 11/27");
            
            try {
                const newId = 'proj_' + Date.now();
                await setDoc(doc(db, "projects", newId), {
                    name: name,
                    dates: dates,
                    createdAt: Date.now()
                });
                saveMyProjectId(newId);
                renderProjects();
                alert("✨ 新專案建立成功！");
            } catch (e) {
                console.error("新增失敗: ", e);
                alert("新增失敗，請檢查網路連線");
            }
        }

        window.removeProjectFromMyList = function(id) {
            if (confirm("確定要從你的畫面上移除這個專案嗎？")) {
                removeMyProjectId(id);
                renderProjects();
            }
        }

        window.enterProject = function(id, projectName, dateRange) {
            currentProjectId = id;
            document.getElementById('view-projects').classList.add('hidden');
            document.getElementById('view-workspace').classList.remove('hidden');
            document.getElementById('bottom-nav').classList.remove('hidden');
            document.getElementById('back-btn').classList.remove('hidden');
            document.getElementById('share-btn').classList.remove('hidden');
            
            document.getElementById('header-title').innerText = `🌸 ${projectName}`;
            document.getElementById('header-sub').innerText = `日期：${dateRange} ✨`;
            switchTab('schedule');
            loadSchedules(id);
        }

        window.backToProjects = function() {
            currentProjectId = null;
            if (unsubscribeSchedules) unsubscribeSchedules();
            document.getElementById('view-workspace').classList.add('hidden');
            document.getElementById('bottom-nav').classList.add('hidden');
            document.getElementById('back-btn').classList.add('hidden');
            document.getElementById('share-btn').classList.add('hidden');
            document.getElementById('view-projects').classList.remove('hidden');
            
            document.getElementById('header-title').innerText = "🌸 我的旅遊小專案";
            document.getElementById('header-sub').innerText = "選擇你的冒險旅程 ✨";
            renderProjects();
        }

        function loadSchedules(projId) {
            const container = document.getElementById('schedule-container');
            const schedulesRef = collection(db, "projects", projId, "schedules");
            const q = query(schedulesRef, orderBy("createdAt", "asc"));

            if (unsubscribeSchedules) unsubscribeSchedules();

            unsubscribeSchedules = onSnapshot(q, (snapshot) => {
                container.innerHTML = '';
                if (snapshot.empty) {
                    container.innerHTML = `<p class="text-center text-xs text-gray-400 py-6">目前還沒有行程，快點擊上方按鈕新增或用 AI 貼上吧！✨</p>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const s = docSnap.data();
                    const sId = docSnap.id;

                    const card = document.createElement('div');
                    card.className = "cute-card p-4 border-l-4 border-l-orange-400 space-y-2 relative";
                    card.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="text-xs bg-orange-100 text-orange-700 px-2.5 py-0.5 rounded-full font-bold">${s.time || '全天'}</span>
                            <div class="flex items-center gap-2">
                                <span class="text-[11px] text-gray-400 font-medium">${s.day || 'Day 1'}</span>
                                <button onclick="deleteSchedule('${sId}')" class="text-gray-300 hover:text-red-500 text-xs p-1">🗑️</button>
                            </div>
                        </div>
                        <h4 class="font-bold text-gray-800 text-sm">${s.title}</h4>
                        <p class="text-xs text-gray-500">📍 地點：${s.location || s.title}</p>
                        <div class="pt-2 flex gap-2">
                            <a href="https://maps.google.com/?q=${encodeURIComponent(s.location || s.title)}" target="_blank" class="text-xs bg-amber-50 text-amber-800 px-3 py-1.5 rounded-xl font-medium flex items-center gap-1">🗺 Google Maps</a>
                            <a href="https://map.naver.com/v5/search/${encodeURIComponent(s.location || s.title)}" target="_blank" class="text-xs bg-orange-50 text-orange-800 px-3 py-1.5 rounded-xl font-medium flex items-center gap-1">🚗 Naver Map</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
        }

        // 🌸 開啟手動新增表單 Modal
        window.openAddScheduleModal = function() {
            if (!currentProjectId) return;
            document.getElementById('schedule-modal').classList.remove('hidden');
        }

        // 🌸 關閉手動新增表單 Modal
        window.closeAddScheduleModal = function() {
            document.getElementById('schedule-modal').classList.add('hidden');
        }

        // 🌸 提交手動新增表單
        window.submitScheduleForm = async function() {
            if (!currentProjectId) return;
            const day = document.getElementById('input-day').value.trim() || "Day 1";
            const time = document.getElementById('input-time').value.trim() || "10:00";
            const title = document.getElementById('input-title').value.trim();
            let location = document.getElementById('input-location').value.trim();

            if (!title) {
                alert("請填寫行程名稱！");
                return;
            }
            if (!location) {
                location = title;
            }

            try {
                await addDoc(collection(db, "projects", currentProjectId, "schedules"), {
                    day,
                    time,
                    title,
                    location,
                    createdAt: Date.now()
                });
                closeAddScheduleModal();
                // 清空欄位
                document.getElementById('input-title').value = '';
                document.getElementById('input-location').value = '';
                alert("✨ 行程新增成功！");
            } catch (e) {
                console.error("新增行程失敗", e);
                alert("新增失敗，請檢查網路連線");
            }
        }

        window.deleteSchedule = async function(scheduleId) {
            if (!currentProjectId) return;
            if (confirm("確定要刪除這個行程嗎？")) {
                try {
                    await deleteDoc(doc(db, "projects", currentProjectId, "schedules", scheduleId));
                } catch (e) {
                    console.error("刪除失敗", e);
                }
            }
        }

        window.parseSmartPaste = async function() {
            const rawText = document.getElementById('smart-paste-input').value.trim();
            if(!rawText) { alert("請先輸入或貼上行程文字喔！"); return; }

            alert("✨ AI 正在智慧解析與清洗文字中...");

            const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            let currentDay = "Day 1";
            let addedCount = 0;

            try {
                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i];

                    if (
                        line.includes("===") || 
                        line.includes("---") || 
                        line.includes("旅遊專案") || 
                        line.includes("簡介：") || 
                        line.length < 4
                    ) {
                        continue; 
                    }

                    let dayMatch = line.match(/(Day\s*\d+|第[一二三四五六七八九十]+天)/i);
                    if (dayMatch) {
                        currentDay = dayMatch[0];
                        continue;
                    }

                    let timeMatch = line.match(/(\d{1,2}[:：]\d{2})/);
                    let timeStr = timeMatch ? timeMatch[1] : "彈性";

                    let cleanTitle = line
                        .replace(/^\d{1,2}[:：]\d{2}\s*/, '')
                        .replace(/^[•\-\*]\s*/, '')
                        .trim();

                    if (!cleanTitle || cleanTitle.length < 2) continue;

                    let cleanLocation = cleanTitle
                        .replace(/\[.*?\]/g, '')
                        .trim();
                    if (!cleanLocation) cleanLocation = cleanTitle;

                    await addDoc(collection(db, "projects", currentProjectId, "schedules"), {
                        time: timeStr,
                        title: cleanTitle,
                        location: cleanLocation,
                        day: currentDay,
                        createdAt: Date.now() + addedCount
                    });
                    addedCount++;
                }

                document.getElementById('smart-paste-input').value = "";
                alert(`✨ 成功！已智慧清洗並幫您加入了 ${addedCount} 筆乾淨的行程卡片！`);
            } catch (e) {
                console.error("AI 拆解失敗", e);
                alert("解析發生錯誤，請再試一次");
            }
        }

        window.shareCurrentProject = function() {
            if (!currentProjectId) return;
            const baseUrl = window.location.href.split('?')[0];
            const shareUrl = `${baseUrl}?project=${currentProjectId}`;
            navigator.clipboard.writeText(shareUrl);
            alert("🌸 專屬分享網址已複製！朋友點開後會自動將這個專案加入清單中！");
        }

        window.switchTab = function(tabName) {
            ['schedule', 'ai', 'lang', 'split'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).className = "flex flex-col items-center text-gray-400 text-xs font-medium gap-0.5";
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`nav-${tabName}`).className = "flex flex-col items-center text-orange-500 text-xs font-bold gap-0.5";
        }

        window.speakText = function(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            window.speechSynthesis.speak(utterance);
        }

        async function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const sharedProjId = urlParams.get('project');

            if (sharedProjId) {
                saveMyProjectId(sharedProjId);
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            renderProjects();
        }

        initApp();
    </script>
</body>
</html>
