header{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:3px solid var(--ink);margin:0 -14px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}

let authMode = "login";

const uid = () => state.user?.uid || "";

const cleanTitle = title =>

const money = amount =>
  "NT$ " + Math.round(amount).toLocaleString();

function notify(message) {
  $("status").textContent = message;
  $("status").hidden = false;
}

function errorMessage(error) {
  const messages = {
    "auth/invalid-credential": "帳號或密碼不正確。",
    "auth/user-not-found": "帳號或密碼不正確。",
    "auth/wrong-password": "帳號或密碼不正確。",
    "auth/email-already-in-use": "這個帳號已被註冊。",
    "auth/weak-password": "密碼強度不足，請依密碼政策設定。",
    "auth/password-does-not-meet-requirements": "密碼不符合 Firebase 密碼政策。",
    "auth/too-many-requests": "嘗試次數過多，請稍後再試。",
    "auth/network-request-failed": "網路連線失敗，請稍後重試。",
    "auth/operation-not-allowed": "尚未啟用 Firebase 帳號密碼登入。",
    "auth/unauthorized-domain": "網站網域尚未加入 Firebase 授權網域。",
    "permission-denied": "沒有權限，或 Firebase 權限規則尚未設定。"
  };

  return messages[error.code] ||
    "操作失敗，錯誤代碼：" + (error.code || "unknown");
}

async function runButton(button, operation) {
  if (button.disabled) return;

  const original = button.textContent;
  button.disabled = true;
  button.textContent = "處理中…";

  try {
    return await operation();
  } catch (error) {
    notify(errorMessage(error));
    return false;
  } finally {
    button.disabled = false;
    button.textContent = original;
  }
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    notify("已複製 ✨");
  } catch {
    prompt("請手動複製", text);
  }
}

/* ---------- 共用視窗 ---------- */
function modal(title, body, onSave = null) {
  const mask = document.createElement("div");
  mask.className = "mask";

  mask.innerHTML = `
    <div class="box sheet bn" role="dialog" aria-modal="true" tabindex="-1">
      <div class="row" style="margin-top:0">
        <h3>${title}</h3>
        <button class="btn close" aria-label="關閉">✕</button>
      </div>
      ${body}
      <p class="error modal-error" role="alert"></p>
      <div class="row gap">
        <button class="btn save">${onSave ? "儲存" : "完成"}</button>
      </div>
    </div>
  `;

  const previousFocus = document.activeElement;
  let saving = false;

  const close = () => {
    if (saving) return;
    mask.remove();
    previousFocus?.focus();
  };

  q(mask, ".close").onclick = close;

  q(mask, ".save").onclick = async () => {
    if (saving) return;

    const button = q(mask, ".save");
    const original = button.textContent;

    saving = true;
    button.disabled = true;
    q(mask, ".close").disabled = true;
    q(mask, ".modal-error").textContent = "";
    button.textContent = onSave ? "儲存中…" : "完成";

    try {
      if (onSave && await onSave(mask) === false) return;

      mask.remove();
      if (onSave) notify("已儲存 ✨");
      previousFocus?.focus();
    } catch (error) {
      q(mask, ".modal-error").textContent = errorMessage(error);
    } finally {
      saving = false;
      button.disabled = false;
      button.textContent = original;
      q(mask, ".close").disabled = false;
    }
  };

  mask.onclick = event => {
    if (event.target === mask) close();
  };

  mask.onkeydown = event => {
    if (event.key === "Escape") {
      event.stopPropagation();
      close();
    }

    if (event.key === "Tab") {
      const controls = [...mask.querySelectorAll(
        "button,input,select,textarea,a[href]"
      )].filter(element =>
        !element.disabled && element.getClientRects().length
      );

      const first = controls[0];
      const last = controls.at(-1);

      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last?.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first?.focus();
      }
    }
  };

  document.body.appendChild(mask);
  q(mask, ".sheet").focus();

  return mask;
}

/* ---------- 手繪插圖 ---------- */
const STROKE =
  'stroke="#3E3A39" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';

function scene(name = "") {

  return `

      <g class="dr">
        <path d="M18 42q-2-14 14-12q8-12 22 0q14-2 12 12z"
          fill="#FFFCF6" ${STROKE}/>
      </g>
      <g class="fl">
        <circle cx="268" cy="31" r="17" fill="#F6D27A" ${STROKE}/>
      </g>
      <path d="M-4 140V108Q80 72 160 106T324 100V140z"
        fill="#B9DAA5" ${STROKE}/>
      ${korea ? `
        <g class="fl">
          <circle cx="66" cy="107" r="18" fill="#F6D27A" ${STROKE}/>
          <path d="M66 89q4-9 13-8" fill="none" ${STROKE}/>
        </g>
      ` : `
        <g class="dr">
          <path d="M80 58l92-12q24-2 24 8t-24 8l-92-4z"
            fill="#F6D27A" ${STROKE}/>
          <path d="M124 56l-18-26h14l30 26z"
            fill="#F2A497" ${STROKE}/>
        </g>
      `}
      <g class="fl">
        <rect x="232" y="92" width="44" height="34" rx="8"
          fill="#F2A497" ${STROKE}/>
        <path d="M244 92v-9h20v9" fill="none" ${STROKE}/>
      </g>

}

/* ---------- 目的地 ---------- */
function destinationType(name = "") {
  if (/濟州|韓國|釜山|首爾|仁川|大邱|江陵|慶州|全州|束草|水原|Jeju|Seoul|Busan|Korea/i.test(name)) {
    return "korea";
  }

  if (/日本|東京|大阪|京都|沖繩|北海道|Japan|Tokyo|Osaka/i.test(name)) {
    return "japan";
  }

  if (/曼谷|泰國|清邁|普吉島|芭達雅|Thailand|Bangkok/i.test(name)) {
    return "thailand";
  }

  if (/新加坡|Singapore/i.test(name)) return "singapore";
  if (/馬來西亞|吉隆坡|檳城|沙巴|Malaysia/i.test(name)) return "malaysia";
  if (/香港|Hong Kong/i.test(name)) return "hongkong";
  if (/澳門|Macau/i.test(name)) return "macau";

  return "general";
}

function flag(name) {
  return {
    korea: "🇰🇷",
    japan: "🇯🇵",
    thailand: "🇹🇭",
    singapore: "🇸🇬",
    malaysia: "🇲🇾",
    hongkong: "🇭🇰",
    macau: "🇲🇴",
    general: "🧳"
  }[destinationType(name)];
}

function countdown(dateText = "") {
  const match = dateText.match(
    /(\d{4})[年/.-]?\s*(\d{1,2})[月/.-]\s*(\d{1,2})/
  );

  if (!match) return { text: "日期待定", order: 999999 };

  const start = new Date(
    Number(match[1]),
    Number(match[2]) - 1,
    Number(match[3])
  );

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const days = Math.ceil((start - today) / 86400000);

  if (days > 0) return { text: `🔥 倒數 ${days} 天`, order: days };
  if (days === 0) return { text: "🎉 今天出發！", order: 0 };

  return {
    text: "✈️ 進行中／已結束",
    order: 888888 + Math.abs(days)
  };
}

$("auth-form").onsubmit = async event => {
  event.preventDefault();

  const username = $("auth-username").value.trim().toLowerCase();
  const password = $("auth-password").value;
  const nickname = $("auth-nickname").value.trim();

  $("auth-error").textContent = "";

  if (!/^[a-z][a-z0-9_]{2,23}$/.test(username)) {
    $("auth-error").textContent =
      "帳號限 3–24 個英文字母、數字或底線，並以英文字母開頭。";
    return;
  }

  if (authMode === "register") {
    if (!nickname || nickname.length > 30) {
      $("auth-error").textContent = "請輸入 1–30 字的暱稱。";
      return;
    }

    if (password.length < 8) {
      $("auth-error").textContent = "密碼至少需要 8 碼。";
      return;
    }

    if (password !== $("auth-confirm").value) {
      $("auth-error").textContent = "兩次輸入的密碼不同。";
      return;
    }
  }

  $("auth-submit").disabled = true;

  try {
    if (authMode === "register") {
      sessionStorage.setItem("travel.pendingNickname", nickname);

      await createUserWithEmailAndPassword(
        auth,
        accountEmail(username),
        password
      );
    } else {
      sessionStorage.removeItem("travel.pendingNickname");

      await signInWithEmailAndPassword(
        auth,
        accountEmail(username),
        password
      );
    }

    $("auth-password").value = "";
    $("auth-confirm").value = "";
  } catch (error) {
    sessionStorage.removeItem("travel.pendingNickname");
    $("auth-error").textContent = errorMessage(error);
  } finally {
    $("auth-submit").disabled = false;
  }
};

async function ensureProfile(user) {
  const reference = doc(db, "users", user.uid);
  let snapshot = await getDoc(reference);

  if (!snapshot.exists()) {
    const username = user.email.split("@")[0];

    await setDoc(reference, {
      username,
      displayName:
        sessionStorage.getItem("travel.pendingNickname") || username,
      createdAt: Date.now()
    });

    snapshot = await getDoc(reference);
  }

  sessionStorage.removeItem("travel.pendingNickname");
  return snapshot.data();
}

async function renderProjects() {
  if (!state.user || !state.profile) return;

  const revision = authRevision;
  const currentUid = uid();

  $("projects").innerHTML =
    '<p class="mute">正在整理你的旅程…☁️</p>';

  try {
    const [owned, joined] = await Promise.all([
      getDocs(query(
        collection(db, "projects"),
        where("ownerUid", "==", currentUid)
      )),
      getDocs(query(
        collection(db, "projects"),
        where("memberUids", "array-contains", currentUid)
      ))
    ]);

    if (revision !== authRevision) return;

    const projects = [
      ...new Map(
        [...owned.docs, ...joined.docs].map(snapshot => [
          snapshot.id,
          { ...snapshot.data(), id: snapshot.id }
        ])
      ).values()
    ];

    projects.sort((a, b) =>
      countdown(a.dates).order - countdown(b.dates).order
    );

    $("projects").innerHTML = projects.length
      ? projects.map(project => `
          <article class="box trip-card">
            <span class="tag">${esc(project.dates || "日期待定")}</span>
            <small>
              ${project.ownerUid === currentUid
                ? "👑 我是負責人"
                : "🌷 旅程成員"}
            </small>
            <h3>${flag(project.name)} ${esc(project.name)}</h3>
            <p class="hint">${esc(countdown(project.dates).text)}</p>
            <button class="btn aq" data-project="${esc(project.id)}">
              打開旅程 →
            </button>
          </article>
        `).join("")
      : `
          <div class="box empty">
            <h3>下一段旅程，從這裡開始 🌱</h3>
            <p>建立旅程，或請負責人將你的帳號加入成員。</p>
            <small>舊旅程完成帳號歸屬設定後才會出現。</small>
          </div>
        `;

    $("projects").querySelectorAll("[data-project]").forEach(button => {
      button.onclick = () =>
        runButton(button, () => openProject(button.dataset.project));
    });
  } catch (error) {
    if (revision !== authRevision) return;

    $("projects").innerHTML = `
      <div class="box">
        <p>旅程載入失敗，請確認網路與權限設定。</p>
        <button id="retry-projects" class="btn">重新載入</button>
      </div>
    `;

    $("retry-projects").onclick = renderProjects;
    notify(errorMessage(error));
  }
}

async function openProject(projectId) {
  if (!state.user || !state.profile) return;

  const revision = authRevision;
  const snapshot = await getDoc(doc(db, "projects", projectId));

  if (revision !== authRevision) return;

  if (!snapshot.exists()) {
    notify("找不到旅程。");
    return;
  }

  const project = snapshot.data();

  if (
    project.ownerUid !== uid() &&
    !project.memberUids?.includes(uid())
  ) {
    notify("你尚未獲准加入這趟旅程。");
    return;
  }

  stopProject();
  state.project = { ...project, id: projectId };

  startProject();
}

function startProject() {
  const projectId = state.project.id;
  const revision = projectRevision;

  $("home-view").hidden = true;
  $("project-view").hidden = false;
  $("navigation").hidden = false;
  $("back").hidden = false;
  $("share").hidden = false;
  $("manage").hidden = !isOwner();

  $("header-title").textContent =
    flag(state.project.name) + " " + state.project.name;

  $("header-subtitle").textContent = "旅伴：" + myName();

  renderSchedules();
  renderCollection();
  renderExpenses();
  renderReminders();
  renderLanguage();

  const failed = error => {
    if (revision !== projectRevision) return;
    goHome();
    notify("連線或權限已變更，請重新開啟旅程。" + errorMessage(error));
  };

  state.unsubscribers.push(onSnapshot(
    doc(db, "projects", projectId),
    snapshot => {
      if (revision !== projectRevision) return;

      const project = snapshot.data();

      if (
        !project ||
        (
          project.ownerUid !== uid() &&
          !project.memberUids?.includes(uid())
        )
      ) {
        goHome();
        notify("你已不在這趟旅程的成員名單中。");
        return;
      }

      state.project = { ...project, id: projectId };
      $("manage").hidden = !isOwner();
    },
    failed
  ));

  const subscribe = (name, callback) => {
    state.unsubscribers.push(onSnapshot(
      collection(db, "projects", projectId, name),
      snapshot => {
        if (revision !== projectRevision) return;

        callback(snapshot.docs.map(item => ({
          ...item.data(),
          id: item.id
        })));
      },
      failed
    ));
  };

  subscribe("schedules", items => {
    state.schedules = items;
    renderSchedules();
    renderCollection();
  });

  subscribe("members", items => {
    state.members = items;
    renderExpenses();
  });

  subscribe("expenses", items => {
    state.expenses = items.sort((a, b) =>
      (a.createdAt || 0) - (b.createdAt || 0)
    );
    renderExpenses();
  });

  subscribe("checkins", items => {
    state.checkins = items;
    state.personalCheckins = {};

    items.filter(item => item.uploaderUid === uid()).forEach(item => {
      state.personalCheckins[item.scheduleId] = item;
    });

    renderCollection();
  });

  setDoc(doc(db, "projects", projectId, "members", uid()), {
    name: myName(),
    userUid: uid()
  }, { merge: true }).catch(failed);

  selectTab("schedule");
}

/* ---------- 行程排序 ---------- */
function timeOrder(time) {
  const match = String(time || "").match(/(\d{1,2})[:：](\d{2})/);
  return match ? Number(match[1]) * 60 + Number(match[2]) : 1440;
}

function dayOrder(day) {
  if (/^\d{4}-\d{2}-\d{2}$/.test(day || "")) {
    return Date.parse(day) / 86400000;
  }

  return Number(String(day || "").replace(/\D/g, "")) || 1;
}

function scheduleOrder(a, b) {
  return dayOrder(a.day) - dayOrder(b.day) ||
    timeOrder(a.time) - timeOrder(b.time) ||
    (a.createdAt || 0) - (b.createdAt || 0);
}

function validDay(day) {
  if (/^Day\s*[1-9]\d*$/i.test(day)) return true;

  if (
    !/^\d{4}-\d{2}-\d{2}$/.test(day) ||
    !Number.isFinite(Date.parse(day))
  ) return false;

  return new Date(day).toISOString().slice(0, 10) === day;
}

/* ---------- 地圖 ---------- */
function mapQuery(schedule) {
  const projectName = state.project?.name || "";

  const region = (
    projectName.match(
      /濟州島?|首爾|釜山|仁川|大邱|江陵|慶州|全州|束草|水原|東京|大阪|京都|沖繩|北海道|曼谷|清邁|新加坡|吉隆坡|香港|澳門|Jeju|Seoul|Busan/i
    ) || []
  )[0] || projectName;

  const place = schedule.place ||
    schedule.mapKeyword ||
    cleanTitle(schedule.title).replace(/^\[.*?\]\s*/, "");

  return [region, place].filter(Boolean).join(" ");
}

function safeMapUrl(raw, type) {
  try {
    const url = new URL(raw);

    const hosts = type === "google"
      ? ["google.com", "maps.google.com", "maps.app.goo.gl", "goo.gl"]
      : ["map.naver.com", "naver.me", "m.map.naver.com"];

    const validHost = hosts.some(host =>
      url.hostname === host || url.hostname.endsWith("." + host)
    );

    return url.protocol === "https:" && validHost ? url : null;
  } catch {
    return null;
  }
}

function googleDestination(url) {
  const parameter = url.searchParams.get("destination") ||
    url.searchParams.get("query") ||
    url.searchParams.get("q");

  if (parameter) return parameter;

  const coordinates = url.href.match(/!3d(-?[\d.]+)!4d(-?[\d.]+)/);
  if (coordinates) return coordinates[1] + "," + coordinates[2];

  const place = url.pathname.match(/\/place\/([^/]+)/);

  if (place) {
    try {
      return decodeURIComponent(place[1].replace(/\+/g, " "));
    } catch {
      return "";
    }
  }

  return "";
}

function mapUrl(schedule, type) {
  const custom = safeMapUrl(
    type === "naver"
      ? schedule.customNaverUrl
      : schedule.customGoogleUrl,
    type
  );

  const queryText = mapQuery(schedule);

  if (type === "naver") {
    return custom?.href ||
      "https://map.naver.com/p/search/" + encodeURIComponent(queryText);
  }

  const destination =
    (custom && googleDestination(custom)) || queryText;

  const placeId = custom && (
    custom.searchParams.get("destination_place_id") ||
    custom.searchParams.get("query_place_id")
  );

  const korea = destinationType(state.project?.name) === "korea";

  if (korea) {
    if (custom && !custom.pathname.includes("/dir/")) {
      return custom.href;
    }

    return "https://www.google.com/maps/search/?" +
      new URLSearchParams({
        api: "1",
        query: destination,
        ...(placeId ? { query_place_id: placeId } : {})
      });
  }

  return "https://www.google.com/maps/dir/?" +
    new URLSearchParams({
      api: "1",
      destination,
      dir_action: "navigate",
      travelmode: "driving",
      ...(placeId ? { destination_place_id: placeId } : {})
    });
}

/* ---------- 文字導入與預覽 ---------- */
function parseItinerary(text) {
  let day = "Day 1";
  let current = null;

  const items = [];
  const warnings = [];

  for (const raw of text.split("\n").map(line => line.trim()).filter(Boolean)) {
    const dayMatch = raw.match(
      /^(?:Day\s*(\d+)|第([一二三四五六七八九十\d]+)天)\s*(?:[：:、.\-].*)?$/i
    );

    const dateMatch = raw.match(/^(\d{4}-\d{2}-\d{2})$/);

    if (dayMatch || dateMatch) {
      if (current) items.push(current);
      current = null;

      if (dateMatch) {
        day = dateMatch[1];
      } else {
        const number = dayMatch[1] ||
          (
            /^\d+$/.test(dayMatch[2])
              ? dayMatch[2]
              : "一二三四五六七八九十".indexOf(dayMatch[2]) + 1
          );

        day = "Day " + number;
      }

      continue;
    }

    const normalized = raw.replace(/：/g, ":");
    const timeMatch = normalized.match(
      /^[•\-\s]*(\d{1,2}):(\d{2})\s*(.*)$/
    );

    if (
      timeMatch &&
      Number(timeMatch[1]) < 24 &&
      Number(timeMatch[2]) < 60
    ) {
      if (current) items.push(current);

      current = {
        day,
        time: timeMatch[1].padStart(2, "0") + ":" + timeMatch[2],
        title: timeMatch[3].trim(),
        location: ""
      };
    } else if (current) {
      current.location += (current.location ? "\n" : "") + raw;
    } else {
      warnings.push(raw);
    }
  }

  if (current) items.push(current);

  return { items, warnings };
}

  spot: ["探險家", "var(--aq)"],

};

function category(title = "") {
  if (/交通|機場|租車|還車|출발|空港/.test(title)) return null;

  if (
    /餐廳|美食|咖啡|晚餐|午餐|早餐|烤肉|料理|吃|맛집|식당|카페|ร้านอาหาร/.test(title)
  ) return "food";

  if (
    /購物|免稅|超市|商場|買|마트|쇼핑|ช้อปปิ้ง/.test(title)
  ) return "shop";

  return "spot";
}

function compressImage(file) {
  return new Promise(resolve => {
    const reader = new FileReader();

    reader.onload = event => {
      const image = new Image();

      image.onload = () => {
        const canvas = document.createElement("canvas");
        const maximum = 500;

        let width = image.width;
        let height = image.height;

        if (width > height && width > maximum) {
          height *= maximum / width;
          width = maximum;
        } else if (height > maximum) {
          width *= maximum / height;
          height = maximum;
        }

        canvas.width = width;
        canvas.height = height;

        canvas.getContext("2d").drawImage(
          image, 0, 0, width, height
        );

        resolve(canvas.toDataURL("image/jpeg", .6));
      };

      image.onerror = () => resolve("");
      image.src = event.target.result;
    };

    reader.onerror = () => resolve("");
    reader.readAsDataURL(file);
  });
}

  state.expenses.forEach(expense => {

    ? state.expenses.slice().reverse().map(expense => `

$("add-expense").onclick = () => {
  const names = accountingNames();

  if (!names.length) {
    alert("請先加入旅伴。");
    return;
  }

  const defaultCurrency = {
    korea: "KRW",
    japan: "JPY",
    thailand: "THB",
    singapore: "SGD",
    malaysia: "MYR",
    hongkong: "HKD",
    macau: "MOP"
  }[destinationType(state.project.name)] || "TWD";

  let mode = "equal";
  const projectId = state.project.id;

  const mask = modal("💸 記一筆", `
    <label>項目</label>
    <input id="expense-title">
    <label>金額</label>
    <input id="expense-amount" type="number" min="0" step="any"
      inputmode="decimal">
    <label>幣別</label>
    <select id="expense-currency">
      ${Object.keys(RATE).map(currency => `
        <option ${currency === defaultCurrency ? "selected" : ""}>
          ${currency}
        </option>
      `).join("")}
    </select>
    <label>誰先付</label>
    <select id="expense-payer">
      ${names.map(name => `
        <option value="${esc(name)}"
          ${name === myName() ? "selected" : ""}>
          ${esc(name)}
        </option>
      `).join("")}
    </select>
    <div class="row">
      <label>分攤模式</label>
      <span>
        <button id="mode-equal" class="btn aq">均攤</button>
        <button id="mode-custom" class="btn">自訂金額</button>
      </span>
    </div>
    <div id="expense-split"></div>
    <label>結算幣別</label>
    <select id="expense-settlement">
      <option value="orig">依原幣別</option>
      <option value="twd">折合台幣（TWD）</option>
    </select>
  `, async () => {
    const title = val(mask, "#expense-title");
    const amount = Number(val(mask, "#expense-amount"));

    if (!title || !Number.isFinite(amount) || amount <= 0) {
      alert("請填寫項目與正確金額。");
      return false;
    }

    const split = {};

    if (mode === "equal") {
      const selected = [
        ...q(mask, "#expense-split").querySelectorAll("input:checked")
      ].map(input => input.value);

      if (!selected.length) {
        alert("請至少選擇一位分攤者。");
        return false;
      }

      selected.forEach(name => {
        split[name] = amount / selected.length;
      });
    } else {
      let sum = 0;
      let invalid = false;

      q(mask, "#expense-split").querySelectorAll("[data-index]")
        .forEach(input => {
          const value = Number(input.value || 0);

          if (!Number.isFinite(value) || value < 0) {
            invalid = true;
            return;
          }

          if (value > 0) split[names[Number(input.dataset.index)]] = value;
          sum += value;
        });

      if (invalid || Math.abs(sum - amount) > .01) {
        alert("自訂金額總和必須等於總金額，且不能為負數。");
        return false;
      }
    }

    await addDoc(collection(db, "projects", projectId, "expenses"), {
      title,
      amount,
      cur: val(mask, "#expense-currency"),
      payer: val(mask, "#expense-payer"),
      split,
      settle: val(mask, "#expense-settlement"),
      createdAt: Date.now()
    });
  });

  function drawSplit() {
    q(mask, "#expense-split").innerHTML = mode === "equal"
      ? names.map(name => `
          <label class="chk">
            <input type="checkbox" value="${esc(name)}" checked>
            ${esc(name)}
          </label>
        `).join("")
      : names.map((name, index) => `
          <div class="row">
            <span style="flex:1">${esc(name)}</span>
            <input type="number" min="0" step="any" data-index="${index}"
              inputmode="decimal" placeholder="金額"
              style="width:120px;margin:0">
          </div>
        `).join("");

    q(mask, "#mode-equal").classList.toggle("aq", mode === "equal");
    q(mask, "#mode-custom").classList.toggle("aq", mode === "custom");
  }

  q(mask, "#mode-equal").onclick = () => {
    mode = "equal";
    drawSplit();
  };

  q(mask, "#mode-custom").onclick = () => {
    mode = "custom";
    drawSplit();
  };

  drawSplit();
};

function calculateTransfers(balance) {
  const creditors = [];
  const debtors = [];

  for (const [name, amount] of Object.entries(balance)) {
    if (amount > .01) creditors.push([name, amount]);
    if (amount < -.01) debtors.push([name, -amount]);
  }

  const transfers = [];

  while (creditors.length && debtors.length) {
    creditors.sort((a, b) => b[1] - a[1]);
    debtors.sort((a, b) => b[1] - a[1]);

    const amount = Math.min(creditors[0][1], debtors[0][1]);

    transfers.push({
      from: debtors[0][0],
      to: creditors[0][0],
      amount
    });

    creditors[0][1] -= amount;
    debtors[0][1] -= amount;

    if (creditors[0][1] < .01) creditors.shift();
    if (debtors[0][1] < .01) debtors.shift();
  }

  return transfers;
}

$("settle").onclick = () => {
  const groups = {};

  state.expenses.forEach(expense => {
    const currency = expense.cur || "TWD";

    const settlementCurrency =
      expense.settle === "orig" ? currency : "TWD";

    if (!groups[settlementCurrency]) groups[settlementCurrency] = {};

    const balance = groups[settlementCurrency];

    const total = settlementCurrency === currency
      ? expense.amount
      : expense.amount * (RATE[currency] || 1);

    balance[expense.payer] = (balance[expense.payer] || 0) + total;

    const shares = expense.split && Object.keys(expense.split).length
      ? expense.split
      : { [expense.payer]: expense.amount };

    const shareTotal = Object.values(shares)
      .reduce((sum, value) => sum + Number(value), 0);

    for (const [name, value] of Object.entries(shares)) {
      const share = shareTotal ? total * Number(value) / shareTotal : 0;
      balance[name] = (balance[name] || 0) - share;
    }
  });

  let html = "";

  for (const [currency, balance] of Object.entries(groups)) {
    const transfers = calculateTransfers(balance);

    if (!transfers.length) continue;

    html += `
      <h3>${esc(currency)} 結算</h3>
      ${transfers.map(transfer => `
        <div class="box" style="background:var(--aq)">
          ${esc(transfer.from)} ➜ ${esc(transfer.to)}
          <b>${esc(currency)} ${transfer.amount.toLocaleString(
            undefined,
            { maximumFractionDigits: 2 }
          )}</b>
        </div>
      `).join("")}
    `;
  }

  modal(
    "📊 結算明細",
    html || '<p class="mute">目前不需要轉帳 🎉</p>'
  );
};

function currentLanguage() {
  return LANGUAGES[destinationType(state.project?.name)] ||
    LANGUAGES.general;
}

function renderLanguage() {
  state.phrase = null;
  $("phrase-chinese").textContent = "請選擇下方情境與句子";
  $("phrase-foreign").textContent = "想說什麼呢？";

  const language = currentLanguage();

  function show(categoryName) {
    $("language-categories").querySelectorAll("button")
      .forEach(button => {
        button.classList.toggle(
          "on",
          button.dataset.category === categoryName
        );
      });

    const phrases = language.phrases[categoryName] || [];

    $("language-phrases").innerHTML = phrases.map((phrase, index) => `
      <button class="box item" data-phrase="${index}"
        style="width:100%;font:inherit;color:inherit;text-align:left;margin:0 0 10px">
        <b>${esc(phrase[0])}</b>
        <small style="color:var(--co)">${esc(phrase[1])}</small>
      </button>
    `).join("");

    $("language-phrases").querySelectorAll("[data-phrase]")
      .forEach(button => {
        button.onclick = () => {
          const phrase = phrases[Number(button.dataset.phrase)];
          state.phrase = phrase;

          $("phrase-chinese").textContent = phrase[0];
          $("phrase-foreign").textContent = phrase[1];
        };
      });
  }

  $("language-categories").innerHTML =
    LANGUAGE_CATEGORIES.map(([key, label]) => `
      <button class="btn" data-category="${key}">${label}</button>
    `).join("");

  $("language-categories").querySelectorAll("button")
    .forEach(button => {
      button.onclick = () => show(button.dataset.category);
    });

  show("airport");
}

$("speak").onclick = () => {
  if (!state.phrase) return;

  if (!("speechSynthesis" in window)) {
    notify("這個瀏覽器不支援朗讀。");
    return;
  }

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(state.phrase[1]);
  utterance.lang = currentLanguage().code;

  speechSynthesis.speak(utterance);
};

/* ---------- 啟動 ---------- */
$("refresh").onclick = () => location.reload();
$("home-art").innerHTML = scene();
$("auth-art").innerHTML = scene();

$("auth-submit").disabled = false;
$("auth-switch").disabled = false;
$("boot-status").textContent = "";

window.travelModuleReady = true;

onAuthStateChanged(
  auth,
  handleAuth,
  error => notify(errorMessage(error))
);
