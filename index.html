];

function travelMapRegion(project) {
  const destination =
    reminderDestination(project.name);

  if (!destination) return null;

  const {
    latitude: lat,
    longitude: lng
  } = destination;

  if (/濟州|jeju/i.test(project.name)) {
    return {
      name: "濟州島",
      center: [33.38, 126.55],
      bounds: [
        [33.05, 126.08],
        [33.65, 127.02]
      ]
    };
  }

  if (/北海道|hokkaido/i.test(project.name)) {
    return {
      name: "北海道",
      center: [43.4, 142.6],
      bounds: [
        [41.3, 139.3],
        [45.7, 146.0]
      ]
    };
  }

  const dy = 80 / 111;
  const dx =
    80 / (111 * Math.cos(lat * Math.PI / 180));

  return {
    name: destination.name + "及周邊",
    center: [lat, lng],
    bounds: [
      [lat - dy, lng - dx],
      [lat + dy, lng + dx]
    ]
  };
}

function travelMapContains(region, point) {
  const [
    [south, west],
    [north, east]
  ] = region.bounds;

  return (
    point.lat >= south &&
    point.lat <= north &&
    point.lng >= west &&
    point.lng <= east
  );
}

function travelMapAssetsReady() {
  if (travelMapAssets) return travelMapAssets;

  travelMapAssets = Promise.all([
    new Promise((resolve, reject) => {
      if (window.L) return resolve();

      const script = document.createElement("script");

      script.src =
        "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";

      const timer = setTimeout(() => {
        script.remove();

        reject(new Error(
          "地圖元件載入逾時，請稍後再試。"
        ));
      }, 15000);

      script.onload = () => {
        clearTimeout(timer);
        resolve();
      };

      script.onerror = () => {
        clearTimeout(timer);
        script.remove();

        reject(new Error(
          "無法載入地圖元件，請檢查網路。"
        ));
      };

      document.head.append(script);
    }),

    new Promise((resolve, reject) => {
      if (
        document.getElementById(
          "travel-map-leaflet-css"
        )
      ) return resolve();

      const link = document.createElement("link");

      link.id = "travel-map-leaflet-css";
      link.rel = "stylesheet";
      link.href =
        "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";

      const timer = setTimeout(() => {
        link.remove();

        reject(new Error(
          "地圖樣式載入逾時。"
        ));
      }, 15000);

      link.onload = () => {
        clearTimeout(timer);
        resolve();
      };

      link.onerror = () => {
        clearTimeout(timer);
        link.remove();

        reject(new Error(
          "無法載入地圖樣式。"
        ));
      };

      document.head.append(link);
    })
  ]).catch(error => {
    travelMapAssets = null;
    throw error;
  });

  return travelMapAssets;
}

const TRAVEL_MAP_ERRORS = {
  NO_SAVED_GOOGLE_URL:
    "尚未儲存 Google Maps 網址",
  NO_EXACT_COORDINATES:
    "網址未提供可確認的地點座標",

  INVALID_MAP_URL:

  PROJECT_ACCESS_DENIED:

  DOCUMENT_NOT_FOUND:
    "行程不存在或已被移除",
  SIGN_IN_REQUIRED:
    "請重新登入",
  RESOLVE_TIMEOUT:
    "解析逾時，可重新查詢",
  RESPONSE_TOO_LARGE:
    "地圖頁面過大，暫時無法解析",
  SERVER_NOT_CONFIGURED:
    "解析服務尚未設定完成"
};

/* 向後端取得位置 */

async function travelMapResolve(context, item) {
  const original =
    String(item.customGoogleUrl || "").trim();

  if (!original) {
    throw new Error(
      TRAVEL_MAP_ERRORS.NO_SAVED_GOOGLE_URL
    );
  }

  const key = JSON.stringify([
    context.user.uid,
    context.project.id,
    item.id,
    original
  ]);

  const cached = travelMapCache.get(key);

  if (cached && cached.until > Date.now()) {
    return cached.point;
  }

  let api;

  try {
    api = new URL(TRAVEL_MAP_API);
  } catch {
    throw new Error(
      "尚未填入地圖解析服務網址。"
    );
  }

  if (api.protocol !== "https:") {
    throw new Error(
      "解析服務必須使用 HTTPS。"
    );
  }

  const token = await context.user.getIdToken();

  if (context.closed) {
    throw new DOMException(
      "Aborted",
      "AbortError"
    );
  }

  const controller = new AbortController();

  context.requests.add(controller);

  const abort = () => controller.abort();

  context.controller.signal.addEventListener(
    "abort",
    abort,
    { once: true }
  );

  const timer = setTimeout(abort, 22000);

  try {
    const response = await fetch(api.href, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + token
      },
      body: JSON.stringify({
        projectId: context.project.id,
        scheduleId: item.id
      }),
      signal: controller.signal,
      credentials: "omit",
      referrerPolicy: "no-referrer"
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
        TRAVEL_MAP_ERRORS[result.error] ||
        "暫時無法解析此地點，請稍後重試。"
      );
    }

    if (
      result.scheduleId !== item.id ||
      !Number.isFinite(result.lat) ||
      !Number.isFinite(result.lng) ||
      Math.abs(result.lat) > 90 ||
      Math.abs(result.lng) > 180
    ) {
      throw new Error(
        "解析服務未回傳有效座標。"
      );
    }

    const coordinates = {
      lat: result.lat,
      lng: result.lng
    };

    travelMapCache.set(key, {
      point: coordinates,
      until: Date.now() + 86400000
    });

    return coordinates;
  } catch (error) {
    if (
      error.name === "AbortError" &&
      !context.closed
    ) {
      throw new Error(
        "解析逾時，可重新查詢。"
      );
    }

    throw error;
  } finally {
    clearTimeout(timer);

    context.requests.delete(controller);

    context.controller.signal.removeEventListener(
      "abort",
      abort
    );
  }
}

/* 更新圖釘與定位狀態 */

function travelMapDraw(context) {
  if (context.closed || !context.map) return;

  context.layer.clearLayers();

  const items = travelMapSelected(context);
  const groups = new Map();

  let shown = 0;
  let outside = 0;
  let failed = 0;

  for (const item of items) {
    const result = context.results.get(item.id);

    if (!result) continue;

    if (result.error) {
      failed++;
      continue;
    }

    if (!travelMapContains(context.region, result)) {
      outside++;
      continue;
    }

    shown++;

    const key =
      `${result.lat.toFixed(6)},` +
      `${result.lng.toFixed(6)}`;

    if (!groups.has(key)) {
      groups.set(key, {
        point: result,
        items: []
      });
    }

    groups.get(key).items.push(item);
  }

  for (
    const {
      point: coordinates,
      items: group
    } of groups.values()
  ) {
    const colors = [
      ...new Set(
        group.map(item =>
          context.color(item.day || "Day 1")
        )
      )
    ];

    const background = colors.length > 1
      ? "conic-gradient(" +
        colors.map((color, index) =>
          `${color} ` +
          `${index * 100 / colors.length}% ` +
          `${(index + 1) * 100 / colors.length}%`
        ).join(",") +
        ")"
      : colors[0];

    const label = group.length > 1
      ? "+"
      : String(
          context.items.filter(item =>
            (item.day || "Day 1") ===
            (group[0].day || "Day 1")
          ).findIndex(item =>
            item.id === group[0].id
          ) + 1
        );

    const icon = L.divIcon({
      className: "travel-map-icon",

      html: `
        <div
          class="travel-map-pin"
          style="background:${background}"
        >
          <b>${label}</b>
        </div>
      `,

      iconSize: [30, 38],
      iconAnchor: [15, 36],
      popupAnchor: [0, -34]
    });

    L.marker(
      [coordinates.lat, coordinates.lng],
      {
        icon,
        title: group.map(item =>
          cleanTitle(item.title)
        ).join("／")
      }
    )
      .bindPopup(
        travelMapPopup(context, group),
        { maxWidth: 270 }
      )
      .addTo(context.layer);
  }

  const pending =
    items.length - shown - outside - failed;

  q(
    context.mask,
    "[data-map-status]"
  ).textContent =
    `已標示 ${shown} 筆` +
    ` · 目的地範圍外 ${outside} 筆` +
    ` · 待解析 ${pending} 筆` +
    ` · 暫未定位 ${failed} 筆`;

  const failures = items.filter(item =>
    context.results.get(item.id)?.error
  );

  q(
    context.mask,
    "[data-map-failures]"
  ).innerHTML = failures.length
    ? `
      <details class="travel-map-pending">
        <summary>
          查看未能定位的行程（${failures.length}）
        </summary>

        ${failures.map(item => `
          <p>
            <b>${esc(cleanTitle(item.title))}</b>
            <br>

            ${
              esc(
                context.results.get(item.id).error
              )
            }

            <br>

            <a
              href="${
                esc(
                  safeMapUrl(
                    item.customGoogleUrl,
                    "google"
                  )?.href ||
                  mapUrl(item, "google")
                )
              }"
              target="_blank"
              rel="noopener noreferrer"
            >
              開啟原地圖 ↗
            </a>
          </p>
        `).join("")}
      </details>
    `
    : "";
}

/* 分批解析，避免同時發出大量查詢 */

async function travelMapLoad(context) {
  if (context.loading || context.closed) return;

  context.loading = true;

  const retry = q(
    context.mask,
    "[data-map-retry]"
  );

  retry.disabled = true;

  const batchDay = context.day;

  const queue = travelMapSelected(context)
    .filter(item =>
      !context.results.has(item.id)
    );

  let index = 0;

  const work = async () => {
    while (
      index < queue.length &&
      !context.closed &&
      context.day === batchDay
    ) {
      const item = queue[index++];

      try {
        const coordinates =
          await travelMapResolve(context, item);

        if (!context.closed) {
          context.results.set(
            item.id,
            coordinates
          );
        }
      } catch (error) {
        if (
          !context.closed &&
          context.day === batchDay
        ) {
          context.results.set(item.id, {
            error: error.message
          });
        }
      }

      travelMapDraw(context);
    }
  };

  await Promise.all([
    work(),
    work()
  ]);

  context.loading = false;

  if (context.closed) return;

  retry.disabled = false;

  if (!context.touched) {
    const points = travelMapSelected(context)
      .map(item =>
        context.results.get(item.id)
      )
      .filter(value =>
        value &&
        !value.error &&
        travelMapContains(context.region, value)
      );

    if (points.length) {
      context.map.fitBounds(
        points.map(value => [
          value.lat,
          value.lng
        ]),
        {
          paddingTopLeft: [40, 45],
          paddingBottomRight: [65, 95],
          maxZoom: 12
        }
      );
    }
  }

  if (
    travelMapSelected(context).some(item =>
      !context.results.has(item.id)
    )
  ) {
    travelMapLoad(context);
  }
}

/* 開啟地圖 */

async function openTravelMap() {
  if (!state.project || !state.user) return;

  travelMapCurrent?.mask.remove();

  const project = { ...state.project };
  const region = travelMapRegion(project);

  const items = state.schedules
    .map(item => ({ ...item }))
    .sort(scheduleOrder);

  const mask = modal(
    "🗺️ " + esc(region?.name || project.name),
    `
      <p class="hint">
        依原本的地圖網址定位；不同天不同顏色。
        同地點多筆行程會合併圖釘，
        點開可查看全部。
      </p>

      <div class="pills" data-map-days></div>

      <div
        class="travel-map-legend"
        data-map-legend
      ></div>

      <div
        class="travel-map-canvas"
        data-map-canvas
        role="region"
        aria-label="行程地圖"
      ></div>

      <p
        class="travel-map-status"
        data-map-status
      >
        地圖載入中…
      </p>

      <button
        class="btn aq"
        data-map-retry
      >
        重試未定位的行程
      </button>

      <div data-map-failures></div>
    `
  );

  q(mask, ".sheet").classList.add(
    "travel-map-sheet"
  );

  const days = [
    ...new Set(
      items.map(item =>
        item.day || "Day 1"
      )
    )
  ].sort((a, b) =>
    dayOrder(a) - dayOrder(b)
  );

  const context = {
    mask,
    project,
    region,
    items,
    user: state.user,

    day:
      state.day === "all" ||
      days.includes(state.day)
        ? state.day
        : "all",

    results: new Map(),
    controller: new AbortController(),
    requests: new Set(),

    map: null,
    layer: null,
    loading: false,
    closed: false,
    touched: false,

    color: day =>
      TRAVEL_MAP_COLORS[
        Math.max(0, days.indexOf(day)) %
        TRAVEL_MAP_COLORS.length
      ]
  };

  travelMapCurrent = context;

  const observer = new MutationObserver(() => {
    if (mask.isConnected) return;

    context.closed = true;
    context.controller.abort();

    for (const request of context.requests) {
      request.abort();
    }

    context.map?.remove();
    observer.disconnect();

    if (travelMapCurrent === context) {
      travelMapCurrent = null;
    }
  });

  observer.observe(document.body, {
    childList: true
  });

  const renderDays = () => {
    q(mask, "[data-map-days]").innerHTML =
      ["all", ...days].map(day => `
        <button
          class="pill ${
            context.day === day ? "on" : ""
          }"
          data-map-day="${esc(day)}"
        >
          ${day === "all" ? "全部" : esc(day)}
        </button>
      `).join("");

    q(mask, "[data-map-legend]").innerHTML =
      days.map(day => `
        <span>
          <i
            class="travel-map-dot"
            style="background:${context.color(day)}"
          ></i>
          ${esc(day)}
        </span>
      `).join("");

    mask.querySelectorAll("[data-map-day]")
      .forEach(button => {
        button.onclick = () => {
          context.day = button.dataset.mapDay;

          for (const request of context.requests) {
            request.abort();
          }

          context.touched = false;

          renderDays();
          travelMapDraw(context);
          travelMapLoad(context);
        };
      });
  };

  renderDays();

  q(mask, "[data-map-retry]").onclick = () => {
    for (
      const [id, result] of context.results
    ) {
      if (result.error) {
        context.results.delete(id);
      }
    }

    travelMapLoad(context);
  };

  try {
    if (!region) {
      throw new Error(
        "目前無法從專案名稱辨識地圖範圍。" +
        "請在專案名稱保留城市名，" +
        "例如濟州島、首爾或東京。"
      );
    }

    await travelMapAssetsReady();

    if (context.closed) return;

    context.map = L.map(
      q(mask, "[data-map-canvas]"),
      {
        scrollWheelZoom: false,
        zoomControl: false
      }
    );

    L.control.zoom({
      position: "bottomright"
    }).addTo(context.map);

    context.map.fitBounds(
      region.bounds,
      { padding: [8, 8] }
    );

    context.layer =
      L.layerGroup().addTo(context.map);

    const tiles = L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; <a ' +
          'href="https://www.openstreetmap.org/copyright" ' +
          'target="_blank" rel="noopener noreferrer">' +
          "OpenStreetMap</a> contributors"
      }
    ).addTo(context.map);

    tiles.on("tileerror", () => {
      if (!context.closed) {
        q(mask, ".modal-error").textContent =
          "部分底圖未載入，請檢查網路後重新開啟地圖。";
      }
    });

    context.map.on("dragstart", () => {
      context.touched = true;
    });

    context.map.invalidateSize();

    travelMapDraw(context);
    await travelMapLoad(context);
  } catch (error) {
    if (!context.closed) {
      q(
        mask,
        "[data-map-status]"
      ).textContent = error.message;

      q(
        mask,
        "[data-map-retry]"
      ).disabled = true;
    }
  }
}

/* 同一專案保留一致的插畫樣式 */

function itinerarySketchRandom(text) {
  let seed = 2166136261;

  for (const character of text) {
    seed ^= character.codePointAt(0);
    seed = Math.imul(seed, 16777619);
  }

  return () => {
    seed += 0x6D2B79F5;

    let number = seed;

    number = Math.imul(
      number ^ (number >>> 15),
      number | 1
    );

    number ^= number + Math.imul(
      number ^ (number >>> 7),
      number | 61
    );

    return (
      (number ^ (number >>> 14)) >>> 0
    ) / 4294967296;
  };
}

/* 自動產生島嶼／城市示意底圖 */

function itinerarySketchArt(
  context,
  width,
  height,
  positions
) {
  const project = state.project;

  const random =
    itinerarySketchRandom(project.name);

  const island =
    /島|濟州|沖繩|北海道|台灣|臺灣|夏威夷|jeju|okinawa|island|bali|iceland|hawaii/i
      .test(project.name);

  const cy = (height + 100) / 2;
  const rx = 440;
  const ry = Math.max(190, (height - 220) / 2);
  const points = [];

  for (let index = 0; index < 32; index++) {
    const angle = index / 32 * Math.PI * 2;
    const rough = .94 + random() * .10;

    points.push([
      500 + Math.cos(angle) * rx * rough,
      cy + Math.sin(angle) * ry * rough
    ]);
  }

  const first = [
    (points[31][0] + points[0][0]) / 2,
    (points[31][1] + points[0][1]) / 2
  ];

  let shore = `M${first[0]} ${first[1]}`;

  for (let index = 0; index < points.length; index++) {
    const current = points[index];
    const next = points[(index + 1) % points.length];

    shore +=
      `Q${current[0]} ${current[1]} ` +
      `${(current[0] + next[0]) / 2} ` +
      `${(current[1] + next[1]) / 2}`;
  }

  shore += "Z";

  const waves = Array.from(
    {
      length: Math.max(
        5,
        Math.floor(height / 120)
      )
    },
    (_, index) => {
      const x = index % 2 ? 910 : 20;
      const y = 180 + index * 105;

      return `
        <path
          d="M${x} ${y}q12 12 25 0q12 12 25 0"
          fill="none"
          stroke="#7faeb4"
          stroke-width="5"
          opacity=".5"
          stroke-linecap="round"
        />
      `;
    }
  ).join("");

  let routes = "";

  for (const day of context.days) {
    const stops = positions.filter(position =>
      (position.item.day || "Day 1") === day
    );

    if (stops.length < 2) continue;

    let path = `M${stops[0].x} ${stops[0].y}`;

    for (let index = 1; index < stops.length; index++) {
      const previous = stops[index - 1];
      const current = stops[index];
      const middle = (previous.y + current.y) / 2;

      path +=
        `C${previous.x} ${middle},` +
        `${current.x} ${middle},` +
        `${current.x} ${current.y}`;
    }

    routes += `

/* 點選行程資訊 */

function itinerarySketchDetail(context, id) {

  const panel = q(

  const google =
    safeMapUrl(item.customGoogleUrl, "google")?.href ||
    mapUrl(item, "google");

  const naver =
    destinationType(state.project.name) === "korea"
      ? mapUrl(item, "naver")

  panel.innerHTML = `

/* 依目前行程重新排版 */

function itinerarySketchDraw(context) {
  if (!context.mask.isConnected) return;

  if (
    state.project?.id !== context.projectId ||
    uid() !== context.userId
  ) {
    context.mask.remove();
    return;
  }

  const all = state.schedules
    .map(item => ({ ...item }))
    .sort(scheduleOrder);

  context.days = [
    ...new Set(
      all.map(item => item.day || "Day 1")
    )
  ].sort((a, b) =>
    dayOrder(a) - dayOrder(b)
  );

  if (
    context.day !== "all" &&
    !context.days.includes(context.day)
  ) {
    context.day = "all";
  }

  context.color = day =>
    ITINERARY_SKETCH_COLORS[
      Math.max(
        0,
        context.days.indexOf(day)
      ) % ITINERARY_SKETCH_COLORS.length
    ];

  const selected = all.filter(item =>
    context.day === "all" ||
    (item.day || "Day 1") === context.day
  );

  const outside = selected.filter(item =>
    itinerarySketchOutside(state.project, item)
  );

  const items = selected.filter(item =>
    !itinerarySketchOutside(state.project, item)
  );

  const viewport = q(
    context.mask,
    "[data-sketch-viewport]"
  );

  const displayWidth =
    viewport.clientWidth || 320;

  const columns =
    displayWidth < 500 ? 2 :
    displayWidth < 760 ? 3 : 4;

  const rows = Math.ceil(
    items.length / columns
  );

  const step = columns === 2 ? 240 : 150;

  const height = Math.max(
    columns === 2 ? 900 : 650,
    270 + rows * step
  );

  const random =
    itinerarySketchRandom(state.project.name);

  const positions = items.map((item, index) => {
    const row = Math.floor(index / columns);

    const column = row % 2
      ? columns - 1 - index % columns
      : index % columns;

    const span = columns === 2 ? 500 : 680;

    return {
      item,
      x:
        500 - span / 2 +
        column * (
          span / Math.max(1, columns - 1)
        ) +
        (random() - .5) * 14,
      y:
        230 +
        row * step +
        (random() - .5) * 16
    };
  });

  q(
    context.mask,
    "[data-sketch-title]"
  ).textContent = "🗺️ " + state.project.name;

  q(
    context.mask,
    "[data-sketch-days]"
  ).innerHTML = [
    "all",
    ...context.days
  ].map(day => `
    <button
      class="sketch-day"
      data-sketch-day="${esc(day)}"
      aria-pressed="${day === context.day}"
      style="${
        day === context.day
          ? "background:" +
            (
              day === "all"
                ? "#f2d488"
                : context.color(day)
            ) +
            ";color:" +
            (
              day === "all"
                ? "#59462e"
                : "#fff"
            )
          : ""
      }"
    >
      ${day === "all" ? "全部" : esc(day)}
    </button>
  `).join("");

  q(
    context.mask,
    "[data-sketch-legend]"
  ).innerHTML = context.days.map(day => `
    <span>
      <i style="background:${context.color(day)}"></i>
      ${esc(day)}
    </span>
  `).join("");

  const stage = q(
    context.mask,
    "[data-sketch-stage]"
  );

  stage.style.setProperty(
    "--sketch-label-width",
    Math.max(
      100,
      Math.min(
        170,
        displayWidth / columns - 22
      )
    ) + "px"
  );

  stage.innerHTML =
    itinerarySketchArt(
      context,
      1000,
      height,
      positions
    ) +
    positions.map(({ item, x, y }) => {
      const day = item.day || "Day 1";

      const index = all.filter(other =>
        (other.day || "Day 1") === day
      ).findIndex(other =>
        other.id === item.id
      ) + 1;

      return `
        <button
          class="sketch-pin"
          data-sketch-pin="${esc(item.id)}"
          style="
            left:${x / 10}%;
            top:${y / height * 100}%;
            --sketch-color:${context.color(day)};
          "
          aria-expanded="${context.selected === item.id}"
          aria-label="${
            esc(
              day + " " +
              (item.time || "") + " " +
              cleanTitle(item.title)
            )
          }"
        >
          <span class="sketch-pin-picture">
            <svg
              viewBox="0 0 80 70"
              aria-hidden="true"
            >
              <use
                href="#${context.prefix}-${
                  itinerarySketchIcon(item.title)
                }"
              />
            </svg>

            <span class="sketch-pin-number">
              ${index}
            </span>
          </span>

          <b>${esc(cleanTitle(item.title))}</b>

          <small>
            ${
              context.day === "all"
                ? esc(day) + " · "
                : ""
            }
            ${esc(item.time || "時間待安排")}
          </small>
        </button>
      `;
    }).join("");

  q(
    context.mask,
    "[data-sketch-caption]"
  ).textContent =
    `${items.length} 筆行程 · ` +
    "圖釘位置與虛線僅作行程示意，" +
    "不代表真實方位、距離或道路。";

  q(
    context.mask,
    "[data-sketch-outside]"
  ).innerHTML = outside.length
    ? `
      <details class="sketch-caption">
        <summary>
          出發地行程另列（${outside.length}）
        </summary>

        ${outside.map(item => `
          <p>${esc(cleanTitle(item.title))}</p>
        `).join("")}
      </details>
    `
    : "";

  if (!items.length) {
    q(
      context.mask,
      "[data-sketch-caption]"
    ).textContent =
      "目前沒有可顯示的目的地行程，" +
      "新增行程後會自動更新示意圖。";
  }

  context.mask.querySelectorAll(
    "[data-sketch-day]"
  ).forEach(button => {
    button.onclick = () => {
      context.day = button.dataset.sketchDay;
      context.selected = null;

      q(
        context.mask,
        "[data-sketch-detail]"
      ).hidden = true;

      context.zoom = 1;
      stage.style.width = "100%";

      q(
        context.mask,
        "[data-sketch-percent]"
      ).textContent = "100%";

      itinerarySketchDraw(context);
      viewport.scrollTo(0, 0);
    };
  });

  stage.querySelectorAll(
    "[data-sketch-pin]"
  ).forEach(button => {
    button.onclick = () =>
      itinerarySketchDetail(
        context,
        button.dataset.sketchPin
      );
  });

  if (context.selected) {
    if (
      items.some(item =>
        item.id === context.selected
      )
    ) {
      itinerarySketchDetail(
        context,
        context.selected
      );
    } else {
      context.selected = null;

      q(
        context.mask,
        "[data-sketch-detail]"
      ).hidden = true;
    }
  }
}

function openItinerarySketch() {
  if (!state.project || !state.user) return;

  itinerarySketchCurrent?.mask.remove();

  const mask = modal(
    "行程手繪圖",
    `
      <p class="sketch-intro">
        為這趟旅程自動排版的插畫示意圖。
        點選行程可開啟原本的導航網址。
      </p>

      <div class="sketch-toolbar">
        <div
          class="sketch-days"
          data-sketch-days
        ></div>

        <div class="sketch-zoom">
          <button
            data-sketch-minus
            aria-label="縮小示意圖"
          >−</button>

          <span data-sketch-percent>100%</span>

          <button
            data-sketch-plus
            aria-label="放大示意圖"
          >＋</button>

          <button data-sketch-reset>重設</button>
        </div>
      </div>

      <div
        class="sketch-legend"
        data-sketch-legend
      ></div>

      <div class="sketch-frame">
        <div
          class="sketch-viewport"
          data-sketch-viewport
          role="region"
          aria-label="可放大與滑動的行程示意圖"
        >
          <div
            class="sketch-stage"
            data-sketch-stage
          ></div>
        </div>

        <aside
          class="sketch-detail"
          data-sketch-detail
          aria-label="行程資訊"
          hidden
        ></aside>
      </div>

      <p
        class="sketch-caption"
        data-sketch-caption
      ></p>

      <div data-sketch-outside></div>
    `
  );

  q(mask, ".sheet").classList.add(
    "sketch-sheet"
  );

  q(mask, "h3").dataset.sketchTitle = "";

  const context = {
    mask,
    projectId: state.project.id,
    userId: uid(),
    day: state.day || "all",
    selected: null,
    zoom: 1,
    prefix:
      "itinerary-sketch-" +
      (++itinerarySketchSequence),
    days: [],
    color: () => ITINERARY_SKETCH_COLORS[0]
  };

  itinerarySketchCurrent = context;

  const viewport = q(
    mask,
    "[data-sketch-viewport]"
  );

  const stage = q(
    mask,
    "[data-sketch-stage]"
  );

  const zoomTo = value => {
    const oldWidth = stage.offsetWidth;

    const center = (
      viewport.scrollLeft +
      viewport.clientWidth / 2
    ) / Math.max(1, oldWidth);

    context.zoom = Math.max(
      1,
      Math.min(2.5, value)
    );

    stage.style.width =
      context.zoom * 100 + "%";

    q(
      mask,
      "[data-sketch-percent]"
    ).textContent =
      Math.round(context.zoom * 100) + "%";

    viewport.scrollLeft =
      center * stage.offsetWidth -
      viewport.clientWidth / 2;
  };

  q(mask, "[data-sketch-plus]").onclick = () =>
    zoomTo(context.zoom + .25);

  q(mask, "[data-sketch-minus]").onclick = () =>
    zoomTo(context.zoom - .25);

  q(mask, "[data-sketch-reset]").onclick = () => {
    zoomTo(1);
    viewport.scrollTo(0, 0);
  };

  let drag = null;

  viewport.onpointerdown = event => {
    if (
      event.pointerType !== "mouse" ||
      event.button !== 0 ||
      event.target.closest("button")
    ) return;

    drag = {
      x: event.clientX,
      y: event.clientY,
      left: viewport.scrollLeft,
      top: viewport.scrollTop
    };

    viewport.setPointerCapture(event.pointerId);
  };

  viewport.onpointermove = event => {
    if (!drag) return;

    viewport.scrollLeft =
      drag.left -
      (event.clientX - drag.x);

    viewport.scrollTop =
      drag.top -
      (event.clientY - drag.y);
  };

  viewport.onpointerup =
    viewport.onpointercancel =
      () => drag = null;

  const signature = () => JSON.stringify([
    state.project?.id,
    state.project?.name,
    uid(),
    state.schedules
  ]);

  let last = signature();

  itinerarySketchDraw(context);

  const timer = setInterval(() => {
    const next = signature();

    if (next !== last) {
      last = next;
      itinerarySketchDraw(context);
    }
  }, 1000);

  let width = viewport.clientWidth;

  const resize = new ResizeObserver(() => {
    if (viewport.clientWidth !== width) {
      width = viewport.clientWidth;
      itinerarySketchDraw(context);
    }
  });

  resize.observe(viewport);

  const observer = new MutationObserver(() => {
    if (mask.isConnected) return;

    clearInterval(timer);
    resize.disconnect();
    observer.disconnect();

    if (itinerarySketchCurrent === context) {
      itinerarySketchCurrent = null;
    }
  });

  observer.observe(document.body, {
    childList: true
  });
}

/* ---------- 正確地形與座標的粉彩地圖 ---------- */

let geographicLandPromise = null;
let geographicTopoPromise = null;
let geographicMapNumber = 0;

/* 保持目的地全景，避免單一圖釘讓地圖自動放大 */

const geographicOriginalLoad = travelMapLoad;

travelMapLoad = async function (context) {
  if (context.geoPrefix) {
    context.touched = true;
  }

  return geographicOriginalLoad(context);
};

/* 載入真實地形資料的轉換元件 */

function geographicLoadTopo() {
  if (window.topojson?.feature) {
    return Promise.resolve();
  }

  if (geographicTopoPromise) {
    return geographicTopoPromise;
  }

  geographicTopoPromise = new Promise(
    (resolve, reject) => {
      const script = document.createElement("script");

      script.src =
        "https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js";

      const timer = setTimeout(() => {
        script.remove();

        reject(new Error(
          "地形元件載入逾時。"
        ));
      }, 15000);

      script.onload = () => {
        clearTimeout(timer);
        resolve();
      };

      script.onerror = () => {
        clearTimeout(timer);
        script.remove();

        reject(new Error(
          "地形元件載入失敗。"
        ));
      };

      document.head.append(script);
    }
  ).catch(error => {
    geographicTopoPromise = null;
    throw error;
  });

  return geographicTopoPromise;
}

/* Natural Earth 真實海岸線 */

function geographicLand() {
  if (geographicLandPromise) {
    return geographicLandPromise;
  }

  geographicLandPromise = Promise.all([
    geographicLoadTopo(),

    (async () => {
      const controller = new AbortController();

      const timer = setTimeout(
        () => controller.abort(),
        25000
      );

      try {
        const response = await fetch(
          "https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-10m.json",
          {
            signal: controller.signal,
            credentials: "omit"
          }
        );

        if (!response.ok) {
          throw new Error(
            "真實海岸線資料載入失敗。"
          );
        }

        return await response.json();
      } finally {
        clearTimeout(timer);
      }
    })()
  ]).then(([, data]) => {
    const collection = topojson.feature(
      data,
      data.objects.land
    );

    const polygons = collection.features.flatMap(
      feature =>
        feature.geometry.type === "MultiPolygon"
          ? feature.geometry.coordinates
          : [feature.geometry.coordinates]
    );

    return polygons.map(coordinates => {
      let west = Infinity;
      let east = -Infinity;
      let south = Infinity;
      let north = -Infinity;

      for (const [lng, lat] of coordinates[0]) {
        west = Math.min(west, lng);
        east = Math.max(east, lng);
        south = Math.min(south, lat);
        north = Math.max(north, lat);
      }

      return {
        bbox: [west, south, east, north],
        coordinates
      };
    });
  }).catch(error => {
    geographicLandPromise = null;
    throw error;
  });

  return geographicLandPromise;
}

/* 沿用真實位置，只替換圖釘外觀 */

const geographicOriginalDraw = travelMapDraw;

travelMapDraw = function (context) {
  geographicOriginalDraw(context);

  if (
    !context.map ||
    !context.geoPrefix ||
    context.closed
  ) return;

  const groups = new Map();

  for (const item of travelMapSelected(context)) {
    const coordinates =
      context.results.get(item.id);

    if (
      !coordinates ||
      coordinates.error ||
      !travelMapContains(
        context.region,
        coordinates
      )
    ) continue;

    const key =
      `${coordinates.lat.toFixed(6)},` +
      `${coordinates.lng.toFixed(6)}`;

    if (!groups.has(key)) {
      groups.set(key, []);
    }

    groups.get(key).push(item);
  }

  context.layer.eachLayer(marker => {
    const coordinates = marker.getLatLng();

    const items = groups.get(
      `${coordinates.lat.toFixed(6)},` +
      `${coordinates.lng.toFixed(6)}`
    );

    if (!items?.length) return;

    const day = items[0].day || "Day 1";

    const colors = [
      ...new Set(
        items.map(item =>
          context.color(item.day || "Day 1")
        )
      )
    ];

    const color = colors.length > 1
      ? "conic-gradient(" +
        colors.map((value, index) =>
          `${value} ` +
          `${index * 100 / colors.length}% ` +
          `${(index + 1) * 100 / colors.length}%`
        ).join(",") +
        ")"
      : colors[0];

    const number = items.length > 1
      ? "+"
      : String(
          context.items.filter(item =>
            (item.day || "Day 1") === day
          ).findIndex(item =>
            item.id === items[0].id
          ) + 1
        );

    const picture =
      typeof itinerarySketchIcon === "function"
        ? `
          <svg
            viewBox="0 0 80 70"
            aria-hidden="true"
          >
            <use
              href="#${context.geoPrefix}-${
                itinerarySketchIcon(items[0].title)
              }"
            />
          </svg>
        `
        : `
          <span class="geographic-map-fallback"></span>
        `;

    marker.setIcon(
      L.divIcon({
        className: "geographic-map-marker",

        html: `
          <div
            class="geographic-map-art"
            style="--geo-color:${color}"
          >
            ${picture}

            <span class="geographic-map-badge">
              ${number}
            </span>

            <span class="geographic-map-anchor"></span>
          </div>
        `,

        iconSize: [48, 53],
        iconAnchor: [24, 48],
        popupAnchor: [0, -48]
      })
    );
  });
};

/* 開啟正確地理位置的地圖 */

openTravelMap = async function () {
  if (!state.project || !state.user) return;

  if (
    typeof itinerarySketchCurrent !== "undefined"
  ) {
    itinerarySketchCurrent?.mask.remove();
  }

  travelMapCurrent?.mask.remove();

  const project = { ...state.project };

  const region = travelMapRegion(project);

  const items = state.schedules
    .map(item => ({ ...item }))
    .sort(scheduleOrder);

  const mask = modal(
    "🗺️ " + esc(region?.name || project.name),
    `
      <p class="hint">
        真實地形的簡化底圖，圖釘按地點座標定位。
        點選圖釘查看行程與導航。
      </p>

      <div class="pills" data-map-days></div>

      <div
        class="travel-map-legend"
        data-map-legend
      ></div>

      <div
        class="travel-map-canvas geographic-pastel"
        data-map-canvas
        role="region"
        aria-label="真實位置的行程地圖"
      ></div>

      <p
        class="travel-map-status"
        data-map-status
      >
        載入真實地形…
      </p>

      <button class="btn aq" data-map-retry>
        重試未定位的行程
      </button>

      <button class="btn" data-geo-home>
        回到目的地
      </button>

      <div data-map-failures></div>
    `
  );

  q(mask, ".sheet").classList.add(
    "travel-map-sheet"
  );

  const days = [
    ...new Set(
      items.map(item =>
        item.day || "Day 1"
      )
    )
  ].sort((a, b) =>
    dayOrder(a) - dayOrder(b)
  );

  const context = {
    mask,
    project,
    region,
    items,
    user: state.user,

    day:
      state.day === "all" ||
      days.includes(state.day)
        ? state.day
        : "all",

    results: new Map(),
    controller: new AbortController(),
    requests: new Set(),

    map: null,
    layer: null,
    loading: false,
    closed: false,
    touched: false,

    geoPrefix:
      "geographic-art-" +
      (++geographicMapNumber),

    color: day =>
      TRAVEL_MAP_COLORS[
        Math.max(0, days.indexOf(day)) %
        TRAVEL_MAP_COLORS.length
      ]
  };

  travelMapCurrent = context;

  /* 沿用小插畫，但不沿用任意排版位置 */

  if (
    typeof itinerarySketchSymbols === "function"
  ) {
    const definitions = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "svg"
    );

    definitions.setAttribute("width", "0");
    definitions.setAttribute("height", "0");
    definitions.setAttribute("aria-hidden", "true");
    definitions.style.position = "absolute";

    definitions.innerHTML =
      itinerarySketchSymbols(context.geoPrefix);

    q(mask, ".sheet").append(definitions);
  }

  const observer = new MutationObserver(() => {
    if (mask.isConnected) return;

    context.closed = true;
    context.controller.abort();

    for (const request of context.requests) {
      request.abort();
    }

    context.map?.remove();
    observer.disconnect();

    if (travelMapCurrent === context) {
      travelMapCurrent = null;
    }
  });

  observer.observe(document.body, {
    childList: true
  });

  const renderDays = () => {
    q(mask, "[data-map-days]").innerHTML =
      ["all", ...days].map(day => `
        <button
          class="pill ${
            context.day === day ? "on" : ""
          }"
          data-map-day="${esc(day)}"
        >
          ${day === "all" ? "全部" : esc(day)}
        </button>
      `).join("");

    q(mask, "[data-map-legend]").innerHTML =
      days.map(day => `
        <span>
          <i
            class="travel-map-dot"
            style="background:${context.color(day)}"
          ></i>
          ${esc(day)}
        </span>
      `).join("");

    mask.querySelectorAll("[data-map-day]")
      .forEach(button => {
        button.onclick = () => {
          context.day = button.dataset.mapDay;

          for (const request of context.requests) {
            request.abort();
          }

          context.touched = false;

          renderDays();
          travelMapDraw(context);
          travelMapLoad(context);
        };
      });
  };

  renderDays();

  q(mask, "[data-map-retry]").onclick = () => {
    for (
      const [id, result] of context.results
    ) {
      if (result.error) {
        context.results.delete(id);
      }
    }

    travelMapLoad(context);
  };

  q(mask, "[data-geo-home]").onclick = () => {
    if (context.map && region) {
      context.map.fitBounds(
        region.bounds,
        { padding: [8, 8] }
      );
    }
  };

  try {
    if (!region) {
      throw new Error(
        "無法從專案名稱辨識目的地範圍，" +
        "暫不繪製不正確的底圖。"
      );
    }

    const island =
      /濟州|沖繩|北海道|jeju|okinawa|hokkaido/i
        .test(project.name);

    const [, land] = await Promise.all([
      travelMapAssetsReady(),

      island
        ? geographicLand()
        : Promise.resolve(null)
    ]);

    if (context.closed) return;

    context.map = L.map(
      q(mask, "[data-map-canvas]"),
      {
        scrollWheelZoom: false,
        zoomControl: false,
        zoomSnap: .25
      }
    );

    L.control.zoom({
      position: "bottomright"
    }).addTo(context.map);

    context.map.fitBounds(
      region.bounds,
      { padding: [8, 8] }
    );

    if (land) {
      const [
        [south, west],
        [north, east]
      ] = region.bounds;

      const features = land.filter(
        ({ bbox: [w, s, e, n] }) =>
          e >= west &&
          w <= east &&
          n >= south &&
          s <= north
      ).map(({ coordinates }) => ({
        type: "Feature",
        properties: {},
        geometry: {
          type: "Polygon",
          coordinates
        }
      }));

      if (!features.length) {
        throw new Error(
          "此範圍缺少地形資料，" +
          "暫不使用替代輪廓。"
        );
      }

      L.geoJSON(
        {
          type: "FeatureCollection",
          features
        },
        {
          interactive: false,

          style: {
            fillColor: "#eeedce",
            fillOpacity: 1,
            color: "#c8ceaa",
            weight: 2,
            lineJoin: "round",
            lineCap: "round"
          }
        }
      ).addTo(context.map);

      context.map.attributionControl.addAttribution(
        '<a href="https://www.naturalearthdata.com/" ' +
        'target="_blank" rel="noopener noreferrer">' +
        "Natural Earth</a> · 簡化海岸線"
      );
    } else {
      const tiles = L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          className: "geographic-pastel-tile",
          maxZoom: 19,

          attribution:
            '&copy; <a ' +
            'href="https://www.openstreetmap.org/copyright" ' +
            'target="_blank" rel="noopener noreferrer">' +
            "OpenStreetMap</a> contributors"
        }
      ).addTo(context.map);

      tiles.on("tileerror", () => {
        if (!context.closed) {
          q(mask, ".modal-error").textContent =
            "部分底圖載入失敗，請檢查網路。";
        }
      });
    }

    context.layer =
      L.layerGroup().addTo(context.map);

    context.map.on("dragstart", () => {
      context.touched = true;
    });

    context.map.invalidateSize();

    travelMapDraw(context);
    await travelMapLoad(context);
  } catch (error) {
    if (!context.closed) {
      q(
        mask,
        "[data-map-status]"
      ).textContent = error.message;

      q(
        mask,
        "[data-map-retry]"
      ).disabled = true;
    }
  }
};

/* ---------- 地圖快取、清楚數字與背景地標 ---------- */

const mapPlaceMemory = new Map();
const mapPlaceFailures = new Map();

const MAP_PLACE_TTL = 30 * 86400000;

const mapPlaceKey = (context, item) =>
  JSON.stringify([
    context.user.uid,
    context.project.id,
    item.id,
    String(item.customGoogleUrl || "").trim()
  ]);

function mapPlaceValid(record, url) {
  return (
    record &&
    record.version === 1 &&
    record.sourceUrl === url &&
    Number.isFinite(record.lat) &&
    Number.isFinite(record.lng) &&
    Math.abs(record.lat) <= 90 &&
    Math.abs(record.lng) <= 180 &&
    Number.isFinite(record.resolvedAt) &&
    record.resolvedAt <= Date.now() &&
    Date.now() - record.resolvedAt < MAP_PLACE_TTL
  );
}

function mapPlaceReadLocal(key) {
  try {
    return JSON.parse(
      localStorage.getItem("travel-place:" + key) ||
      "null"
    );
  } catch {
    return null;
  }
}

function mapPlaceStoreLocal(key, record) {
  try {
    localStorage.setItem(
      "travel-place:" + key,
      JSON.stringify(record)
    );
  } catch {
    // 裝置儲存空間不足時，仍能看地圖。
  }
}

/* 將成功定位結果存回行程，供成員共用 */

async function mapPlaceShare(context, item, record) {
  if (
    typeof runTransaction !== "function" ||
    uid() !== context.user.uid ||
    state.project?.id !== context.project.id
  ) return;

  try {
    const reference = doc(
      db,
      "projects",
      context.project.id,
      "schedules",
      item.id
    );

    return await runTransaction(
      db,
      async transaction => {
        const snapshot =
          await transaction.get(reference);

        if (
          !snapshot.exists() ||
          uid() !== context.user.uid ||
          state.project?.id !== context.project.id
        ) {
          return false;
        }

        const current = snapshot.data();

        if (
          String(current.customGoogleUrl || "").trim()
          !== record.sourceUrl
        ) {
          return false;
        }

        if (
          mapPlaceValid(
            current.resolvedGooglePlace,
            record.sourceUrl
          )
        ) {
          return true;
        }

        transaction.update(reference, {
          resolvedGooglePlace: record
        });

        return true;
      }
    );
  } catch {
    // 共用快取寫入失敗時，仍保留裝置快取。
  }
}

/* 優先讀取已保存的位置 */

const mapPlaceOriginalResolve = travelMapResolve;

travelMapResolve = async function (context, item) {
  const sourceUrl =
    String(item.customGoogleUrl || "").trim();

  const key = mapPlaceKey(context, item);

  if (sourceUrl) {
    const live =
      state.project?.id === context.project.id
        ? state.schedules.find(
            schedule => schedule.id === item.id
          )
        : null;

    const candidates = [
      live?.resolvedGooglePlace,
      item.resolvedGooglePlace,
      mapPlaceMemory.get(key),
      mapPlaceReadLocal(key)
    ];

    const cached = candidates.find(record =>
      mapPlaceValid(record, sourceUrl)
    );

    if (cached) {
      mapPlaceMemory.set(key, cached);
      mapPlaceStoreLocal(key, cached);

      if (
        !mapPlaceValid(
          live?.resolvedGooglePlace,
          sourceUrl
        )
      ) {
        await mapPlaceShare(
          context,
          item,
          cached
        );
      }

      return {
        lat: cached.lat,
        lng: cached.lng
      };
    }
  }

  const failed = mapPlaceFailures.get(key);

  if (
    failed &&
    failed.until > Date.now()
  ) {
    throw new Error(failed.message);
  }

  try {
    const coordinates =
      await mapPlaceOriginalResolve(context, item);

    const record = {
      version: 1,
      sourceUrl,
      lat: coordinates.lat,
      lng: coordinates.lng,
      resolvedAt: Date.now()
    };

    const accepted = await mapPlaceShare(
      context,
      item,
      record
    );

    if (accepted === false) {
      throw new Error(
        "行程網址或存取狀態已變更，請重新開啟地圖。"
      );
    }

    mapPlaceMemory.set(key, record);
    mapPlaceStoreLocal(key, record);
    mapPlaceFailures.delete(key);

    return coordinates;
  } catch (error) {
    if (!context.closed) {
      mapPlaceFailures.set(key, {
        message: error.message,
        until: Date.now() + 300000
      });
    }

    throw error;
  }
};

function mapInstallLandmarks(context) {
  if (context.landmarkLayer) return;

  const pane = context.map.createPane(
    "backgroundLandmarks"
  );

  pane.style.zIndex = "420";
  pane.style.pointerEvents = "none";

  context.landmarkLayer =
    L.layerGroup().addTo(context.map);

  const width = innerWidth < 500 ? 66 : 90;

  for (const place of MAP_BACKGROUND_LANDMARKS) {
    if (
      !travelMapContains(context.region, place)

    const icon = L.divIcon({
      className: "map-landmark",

      html:
        mapLandmarkArt(place.kind) +
        `

      iconSize: [
        width,
        width * .84

      iconAnchor: [

        width * .45

      [place.lat, place.lng],
      {
        icon,
        pane: "backgroundLandmarks",
        interactive: false,
        keyboard: false

    ).addTo(context.landmarkLayer);

/* 相鄰圖釘太近時合併，避免數字互相遮住 */

function mapArrangeNearby(context) {
  if (
    context.closed ||
    !context.map ||
    !context.layer
  ) return;

  if (!context.nearbyLayer) {
    context.nearbyLayer =
      L.layerGroup().addTo(context.map);
  }

  context.nearbyLayer.clearLayers();

  const markers = context.layer.getLayers();

  const parent = markers.map(
    (_, index) => index
  );

  const root = index => {
    while (parent[index] !== index) {
      parent[index] = parent[parent[index]];
      index = parent[index];
    }

    return index;
  };

  const pixels = markers.map(marker =>
    context.map.latLngToLayerPoint(
      marker.getLatLng()
    )
  );

  for (const marker of markers) {
    const element = marker.getElement();

    if (element) {
      element.style.display = "";
    }
  }

  for (
    let first = 0;
    first < markers.length;
    first++
  ) {
    for (
      let second = first + 1;
      second < markers.length;
      second++
    ) {
      if (
        pixels[first].distanceTo(
          pixels[second]
        ) < 48
      ) {
        parent[root(first)] = root(second);
      }
    }
  }

  const groups = new Map();

  markers.forEach((marker, index) => {
    const groupId = root(index);

    if (!groups.has(groupId)) {
      groups.set(groupId, []);
    }

    groups.get(groupId).push(marker);
  });

  const selected = travelMapSelected(context);

  for (const group of groups.values()) {
    if (group.length < 2) continue;

    const places = group.map(marker =>
      marker.getLatLng()
    );

    const items = selected.filter(item => {
      const coordinates =
        context.results.get(item.id);

      return (
        coordinates &&
        !coordinates.error &&
        places.some(place =>
          Math.abs(
            place.lat - coordinates.lat
          ) < 1e-6 &&
          Math.abs(
            place.lng - coordinates.lng
          ) < 1e-6
        )
      );
    });

    if (!items.length) continue;

    for (const marker of group) {
      marker.closePopup();

      const element = marker.getElement();

      if (element) {
        element.style.display = "none";
      }
    }

    const lat = places.reduce(
      (sum, place) => sum + place.lat,
      0
    ) / places.length;

    const lng = places.reduce(
      (sum, place) => sum + place.lng,
      0
    ) / places.length;

    const icon = L.divIcon({
      className: "map-nearby-marker",

      html: `
        <div class="map-nearby-count">
          ${items.length}筆
        </div>
      `,

      iconSize: [45, 45],
      iconAnchor: [22.5, 22.5]
    });

    L.marker(
      [lat, lng],
      {
        icon,
        zIndexOffset: 3000,
        title:
          `附近 ${items.length} 筆行程，點開查看`
      }
    )
      .bindPopup(
        mapNearbyPopup(context, items),
        {
          maxWidth: 280,
          maxHeight: 260
        }
      )
      .addTo(context.nearbyLayer);
  }
}

/* 接上原有地圖繪製流程 */

const mapUsabilityOriginalDraw = travelMapDraw;

travelMapDraw = function (context) {
  mapUsabilityOriginalDraw(context);

  if (
    !context.geoPrefix ||
    !context.map ||
    context.closed
  ) return;

  mapInstallLandmarks(context);
  mapArrangeNearby(context);

  if (!context.readabilityHook) {
    context.readabilityHook = true;

    context.map.on("zoomend", () =>
      mapArrangeNearby(context)
    );
  }
};

/* 明確按重試時，才立即重查失敗的項目 */

const mapUsabilityOriginalOpen = openTravelMap;

openTravelMap = async function () {
  const operation = mapUsabilityOriginalOpen();
  const context = travelMapCurrent;

  await operation;

  if (
    !context ||
    context.closed ||
    context !== travelMapCurrent
  ) return;

  const note = document.createElement("p");

  note.className = "map-cache-note";

  note.textContent =
    "地點位置會自動保留，修改網址後更新。" +
    "相近行程以「幾筆」合併，點開查看各站；" +
    "背景地標僅供概略參考。";

  q(
    context.mask,
    "[data-map-status]"
  ).after(note);

  const retry = q(
    context.mask,
    "[data-map-retry]"
  );

  const original = retry.onclick;

  retry.onclick = () => {
    for (
      const item of travelMapSelected(context)
    ) {
      mapPlaceFailures.delete(
        mapPlaceKey(context, item)
      );
    }

    original();
  };
};
  
/* ---------- 啟動 ---------- */
$("refresh").onclick = () => location.reload();

$("home-art").innerHTML = scene();
$("auth-art").innerHTML = scene();

$("auth-submit").disabled = false;
$("auth-switch").disabled = false;
$("boot-status").textContent = "";

window.travelModuleReady = true;

onAuthStateChanged(
  auth,
  handleAuth,
  error => notify(errorMessage(error))
);
</script>

setTimeout(() => {
  if (!window.travelModuleReady) {
    document.getElementById("boot-status").textContent =
      "旅行工具載入失敗。請確認網路可以連線 Firebase，然後重新整理。";
  }
}, 15000);
</script>
