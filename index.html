  const revision = projectRevision;

  const action = (button, operation) => {
    button.disabled = true;

    Promise.resolve()
      .then(operation)
      .catch(error => {
        if (mask.isConnected) {
          q(mask, ".modal-error").textContent =
            error.code
              ? errorMessage(error)
              : error.message;
        }
      })
      .finally(() => {
        button.disabled = false;
      });
  };

  root.querySelectorAll("[data-pay]")
    .forEach(button => {
      button.onclick = () => action(
        button,
        async () => {
          const transfer =
            available[Number(button.dataset.pay)];

          const signature = ledgerSignature();
          const basis = await basisHash(signature);

          if (
            signature !== ledgerSignature() ||
            extra.payments.some(payment =>
              payment.status === "paid" &&
              payment.currency === transfer.currency
            ) ||
            !ledger().some(current =>
              current.currency === transfer.currency &&
              current.fromName === transfer.fromName &&
              current.toName === transfer.toName &&
              current.units === transfer.units
            )
          ) {
            throw new Error(
              "帳目或付款狀態已變更，請重新開啟結算卡。"
            );
          }

          if (revision !== projectRevision) return;

          const fromUid =
            accountUid(transfer.fromName);

          const toUid =
            accountUid(transfer.toName);

          if (fromUid !== uid() || !toUid) {
            throw new Error(
              "請重新開啟結算卡確認成員。"
            );
          }

          const paymentId =
            basis + "_" +
            fromUid + "_" +
            toUid + "_" +
            transfer.currency;

          await runTransaction(db, async transaction => {
            const reference = doc(
              db,
              "projects",
              projectId,
              "payments",
              paymentId
            );

            const snapshot =
              await transaction.get(reference);

            if (snapshot.exists()) {
              throw new Error(
                "這筆付款已登記，請等待同步。"
              );
            }

            transaction.set(reference, {
              ...transfer,
              fromUid,
              toUid,
              basis,
              status: "paid",
              createdAt: Date.now(),
              receivedAt: 0
            });
          });
        }
      );
    });

  root.querySelectorAll("[data-receive]")
    .forEach(button => {
      button.onclick = () => action(
        button,
        async () => {
          if (
            !confirm(
              "請確認已實際收到這筆款項。" +
              "確認後會計入結算，且不能撤回。"
            )
          ) return;

          const reference = doc(
            db,
            "projects",
            projectId,
            "payments",
            button.dataset.receive
          );

          await runTransaction(db, async transaction => {
            const snapshot =
              await transaction.get(reference);

            if (
              !snapshot.exists() ||
              snapshot.data().status !== "paid" ||
              snapshot.data().toUid !== uid()
            ) {
              throw new Error(
                "付款狀態已變更，請重開結算卡。"
              );
            }

            transaction.update(reference, {
              status: "received",
              receivedAt: Date.now()
            });
          });
        }
      );
    });

  root.querySelectorAll("[data-cancel-pay]")
    .forEach(button => {
      button.onclick = () => action(
        button,
        async () => {
          const reference = doc(
            db,
            "projects",
            projectId,
            "payments",
            button.dataset.cancelPay
          );

          await runTransaction(db, async transaction => {
            const snapshot =
              await transaction.get(reference);

            if (
              !snapshot.exists() ||
              snapshot.data().status !== "paid" ||
              snapshot.data().fromUid !== uid()
            ) {
              throw new Error(
                "這筆付款已確認或狀態改變。"
              );
            }

            transaction.delete(reference);
          });
        }
      );
    });
}

$("settle").onclick = openSettlement;

/* ---------- 訂閱與離開專案時清理 ---------- */

const oldStartProject = startProject;

startProject = function () {
  extra.pendingDay = true;
  extra.packing = null;
  extra.payments = [];
  extra.paymentsReady = false;
  extra.error = "";

  oldStartProject();

  const projectId = state.project.id;
  const reference = packingRef();
  const revision = projectRevision;

  const failed = error => {
    if (revision !== projectRevision) return;

    extra.error =
      errorMessage(error) +
      " 請確認新增功能的 Firestore 規則已發布。";

    drawPacking();

    document.querySelectorAll(
      "[data-settlement]"
    ).forEach(drawSettlement);
  };

  state.unsubscribers.push(
    onSnapshot(
      reference,
      snapshot => {
        if (revision !== projectRevision) return;

        if (snapshot.exists()) {
          extra.packing = snapshot.data();
          drawPacking();
        } else {
          mutatePacking(() => {}, reference)
            .then(() => {
              if (revision === projectRevision) {
                return queryPacking();
              }
            })
            .catch(failed);
        }
      },
      failed
    )
  );

  state.unsubscribers.push(
    onSnapshot(
      collection(
        db,
        "projects",
        projectId,
        "payments"
      ),
      snapshot => {
        if (revision !== projectRevision) return;

        extra.payments = snapshot.docs.map(item => ({
          ...item.data(),
          id: item.id
        }));

        extra.paymentsReady = true;

        document.querySelectorAll(
          "[data-settlement]"
        ).forEach(drawSettlement);
      },
      failed
    )
  );
};

const oldStopProject = stopProject;

stopProject = function () {
  extra.controller?.abort();
  extra.controller = null;

  extra.mask?.remove();
  extra.mask = null;

  extra.packing = null;
  extra.payments = [];

  oldStopProject();
};

const oldRenderExpenses = renderExpenses;

renderExpenses = function () {
  oldRenderExpenses();

  document.querySelectorAll(
    "[data-settlement]"
  ).forEach(drawSettlement);
};

/* ---------- 啟動 ---------- */
$("refresh").onclick = () => location.reload();

$("home-art").innerHTML = scene();
$("auth-art").innerHTML = scene();

$("auth-submit").disabled = false;
$("auth-switch").disabled = false;
$("boot-status").textContent = "";

window.travelModuleReady = true;

onAuthStateChanged(
  auth,
  handleAuth,
  error => notify(errorMessage(error))
);
