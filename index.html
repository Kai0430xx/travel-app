<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧳 我的旅遊專案清單</title>
    <!-- PWA 手機桌面 App 圖標與全螢幕設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="放風 ✈">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #f7f3ee; 
            max-width: 480px; 
            margin: auto; 
            min-height: 100vh; 
            position: relative; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            letter-spacing: 0.4px;
            color: #4a403b;
        }
        .cute-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(180, 150, 130, 0.08);
            border: 1.5px solid #eae1d7;
        }
        .badge-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed #d98262;
            background: #fffaf5;
            transition: all 0.3s ease;
        }
        .badge-circle.unlocked {
            border: 2px solid #d98262;
            background: #f0dcd0;
            box-shadow: 0 4px 12px rgba(217, 130, 98, 0.2);
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #e2d3c3; border-radius: 4px; }
    </style>
</head>
<body class="pb-28 text-gray-800">

    <!-- 頂部標題區 -->
    <header class="bg-[#f3e9de] text-[#5c4a3d] px-4 py-4 shadow-sm sticky top-0 z-50 flex justify-between items-center rounded-b-[24px] border-b border-[#eae1d7]">
        <div class="flex items-center gap-2 min-w-0 pr-2">
            <button id="back-btn" onclick="window.backToProjects()" class="hidden bg-white/90 hover:bg-white text-[#5c4a3d] px-3 py-1.5 rounded-full text-xs font-bold shadow-sm transition active:scale-95 shrink-0 border border-[#eae1d7]">
                專案
            </button>
            <div class="min-w-0">
                <h1 id="header-title" class="text-sm font-black truncate flex items-center gap-1">🧳 我的旅遊專案清單</h1>
                <p id="header-sub" class="text-[11px] text-[#8c7868] opacity-90 truncate mt-0.5">選擇你的冒險旅程 ✨</p>
            </div>
        </div>
        <button id="share-btn" onclick="window.shareCurrentProject()" class="hidden bg-white/90 hover:bg-white text-[#5c4a3d] text-xs px-3.5 py-1.5 rounded-full font-bold shadow-sm transition active:scale-95 shrink-0 border border-[#eae1d7]">
            ✨ 分享
        </button>
    </header>

    <!-- 內容容器 -->
    <main class="p-4 space-y-4">
        
        <!-- 視圖 0：專案選擇首頁 -->
        <div id="view-projects" class="space-y-4">
            <div class="flex justify-between items-center px-1">
                <h2 class="font-black text-[#5c4a3d] text-sm tracking-wide">我的旅遊小專案 ✈</h2>
                <div class="flex gap-2">
                    <button onclick="window.openImportProjectModal()" class="bg-white text-[#d98262] border border-[#d98262]/40 text-xs px-3 py-2.5 rounded-full font-black shadow-sm transition active:scale-95">
                        📥 導入專案
                    </button>
                    <button onclick="window.openNewProjectModal()" class="bg-gradient-to-r from-[#d98262] to-[#e69c7c] text-white text-xs px-4 py-2.5 rounded-full font-black shadow-md shadow-orange-900/10 transition active:scale-95">
                        ＋ 新增專案
                    </button>
                </div>
            </div>
            <div id="project-list" class="space-y-3.5">
                <p class="text-center text-xs text-gray-400 py-8">載入中... ☁️</p>
            </div>
        </div>

        <!-- 視圖 1：專案內部功能 (預設隱藏) -->
        <div id="view-workspace" class="hidden space-y-4">
            
            <!-- 分頁 1：行程 -->
            <div id="tab-schedule" class="tab-content space-y-4">
                <div id="upcoming-card-container"></div>
                <div id="day-pills-container" class="flex gap-2 overflow-x-auto pb-1 pt-0.5 px-1 scrollbar-none"></div>
                <div class="flex justify-between items-center px-1 pt-1">
                    <h3 class="font-black text-[#736052] text-xs tracking-wider">📅 完整行程時間軸</h3>
                    <div class="flex gap-2">
                        <button onclick="window.openSmartPasteModal()" class="bg-white hover:bg-orange-50 text-[#d98262] border border-[#d98262]/30 text-xs px-3 py-1.5 rounded-full font-black shadow-sm transition active:scale-95">✨ 智慧導入</button>
                        <button onclick="window.openAddScheduleModal()" class="bg-[#d98262] text-white text-xs px-3.5 py-1.5 rounded-full font-black shadow-sm transition active:scale-95">＋ 新增</button>
                    </div>
                </div>
                <div id="schedule-container" class="space-y-3">
                    <p class="text-center text-xs text-gray-400 py-6">正在載入行程... ⏳</p>
                </div>
            </div>

            <!-- 分頁 2：提醒 -->
            <div id="tab-ai" class="tab-content hidden space-y-3.5">
                <div id="dynamic-reminders-container" class="space-y-3.5"></div>
            </div>

            <!-- 分頁 3：語言 -->
            <div id="tab-lang" class="tab-content hidden space-y-4">
                <div class="cute-card p-5 bg-gradient-to-br from-[#fffaf5] to-[#fbf2e9] space-y-3 shadow-md text-center relative border-[#e2d3c3]">
                    <div class="absolute top-3 left-4">
                        <span class="text-[10px] bg-[#f0dcd0] text-[#735848] px-2.5 py-0.5 rounded-full font-black">🗣 實用翻譯發音</span>
                    </div>
                    <div class="pt-3 space-y-1">
                        <p id="display-cn" class="text-xs text-[#8c7868] font-bold">請點選下方分類與句子 ▼</p>
                        <h2 id="display-foreign" class="text-xl font-black text-[#5c4a3d] mt-1 break-words">請選擇想說的話 ✨</h2>
                    </div>
                    <div class="pt-1">
                        <button onclick="window.speakCurrentPhrase()" class="bg-[#d98262] text-white px-5 py-2.5 rounded-full text-xs font-black shadow-md shadow-orange-900/10 transition active:scale-95 inline-flex items-center gap-1.5">🔊 點擊朗讀</button>
                    </div>
                </div>
                <div class="grid grid-cols-12 gap-3">
                    <div id="lang-categories" class="col-span-4 space-y-2"></div>
                    <div id="lang-phrases" class="col-span-8 space-y-2.5 max-h-[420px] overflow-y-auto pr-1">
                        <div class="cute-card p-4 text-center text-xs text-gray-400">請先點選左側分類</div>
                    </div>
                </div>
            </div>

            <!-- 分頁 4：分帳 -->
            <div id="tab-split" class="tab-content hidden space-y-4">
                <div class="bg-gradient-to-r from-[#d98262] to-[#e08e6d] text-white p-5 rounded-[24px] shadow-lg shadow-orange-900/10 space-y-2">
                    <div class="flex justify-between items-center">
                        <p class="text-xs opacity-90 font-medium">✨ 旅程總花費 (折合台幣)</p>
                        <button onclick="window.openAddMemberModal()" class="bg-white/20 hover:bg-white/30 text-white text-[11px] px-3 py-1.5 rounded-full font-bold transition">＋ 管理成員</button>
                    </div>
                    <h3 id="total-expense-twd" class="text-2xl font-black tracking-tight">NT$ 0</h3>
                    <div id="currency-breakdown" class="text-[11px] opacity-90 flex gap-3 pt-1 border-t border-white/20 flex-wrap"></div>
                </div>
                <div class="flex justify-between items-center px-1">
                    <h3 class="font-black text-[#736052] text-xs tracking-wider">💰 帳目與結算</h3>
                    <div class="flex gap-2">
                        <button onclick="window.openSettlementModal()" class="bg-[#f0dcd0] text-[#735848] text-xs px-3.5 py-2 rounded-full font-black shadow-sm transition active:scale-95">📊 查看結算</button>
                        <button onclick="window.openAddExpenseModal()" class="bg-gradient-to-r from-[#d98262] to-[#e69c7c] text-white text-xs px-3.5 py-2 rounded-full font-black shadow-sm transition active:scale-95">＋ 記一筆</button>
                    </div>
                </div>
                <div id="expense-list-container" class="space-y-2.5">
                    <p class="text-center text-xs text-gray-400 py-6">目前還沒有記帳，點上方按鈕開始記帳吧！✨</p>
                </div>
            </div>

            <!-- 分頁 5：闖關 -->
            <div id="tab-quest" class="tab-content hidden space-y-4">
                <div class="cute-card p-5 bg-gradient-to-br from-[#fffaf5] to-[#fbf2e9] space-y-4 shadow-md border-[#e2d3c3]">
                    <div class="flex justify-between items-center">
                        <span id="quest-total-count" class="text-xs font-black text-[#d98262]">已打卡 0 / 0</span>
                        <button onclick="window.openPhotoGalleryModal()" class="bg-[#d98262] text-white text-[11px] px-3.5 py-1.5 rounded-full font-black shadow-sm transition active:scale-95">📸 旅程回憶寫真冊</button>
                    </div>
                    <div>
                        <div class="flex justify-between text-xs font-black text-[#736052] mb-1">
                            <span>整體解鎖進度</span>
                            <span id="quest-percent">0%</span>
                        </div>
                        <div class="w-full bg-[#eae1d7] h-3 rounded-full overflow-hidden">
                            <div id="quest-progress-bar" class="bg-[#d98262] h-full transition-all duration-500 rounded-full" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3 pt-2 border-t border-[#eae1d7] text-center">
                        <div class="flex flex-col items-center">
                            <div id="badge-food" class="badge-circle">
                                <span class="text-lg">🍽️</span>
                                <span class="text-[9px] font-black text-[#735848] mt-0.5">美食</span>
                            </div>
                            <p class="text-[10px] font-black text-[#5c4a3d] mt-1.5" id="badge-food-title">未解鎖</p>
                        </div>
                        <div class="flex flex-col items-center">
                            <div id="badge-spot" class="badge-circle">
                                <span class="text-lg">🗺️</span>
                                <span class="text-[9px] font-black text-[#735848] mt-0.5">景點</span>
                            </div>
                            <p class="text-[10px] font-black text-[#5c4a3d] mt-1.5" id="badge-spot-title">未解鎖</p>
                        </div>
                        <div class="flex flex-col items-center">
                            <div id="badge-shop" class="badge-circle">
                                <span class="text-lg">🛍️</span>
                                <span class="text-[9px] font-black text-[#735848] mt-0.5">購物</span>
                            </div>
                            <p class="text-[10px] font-black text-[#5c4a3d] mt-1.5" id="badge-shop-title">未解鎖</p>
                        </div>
                    </div>
                </div>

                <div id="quest-list-container" class="space-y-3">
                    <p class="text-center text-xs text-gray-400 py-6">正在載入闖關任務... ⏳</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Modals -->
    <div id="import-project-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="cute-card bg-white w-full max-w-sm p-6 space-y-4 shadow-2xl text-xs">
            <div class="flex justify-between items-center">
                <h3 class="font-black text-[#5c4a3d] text-base">📥 輸入 6 位數專案號碼</h3>
                <button onclick="window.closeImportProjectModal()" class="text-gray-400 font-black text-base">✕</button>
            </div>
            <input type="text" id="import-code-input" maxlength="6" placeholder="例如：883921" class="w-full p-3.5 bg-[#fffaf5] border border-[#eae1d7] rounded-2xl outline-none font-bold text-center text-lg tracking-widest">
            <div class="flex gap-2.5 pt-2">
                <button onclick="window.closeImportProjectModal()" class="flex-1 bg-gray-100 text-gray-600 py-3 rounded-full font-black">取消</button>
                <button onclick="window.submitImportProject()" class="flex-1 bg-[#d98262] text-white py-3 rounded-full font-black shadow-md">確認導入</button>
            </div>
        </div>
    </div>

    <div id="share-choice-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="cute-card bg-white w-full max-w-sm p-6 space-y-4 shadow-2xl text-xs text-center">
            <div class="flex justify-between items-center">
                <h3 class="font-black text-[#5c4a3d] text-base">✨ 分享此專案</h3>
                <button onclick="window.closeShareModal()" class="text-gray-400 font-black text-base">✕</button>
            </div>
            <p id="share-modal-pin" class="text-2xl font-black text-[#d98262] tracking-widest">------</p>
            <button onclick="window.copySharePin()" class="w-full bg-[#f0dcd0] text-[#735848] py-2 rounded-xl font-black">📋 複製 6 位數代碼</button>
            <button onclick="window.copyShareUrl()" class="w-full bg-[#d98262] text-white py-3 rounded-full font-black shadow-md">🔗 複製專屬網址</button>
        </div>
    </div>

    <div id="login-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="cute-card bg-white w-full max-w-sm p-6 space-y-4 shadow-2xl text-xs">
            <h3 class="font-black text-[#5c4a3d] text-base text-center">🌸 歡迎加入放風之旅</h3>
            <input type="text" id="login-name-input" placeholder="例如：小明" class="w-full p-3.5 bg-[#fffaf5] border border-[#eae1d7] rounded-2xl outline-none font-bold text-center text-sm">
            <button onclick="window.submitLoginName()" class="w-full bg-[#d98262] text-white py-3.5 rounded-full font-black shadow-md">進入旅程 🚀</button>
        </div>
    </div>

    <!-- 底部導覽列 -->
    <nav id="bottom-nav" class="hidden fixed bottom-3 left-4 right-4 max-w-[448px] mx-auto bg-white/95 backdrop-blur-md border border-[#eae1d7] flex justify-around py-3 rounded-2xl shadow-xl z-50">
        <button onclick="window.switchTab('schedule')" id="nav-schedule" class="flex flex-col items-center text-[#d98262] text-xs font-black gap-0.5"><span class="text-xl">📅</span>行程</button>
        <button onclick="window.switchTab('ai')" id="nav-ai" class="flex flex-col items-center text-gray-400 text-xs font-bold gap-0.5"><span class="text-xl">💡</span>提醒</button>
        <button onclick="window.switchTab('lang')" id="nav-lang" class="flex flex-col items-center text-gray-400 text-xs font-bold gap-0.5"><span class="text-xl">🗣</span>語言</button>
        <button onclick="window.switchTab('split')" id="nav-split" class="flex flex-col items-center text-gray-400 text-xs font-bold gap-0.5"><span class="text-xl">💰</span>分帳</button>
        <button onclick="window.switchTab('quest')" id="nav-quest" class="flex flex-col items-center text-gray-400 text-xs font-bold gap-0.5"><span class="text-xl">🎯</span>闖關</button>
    </nav>

        // 🌟 嚴格在最上方標準宣告所有核心函式並綁定到 window
        window.enterProject = async function(id) {
            currentProjectId = id;
            try {
                const docSnap = await getDoc(doc(db, "projects", id));
                if (docSnap.exists()) {
                    const p = docSnap.data();
                    currentProjectName = p.name;
                    currentProjectPin = p.pin || "";
                }
            } catch (e) {}

            if (!currentMyName) {
                document.getElementById('login-modal').classList.remove('hidden');
                return;
            }

            window.proceedEnterProject();
        };

        window.proceedEnterProject = function() {
            document.getElementById('view-projects').classList.add('hidden');
            document.getElementById('view-workspace').classList.remove('hidden');
            document.getElementById('bottom-nav').classList.remove('hidden');
            document.getElementById('back-btn').classList.remove('hidden');
            document.getElementById('share-btn').classList.remove('hidden');
            
            document.getElementById('header-title').innerText = `🌸 ${currentProjectName}`;
            document.getElementById('header-sub').innerText = `旅伴：${currentMyName} ✨`;
            
            window.renderRemindersByRules(currentProjectName);
            window.initLanguageModule(currentProjectName);
            window.loadMembersAndExpenses(currentProjectId);
            window.loadCheckins(currentProjectId);
            
            window.switchTab('schedule');
            window.loadSchedules(currentProjectId);
        };

        window.backToProjects = function() {
            currentProjectId = null;
            currentProjectName = "";
            currentProjectPin = "";
            if (unsubscribeSchedules) unsubscribeSchedules();
            if (unsubscribeExpenses) unsubscribeExpenses();
            if (unsubscribeMembers) unsubscribeMembers();
            if (unsubscribeCheckins) unsubscribeCheckins();
            document.getElementById('view-workspace').classList.add('hidden');
            document.getElementById('bottom-nav').classList.add('hidden');
            document.getElementById('back-btn').classList.add('hidden');
            document.getElementById('share-btn').classList.add('hidden');
            document.getElementById('view-projects').classList.remove('hidden');
            document.getElementById('header-title').innerText = "🧳 我的旅遊專案清單";
            document.getElementById('header-sub').innerText = "選擇你的冒險旅程 ✨";
            renderProjects();
        };

        window.shareCurrentProject = function() {
            if (!currentProjectId) return;
            document.getElementById('share-modal-pin').innerText = currentProjectPin || '未設定';
            document.getElementById('share-choice-modal').classList.remove('hidden');
        };

        window.switchTab = function(tabName) {
            ['schedule', 'ai', 'lang', 'split', 'quest'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                const navEl = document.getElementById(`nav-${t}`);
                if (el) el.classList.add('hidden');
                if (navEl) navEl.className = "flex flex-col items-center text-gray-400 text-xs font-bold gap-0.5";
            });
            const targetTab = document.getElementById(`tab-${tabName}`);
            const targetNav = document.getElementById(`nav-${tabName}`);
            if (targetTab) targetTab.classList.remove('hidden');
            if (targetNav) targetNav.className = "flex flex-col items-center text-[#d98262] text-xs font-black gap-0.5";
        };

        window.updateExpenseModalDropdowns = function() {
            const payerSelect = document.getElementById('exp-payer');
            const container = document.getElementById('exp-participants-container');
            if (!payerSelect || !container) return;
            payerSelect.innerHTML = '';
            container.innerHTML = '';
            allMembersData.forEach(m => {
                let opt = document.createElement('option');
                opt.value = m.name;
                opt.innerText = m.name;
                if (m.name === currentMyName) opt.selected = true;
                payerSelect.appendChild(opt);

                let div = document.createElement('div');
                div.className = "flex justify-between items-center bg-white p-2 rounded-xl border border-[#eae1d7]";
                div.innerHTML = `
                    <label class="flex items-center gap-2 font-bold text-gray-700 cursor-pointer">
                        <input type="checkbox" name="participant" value="${m.name}" checked class="rounded accent-[#d98262]"> ${m.name}
                    </label>
                    <span class="text-gray-400 font-bold text-[11px]">參與均攤</span>
                `;
                container.appendChild(div);
            });
        };

        window.renderRemindersByRules = function(projectName) {
            const container = document.getElementById('dynamic-reminders-container');
            if (!container) return;
            let nameLower = (projectName || '').toLowerCase();
            let html = `
                <div class="cute-card p-5 space-y-2.5">
                    <h3 class="font-black text-[#5c4a3d] text-sm flex items-center gap-1.5">🌍 國際自由行通用指南</h3>
                    <p class="text-xs text-gray-600 leading-relaxed">請留意護照效期（需大於 6 個月）、備妥當地網卡、萬用轉接頭與海外旅遊平安險。</p>
                </div>
            `;
            container.innerHTML = html;
        };

        window.initLanguageModule = function(projectName) {
            let nameLower = (projectName || '').toLowerCase();
            let destKey = 'general';
            if (nameLower.includes('濟州') || nameLower.includes('韓國') || nameLower.includes('釜山') || nameLower.includes('首爾')) destKey = 'korea';
            else if (nameLower.includes('東京') || nameLower.includes('日本') || nameLower.includes('大阪') || nameLower.includes('京都')) destKey = 'japan';

            const currentLangPack = languageData[destKey];
            currentDestinationLang = currentLangPack.langCode;
            const catContainer = document.getElementById('lang-categories');
            if (!catContainer) return;
            catContainer.innerHTML = '';
            currentLangPack.categories.forEach((cat, idx) => {
                let btn = document.createElement('button');
                btn.className = `w-full text-left text-xs font-black p-3 rounded-2xl transition border ${idx === 0 ? 'bg-[#d98262] text-white border-[#d98262] shadow-sm' : 'bg-white text-gray-700 border-[#eae1d7]'}`;
                btn.innerText = cat.name;
                btn.onclick = () => window.renderPhrases(currentLangPack.phrases[cat.id]);
                catContainer.appendChild(btn);
            });
            window.renderPhrases(currentLangPack.phrases[currentLangPack.categories[0].id]);
        };

        window.renderPhrases = function(phrases) {
            const phraseContainer = document.getElementById('lang-phrases');
            if (!phraseContainer) return;
            phraseContainer.innerHTML = '';
            phrases.forEach(p => {
                let card = document.createElement('div');
                card.className = "cute-card p-3.5 bg-white border border-[#eae1d7] cursor-pointer transition flex justify-between items-center";
                card.innerHTML = `<div><p class="text-xs text-gray-800 font-bold">${p.cn}</p></div>`;
                card.onclick = () => {
                    currentActivePhrase = p;
                    document.getElementById('display-cn').innerText = p.cn;
                    document.getElementById('display-foreign').innerText = p.foreign;
                };
                phraseContainer.appendChild(card);
            });
        };

        window.loadMembersAndExpenses = function(projId) {
            const membersRef = collection(db, "projects", projId, "members");
            if (unsubscribeMembers) unsubscribeMembers();
            unsubscribeMembers = onSnapshot(membersRef, (snapshot) => {
                allMembersData = [];
                snapshot.forEach(docSnap => { allMembersData.push({ id: docSnap.id, ...docSnap.data() }); });
                renderMemberListUI();
                updateExpenseModalDropdowns();
            });

            const expensesRef = collection(db, "projects", projId, "expenses");
            if (unsubscribeExpenses) unsubscribeExpenses();
            unsubscribeExpenses = onSnapshot(query(expensesRef, orderBy("createdAt", "desc")), (snapshot) => {
                allExpensesData = [];
                snapshot.forEach(docSnap => { allExpensesData.push({ id: docSnap.id, ...docSnap.data() }); });
                renderExpenseUI();
            });
        };

        window.loadCheckins = function(projId) {
            const checkinsRef = collection(db, "projects", projId, "checkins");
            if (unsubscribeCheckins) unsubscribeCheckins();
            unsubscribeCheckins = onSnapshot(checkinsRef, (snapshot) => {
                allCheckinsData = {};
                snapshot.forEach(docSnap => {
                    let data = docSnap.data();
                    if (data.uploader === currentMyName) { allCheckinsData[data.scheduleId] = data; }
                });
            });
        };

        window.loadSchedules = function(projId) {
            const schedulesRef = collection(db, "projects", projId, "schedules");
            const q = query(schedulesRef, orderBy("createdAt", "asc"));
            if (unsubscribeSchedules) unsubscribeSchedules();
            unsubscribeSchedules = onSnapshot(q, (snapshot) => {
                allSchedulesData = [];
                snapshot.forEach((docSnap) => { allSchedulesData.push({ id: docSnap.id, ...docSnap.data() }); });
                renderScheduleUI();
            });
        };

        window.cleanDisplayTitle = function(title) {
            if (!title) return '';
            return title.replace(/^\d{1,2}[:：]\d{2}\s*/, '').trim();
        };

        window.renderMemberListUI = function() {
            const container = document.getElementById('member-list-display');
            if (!container) return;
            container.innerHTML = '';
            allMembersData.forEach(m => {
                let div = document.createElement('div');
                div.className = "flex justify-between items-center p-3 bg-[#fffaf5] border border-[#eae1d7] rounded-2xl font-bold";
                div.innerHTML = `<span>👤 ${m.name}</span>`;
                container.appendChild(div);
            });
        };

        window.renderExpenseUI = function() {
            const container = document.getElementById('expense-list-container');
            const totalEl = document.getElementById('total-expense-twd');
            if (!container) return;
            if (allExpensesData.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-gray-400 py-6">目前還沒有記帳！✨</p>`;
                if (totalEl) totalEl.innerText = "NT$ 0";
                return;
            }
            container.innerHTML = '';
            let sum = 0;
            allExpensesData.forEach(exp => {
                sum += (exp.amount || 0);
                let div = document.createElement('div');
                div.className = "cute-card p-3.5 bg-white border border-[#eae1d7] flex justify-between items-center";
                div.innerHTML = `<span>${exp.title}</span><span class="font-black text-[#d98262]">${exp.currency} ${exp.amount}</span>`;
                container.appendChild(div);
            });
            if (totalEl) totalEl.innerText = `NT$ ${sum.toLocaleString()}`;
        };

        window.renderScheduleUI = function() {
            const container = document.getElementById('schedule-container');
            if (!container) return;
            if (allSchedulesData.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-gray-400 py-6">目前還沒有行程！✨</p>`;
                return;
            }
            container.innerHTML = '';
            allSchedulesData.forEach(s => {
                let div = document.createElement('div');
                div.className = "p-3.5 bg-[#fffaf5] rounded-2xl border border-[#eae1d7] flex justify-between items-center";
                div.innerHTML = `<div><span class="text-[10px] bg-[#f0dcd0] text-[#735848] px-2 py-0.5 rounded-md font-black">${s.time || '全天'}</span><h5 class="font-black text-gray-900 text-sm mt-1">${s.title}</h5></div>`;
                container.appendChild(div);
            });
        };

        async function getMyProjectIds() {
            let localList = JSON.parse(localStorage.getItem('my_subscribed_projects')) || [];
            if (!currentMyName) return localList;
            try {
                const docRef = doc(db, "user_profiles", currentMyName);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && docSnap.data().projects) {
                    let cloudList = docSnap.data().projects;
                    return Array.from(new Set([...localList, ...cloudList]));
                }
            } catch (e) {}
            return localList;
        }

        async function saveMyProjectId(id) {
            let list = await getMyProjectIds();
            if (!list.includes(id)) {
                list.unshift(id);
                localStorage.setItem('my_subscribed_projects', JSON.stringify(list));
            }
        }

        async function renderProjects() {
            const list = document.getElementById('project-list');
            if (!list) return;
            try {
                let myIds = await getMyProjectIds();
                if (myIds.length === 0) {
                    list.innerHTML = `<p class="text-center text-xs text-gray-400 py-8">目前沒有專案。點上方按鈕新增，或輸入 6 位數專案號碼導入！✨</p>`;
                    return;
                }
                list.innerHTML = '';
                for (let id of myIds) {
                    try {
                        const docRef = doc(db, "projects", id);
                        const docSnap = await getDoc(docRef);
                        if (docSnap.exists()) {
                            const p = docSnap.data();
                            const card = document.createElement('div');
                            card.className = "cute-card p-5 space-y-3 relative transition hover:border-[#d98262] cursor-pointer";
                            card.onclick = () => window.enterProject(id);
                            card.innerHTML = `
                                <div class="flex justify-between items-center gap-2 w-full">
                                    <span class="text-xs bg-[#f0dcd0] text-[#735848] px-3 py-1 rounded-full font-black shrink-0">進行中 🚗</span>
                                    <span class="text-xs text-gray-500 font-bold">${p.dates || '未定日期'}</span>
                                </div>
                                <div class="space-y-1">
                                    <h3 class="font-black text-gray-900 text-base break-words">🌸 ${p.name}</h3>
                                </div>
                            `;
                            list.appendChild(card);
                        }
                    } catch (e) {}
                }
            } catch (e) {
                list.innerHTML = `<p class="text-center text-xs text-red-400 py-8">載入專案發生錯誤！</p>`;
            }
        }
        window.renderProjects = renderProjects;

        window.submitLoginName = async function() {
            const name = document.getElementById('login-name-input').value.trim();
            if (!name) { alert("請輸入名字！"); return; }
            currentMyName = name;
            localStorage.setItem('my_travel_nickname', name);
            document.getElementById('login-modal').classList.add('hidden');
            window.proceedEnterProject();
        };

        window.openImportProjectModal = function() {
            document.getElementById('import-code-input').value = '';
            document.getElementById('import-project-modal').classList.remove('hidden');
        };
        window.closeImportProjectModal = function() {
            document.getElementById('import-project-modal').classList.add('hidden');
        };

        // 初始化應用程式
        async function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const sharedProjId = urlParams.get('project');
            if (sharedProjId) {
                await saveMyProjectId(sharedProjId);
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            renderProjects();
        }

        initApp();
    </script>
</body>
</html>
